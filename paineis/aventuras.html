<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Aliases locais → tokens.css */
  :root {
    --bg-deep: var(--bg);
    --bg-mid: var(--bg-soft);
    --gold-bright: var(--gold);
    --blood: var(--border);
    --blood-bright: var(--bronze);
    --parchment: var(--text);
    --parchment-dim: var(--text-muted);
  }

  html, body {
    min-height: 100vh;
    width: 100%;
    background-color: var(--bg-deep);
    background-image: radial-gradient(ellipse at top, color-mix(in srgb, var(--surface) 70%, var(--bg)) 0%, var(--bg-mid) 55%, var(--bg) 100%);
    font-family: var(--font-body);
    color: var(--parchment);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index: 0;
  }

  .back-btn { position: fixed; top: 16px; left: 16px; z-index: 10; }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    width: 100%;
    text-align: center;
  }

  .crest {
    font-size: 44px;
    color: var(--gold-bright);
    margin-bottom: 16px;
    display: block;
  }

  .title {
    font-family: var(--font-heading-deco);
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--gold-bright);
    font-variant: small-caps;
    line-height: 1.2;
  }

  .subtitle {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 16px;
    color: var(--parchment-dim);
    margin-top: 10px;
    letter-spacing: 2px;
  }
  .subtitle::before { content: '— '; color: var(--gold-bright); opacity: .6; }
  .subtitle::after  { content: ' —'; color: var(--gold-bright); opacity: .6; }

  .divider {
    width: 70%;
    max-width: 500px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 24px auto;
  }

  .prompt {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--parchment-dim);
    margin-bottom: 36px;
  }

  .campaigns {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .campaign-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 44px 36px 36px;
    width: clamp(260px, 38vw, 420px);
    position: relative;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    box-shadow: 0 4px 16px var(--shadow);
    overflow: hidden;
  }

  .campaign-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold-bright), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .campaign-card:hover {
    transform: translateY(-4px);
    border-color: var(--border);
    box-shadow: 0 14px 32px var(--shadow);
  }
  .campaign-card:hover::after { opacity: 1; }

  .campaign-card .corner {
    position: absolute;
    color: var(--border);
    font-size: 12px;
    opacity: 0.5;
    transition: opacity 0.3s, color 0.3s;
  }
  .campaign-card:hover .corner { opacity: 0.9; color: var(--gold-bright); }
  .corner.tl { top: 8px; left: 12px; }
  .corner.tr { top: 8px; right: 12px; }
  .corner.bl { bottom: 8px; left: 12px; }
  .corner.br { bottom: 8px; right: 12px; }

  .campaign-icon {
    font-size: 60px;
    color: var(--gold-bright);
    margin-bottom: 22px;
    transition: transform 0.3s, color 0.3s;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .campaign-card:hover .campaign-icon { color: var(--gold-light); transform: scale(1.06); }

  .campaign-name {
    font-family: var(--font-heading);
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 700;
    color: var(--parchment);
    letter-spacing: .5px;
    line-height: 1.25;
    margin-bottom: 10px;
  }

  .campaign-desc {
    font-family: var(--font-body);
    font-style: italic;
    font-size: clamp(13px, 1.4vw, 16px);
    color: var(--parchment-dim);
    line-height: 1.6;
  }

  .campaign-cta {
    margin-top: 26px;
    padding: 9px 28px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--parchment-dim);
    font-family: var(--font-heading);
    font-size: clamp(10px, 1vw, 12px);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
  }
  .campaign-card:hover .campaign-cta {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold-bright);
  }

  /* Maldição de Strahd continua no card medieval geral — só um pequeno
     detalhe vermelho (fio embaixo do ícone + cantos) indica a campanha
     gótica. A ruptura visual completa só acontece ao entrar nela. */
  .campaign-card.strahd .campaign-icon::after {
    content: '';
    display: block;
    width: 26px; height: 2px;
    margin: 10px auto 0;
    background: var(--danger);
    opacity: .6;
    border-radius: 2px;
  }
  .campaign-card.strahd .corner { color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
  .campaign-card.strahd:hover .corner { color: var(--danger); opacity: .85; }

  .campaign-card.locked { opacity: 0.45; cursor: not-allowed; border-style: dashed; }
  .campaign-card.locked:hover { transform: none; box-shadow: 0 4px 16px var(--shadow); border-color: var(--border-soft); }
  .campaign-card.locked:hover .campaign-icon { transform: none; }

  .footer {
    margin-top: 52px;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 13px;
    color: var(--text-muted);
    opacity: .55;
    letter-spacing: 1px;
  }

  @media (max-width: 1100px) and (min-width: 701px) {
    .campaigns { gap: 24px; }
    .campaign-card { width: clamp(240px, 42vw, 360px); padding: 40px 32px 32px; }
    .campaign-icon { font-size: 60px; }
  }

  @media (max-width: 700px) {
    .title { font-size: 24px; letter-spacing: 2px; }
    .campaign-card { width: 100%; max-width: 100%; padding: 36px 28px 30px; min-height: 220px; }
    .campaigns { gap: 20px; flex-direction: column; align-items: center; }
    .campaign-icon { font-size: 52px; }
    .campaign-cta { padding: 14px 28px; min-height: 44px; font-size: 12px; }
  }

  .campaign-card:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .campaign-card, .campaign-card * { transition: none !important; }
  }
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" integrity="sha384-GPb5RlngihS9H0z1D137JsvzmeZ7tCpWEF4t5YDoTZyMsPP8S7h7vFDh4XhheU83" crossorigin="anonymous"></script>
