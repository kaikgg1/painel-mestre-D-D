<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entrar no Painel do Mestre — D&D 5e">
<meta name="theme-color" content="#0a0608">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<title>Entrar — Painel do Mestre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0608;
    --bg-card: #1a1018;
    --bg-card-soft: #221520;
    --gold: #8B6914;
    --gold-bright: #b88a2c;
    --gold-light: #d4a843;
    --blood: #6b1010;
    --blood-bright: #8b1d1d;
    --parchment: #d4c5a0;
    --parchment-dim: #a89878;
    --shadow: #050304;
  }

  html, body {
    min-height: 100vh; min-height: 100dvh;
    background-color: var(--bg-deep);
    background-image:
      radial-gradient(ellipse at top, #2a1518 0%, #150a0c 40%, #050304 100%),
      radial-gradient(circle at 25% 80%, rgba(139,29,29,0.06) 0%, transparent 60%),
      radial-gradient(circle at 75% 20%, rgba(139,105,20,0.05) 0%, transparent 60%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
    display: grid; place-items: center;
    padding: 20px 16px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 0;
  }

  .card {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 460px;
    background: linear-gradient(160deg, #1f1416 0%, #150c0e 60%, #0d0709 100%);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 36px 32px 28px;
    box-shadow:
      0 16px 48px rgba(0,0,0,0.8),
      inset 0 0 32px rgba(0,0,0,0.5),
      0 0 0 1px var(--blood) inset;
  }
  .corner { position: absolute; color: var(--blood); font-size: 14px; opacity: 0.7; }
  .corner.tl { top: 8px; left: 12px; }
  .corner.tr { top: 8px; right: 12px; }
  .corner.bl { bottom: 8px; left: 12px; }
  .corner.br { bottom: 8px; right: 12px; }

  /* ====== HEADER ====== */
  .crest {
    display: block; text-align: center;
    font-size: 52px; line-height: 1; margin-bottom: 14px;
    filter: drop-shadow(0 0 14px rgba(139,105,20,0.5));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-4px); }
  }
  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(20px, 5vw, 26px); font-weight: 900;
    letter-spacing: 3px; text-align: center;
    color: var(--gold-bright);
    text-shadow: 0 0 24px rgba(184,138,44,0.45), 1px 1px 0 var(--shadow);
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center; font-style: italic; font-size: 13px;
    color: var(--parchment-dim); letter-spacing: 1.5px;
    margin-bottom: 24px;
  }
  .subtitle::before { content: '— '; color: var(--blood-bright); }
  .subtitle::after  { content: ' —'; color: var(--blood-bright); }

  /* ====== SEÇÕES ====== */
  .secao { margin-bottom: 16px; }
  .secao:last-child { margin-bottom: 0; }
  .secao-label {
    display: block; margin-bottom: 10px;
    font-family: 'Cinzel', serif; font-size: 10px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold);
    text-align: center;
  }

  /* ====== JOGADORES ====== */
  .jogadores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .jogador-btn {
    background: linear-gradient(160deg, var(--bg-card-soft), var(--bg-card));
    border: 1.5px solid rgba(139,105,20,0.45);
    border-radius: 6px;
    color: var(--parchment);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.2s, background 0.2s;
    font-family: 'Cinzel', serif;
    text-align: center;
    padding: 14px 8px 10px;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    min-height: 80px;
  }
  .jogador-btn .icone { font-size: 24px; line-height: 1; filter: drop-shadow(0 0 4px rgba(0,0,0,0.6)); }
  .jogador-btn .nome { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .jogador-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: var(--gold-bright);
    box-shadow: 0 6px 14px rgba(0,0,0,0.5);
  }
  .jogador-btn.selecionado {
    background: linear-gradient(160deg, var(--gold), #6a4f0e);
    border-color: var(--gold-light);
    color: var(--shadow);
    box-shadow: 0 0 18px rgba(212,168,67,0.4);
  }

  /* ====== MESTRE ====== */
  .mestre-btn {
    width: 100%;
    background: linear-gradient(160deg, #2a1014, #1a0608);
    border: 1.5px solid var(--blood);
    border-radius: 6px;
    color: var(--parchment);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Cinzel', serif;
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    min-height: 52px;
  }
  .mestre-btn .ic { font-size: 20px; color: var(--gold-bright); }
  .mestre-btn .nome { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  .mestre-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: var(--blood-bright);
    box-shadow: 0 6px 14px rgba(139,29,29,0.4);
  }
  .mestre-btn.selecionado {
    background: linear-gradient(160deg, var(--blood-bright), var(--blood));
    border-color: var(--blood-bright);
    color: var(--parchment);
    box-shadow: 0 0 18px rgba(139,29,29,0.5);
  }
  .mestre-btn.selecionado .ic { color: var(--parchment); }

  /* ====== ENTRAR ====== */
  .btn-entrar {
    display: block; width: 100%;
    padding: 14px 18px;
    margin-top: 18px;
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    border: 1px solid var(--gold-bright);
    color: var(--shadow);
    font-family: 'Cinzel', serif; font-size: 13px;
    font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 50px;
  }
  .btn-entrar:hover:not(:disabled) {
    background: linear-gradient(to bottom, var(--gold-bright), var(--gold));
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(184,138,44,0.4);
  }
  .btn-entrar:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-entrar:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  .erro {
    margin-top: 12px; padding: 10px 14px;
    background: rgba(107,16,16,0.25);
    border: 1px solid var(--blood-bright);
    color: #f4b8a8;
    font-size: 13px; border-radius: 4px;
    display: none;
  }
  .erro.show { display: block; }

  .voltar {
    margin-top: 18px; text-align: center;
    font-size: 12px; color: var(--parchment-dim);
    font-style: italic;
  }
  .voltar a { color: var(--gold-bright); text-decoration: none; transition: color 0.2s; }
  .voltar a:hover { color: var(--gold-light); text-decoration: underline; }

  /* ====== RESPONSIVO ====== */
  @media (max-width: 480px) {
    body { padding: 12px 8px; }
    .card { padding: 28px 20px 22px; border-width: 1.5px; border-radius: 6px; }
    .crest { font-size: 40px; margin-bottom: 10px; }
    .title { letter-spacing: 2px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; margin-bottom: 20px; letter-spacing: 1px; }
    .secao-label { margin-bottom: 8px; font-size: 9px; }
    .secao { margin-bottom: 14px; }
    .jogadores { gap: 8px; }
    .jogador-btn { min-height: 76px; padding: 12px 6px 10px; }
    .jogador-btn .icone { font-size: 22px; }
    .jogador-btn .nome { font-size: 11px; }
    .mestre-btn { padding: 12px 14px; min-height: 48px; }
    .mestre-btn .ic { font-size: 18px; }
    .mestre-btn .nome { font-size: 12px; letter-spacing: 1.5px; }
    .btn-entrar { margin-top: 14px; padding: 14px; font-size: 12px; letter-spacing: 2px; min-height: 48px; }
  }

  /* Telas muito estreitas */
  @media (max-width: 340px) {
    .jogadores { grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="card">
  <span class="corner tl" aria-hidden="true">✠</span>
  <span class="corner tr" aria-hidden="true">✠</span>
  <span class="corner bl" aria-hidden="true">✠</span>
  <span class="corner br" aria-hidden="true">✠</span>

  <span class="crest" aria-hidden="true">⚔️</span>
  <h1 class="title">Entrar na Mesa</h1>
  <p class="subtitle">Escolha seu nome</p>

  <form id="login-form" novalidate>
    <div class="secao">
      <span class="secao-label">Jogador</span>
      <div class="jogadores" role="radiogroup" aria-label="Selecionar jogador">
        <button type="button" class="jogador-btn" data-nome="Sabrina123" role="radio" aria-checked="false">
          <span class="icone" aria-hidden="true">🧝‍♀️</span>
          <span class="nome">Sabrina</span>
        </button>
        <button type="button" class="jogador-btn" data-nome="Derik123" role="radio" aria-checked="false">
          <span class="icone" aria-hidden="true">⚔️</span>
          <span class="nome">Derik</span>
        </button>
        <button type="button" class="jogador-btn" data-nome="Felipe123" role="radio" aria-checked="false">
          <span class="icone" aria-hidden="true">🏹</span>
          <span class="nome">Felipe</span>
        </button>
      </div>
    </div>

    <div class="secao">
      <span class="secao-label">Mestre</span>
      <button type="button" class="mestre-btn" data-nome="Mestre123" role="radio" aria-checked="false">
        <span class="ic" aria-hidden="true">👑</span>
        <span class="nome">Mestre</span>
      </button>
    </div>

    <input type="hidden" id="nome-selecionado" required>
    <button type="submit" class="btn-entrar" id="btn-entrar" disabled>Entrar</button>
    <div class="erro" id="erro" role="alert" aria-live="polite"></div>
  </form>

  <p class="voltar">
    <a href="../index.html">← Voltar à tela inicial</a>
  </p>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const form  = document.getElementById('login-form');
  const btn   = document.getElementById('btn-entrar');
  const erro  = document.getElementById('erro');
  const hidden = document.getElementById('nome-selecionado');

  (async () => {
    const u = await window.Auth.getUser();
    if (u) location.replace('../index.html');
  })();

  document.querySelectorAll('.jogador-btn, .mestre-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.jogador-btn, .mestre-btn').forEach(x => {
        x.classList.remove('selecionado');
        x.setAttribute('aria-checked', 'false');
      });
      b.classList.add('selecionado');
      b.setAttribute('aria-checked', 'true');
      hidden.value = b.dataset.nome;
      btn.disabled = false;
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.classList.remove('show');
    const nome = hidden.value;
    if (!nome) { erro.textContent = 'Escolha um jogador.'; erro.classList.add('show'); return; }

    btn.disabled = true; btn.textContent = 'Entrando…';
    const r = await window.Auth.entrarPorNome(nome);
    if (!r.ok) {
      erro.textContent = 'Falha ao entrar: ' + r.erro;
      erro.classList.add('show');
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    const params = new URLSearchParams(location.search);
    const from   = params.get('from');
    location.replace(from || '../index.html');
  });
</script>
</body>
</html>
