<!-- Estilo da ficha — extraído do <style> inline (ver assets/css/ficha/).
     A ORDEM importa: estes arquivos vêm depois de components.css e antes de
     ui.css, exatamente como o bloco inline vinha. Concatenados na ordem
     abaixo eles reproduzem o CSS original byte a byte (Fase 0/1). nav.css é
     novo (Fase 2, bottom nav mobile) e só define seletores inéditos, então
     não precisa respeitar essa ordem — está ao fim da lista. -->
<link rel="stylesheet" href="../assets/css/ficha/base.css">

<body data-ambiente="fagulhas">

<!-- Header (§3): duas linhas dentro do MESMO .site-header sticky.
     #hdr-id e #hdr-meta são preenchidos por renderHeader() (header.js) a
     cada render() — ver assets/js/ficha/header.js. -->
<header class="site-header">
  <div class="hdr-linha hdr-linha-principal">
    <a href="../index.html" class="back-btn" aria-label="Voltar">
      <span aria-hidden="true">←</span><span class="back-btn-lbl">Voltar</span>
    </a>
    <div class="hdr-id" id="hdr-id"></div>
    <div class="auth-slot" id="auth-slot" aria-label="Status de login"></div>
  </div>
  <div class="hdr-linha hdr-linha-meta" id="hdr-meta"></div>
</header>

<main>
  <div id="conteudo">
    <div class="estado">Carregando…</div>
  </div>
</main>

<!-- Navegação inferior mobile (§18) — populada por nav_mobile.js a partir
     das abas reais de #tabs; some em telas largas (ver nav.css). -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal"></nav>

<!-- (Removido) Toast de permissão — mudanças do Mestre agora se aplicam automaticamente -->
<div class="toast" id="toast-auto" role="status" aria-live="polite"></div>
