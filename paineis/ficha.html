<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Minha Ficha — Personagem D&D 5e">
<meta name="theme-color" content="#0a0608">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<title>Minha Ficha — D&D 5e</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0608;
    --bg-card: #1a1018;
    --bg-card-soft: #221520;
    --bg-input: rgba(255,255,255,0.04);
    --gold: #8B6914;
    --gold-bright: #b88a2c;
    --gold-light: #d4a843;
    --blood: #6b1010;
    --blood-bright: #8b1d1d;
    --parchment: #d4c5a0;
    --parchment-dim: #a89878;
    --shadow: #050304;
    --text-dim: #8c7d5e;
    --ok: #8fc28f;
    --erro: #e88a8a;
  }

  html, body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg-deep) radial-gradient(ellipse at top, #1e1018 0%, #0d0810 50%, #050304 100%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
  }

  /* ============ HEADER ============ */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,6,8,0.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--gold);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }
  .back-btn {
    text-decoration: none; color: var(--parchment-dim);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid var(--gold);
    border-radius: 2px; transition: all 0.2s;
  }
  .back-btn:hover { background: var(--gold); color: var(--shadow); }
  .header-title {
    font-family: 'Cinzel Decorative', serif; font-size: clamp(15px, 3vw, 22px);
    font-weight: 700; color: var(--gold-bright); letter-spacing: 2px;
    flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .auth-slot { display: flex; align-items: center; gap: 8px; font-family: 'Cinzel', serif; font-size: 11px; }
  .auth-nome { color: var(--parchment-dim); letter-spacing: 1px; }
  .auth-btn {
    padding: 6px 12px; background: transparent;
    border: 1px solid var(--gold); color: var(--parchment-dim);
    border-radius: 2px; font-family: 'Cinzel', serif; font-size: 10px;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    text-decoration: none; cursor: pointer; transition: all 0.2s;
  }
  .auth-btn:hover { background: var(--gold); color: var(--shadow); }
  @media (max-width: 600px) { .auth-nome { display: none; } }

  /* ============ MAIN ============ */
  main { max-width: 1000px; margin: 18px auto; padding: 0 14px 36px; }
  .estado { padding: 30px; text-align: center; color: var(--text-dim); font-style: italic; }

  /* ============ BARRA DE PERSONAGEM ============ */
  .char-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
    border: 1px solid rgba(139,105,20,0.4);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .char-bar .pj-label {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .char-bar select {
    flex: 1; min-width: 180px;
    background: var(--bg-input); border: 1px solid var(--gold);
    color: var(--parchment); font-family: 'EB Garamond', serif;
    font-size: 15px; padding: 8px 12px; border-radius: 3px; outline: none;
  }
  .char-bar select:focus { border-color: var(--gold-bright); }
  .char-bar option { background: #1a1018; }

  .btn { padding: 9px 14px; background: transparent;
    border: 1px solid var(--gold); color: var(--parchment);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    border-radius: 3px; cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { background: var(--gold); color: var(--shadow); }
  .btn.danger { border-color: var(--blood); color: #c47a5a; }
  .btn.danger:hover { background: var(--blood); color: var(--parchment); }
  .btn.primary {
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    border-color: var(--gold-bright); color: var(--shadow);
  }
  .btn.primary:hover { background: linear-gradient(to bottom, var(--gold-bright), var(--gold)); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* AVISO DE FICHA NÃO VISÍVEL PRO MESTRE */
  .aviso-visibilidade {
    background: linear-gradient(160deg, rgba(184,138,44,0.18), rgba(107,16,16,0.18));
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.5;
  }
  .aviso-visibilidade.ok {
    background: rgba(46,134,46,0.12);
    border-color: #2e862e;
    color: var(--ok);
  }
  .aviso-visibilidade .icone { font-size: 18px; flex-shrink: 0; }
  .aviso-visibilidade strong { color: var(--gold-bright); }

  /* ESTRELA "ATIVO" */
  .estrela-ativo {
    background: transparent; border: 1px solid rgba(139,105,20,0.4);
    color: var(--parchment-dim); font-size: 18px; line-height: 1;
    padding: 8px 12px; border-radius: 3px; cursor: pointer;
    transition: all 0.2s; min-width: 42px; min-height: 42px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Cinzel', serif;
  }
  .estrela-ativo .lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .estrela-ativo:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
  .estrela-ativo.ativo {
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    color: var(--shadow); border-color: var(--gold-bright);
    box-shadow: 0 0 12px rgba(212,168,67,0.4);
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 0;
    border-bottom: 1px solid rgba(139,105,20,0.4);
    overflow-x: auto; scrollbar-width: thin;
  }
  .tab {
    padding: 11px 18px; background: transparent;
    border: none; border-bottom: 2px solid transparent;
    color: var(--parchment-dim); font-family: 'Cinzel', serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .tab:hover { color: var(--gold-bright); }
  .tab.ativa { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
  .tab:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: -2px; }

  .tab-content {
    background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
    border: 1px solid rgba(139,105,20,0.4);
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 22px;
  }

  /* ============ CAMPOS ============ */
  h3 {
    font-family: 'Cinzel Decorative', serif; color: var(--gold-bright);
    font-size: 16px; letter-spacing: 1px;
    margin: 18px 0 12px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(139,105,20,0.3);
  }
  h3:first-of-type { margin-top: 0; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }

  .campo label {
    display: block; font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%; background: var(--bg-input);
    border: 1px solid rgba(139,105,20,0.3); color: var(--parchment);
    font-family: 'EB Garamond', serif; font-size: 14px;
    padding: 8px 11px; border-radius: 3px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus {
    border-color: var(--gold-bright); background: rgba(255,255,255,0.07);
  }
  .campo input.erro, .campo select.erro, .campo textarea.erro {
    border-color: var(--erro); background: rgba(139,29,29,0.15);
  }
  .campo textarea { min-height: 70px; resize: vertical; font-family: 'EB Garamond', serif; line-height: 1.5; }
  .campo .ajuda { display: block; margin-top: 4px; font-size: 11px; font-style: italic; color: var(--text-dim); }
  .campo .erro-msg { display: none; margin-top: 4px; font-size: 11px; color: var(--erro); }
  .campo.tem-erro .erro-msg { display: block; }
  .campo select option { background: #1a1018; color: var(--parchment); }

  /* ============ ATRIBUTOS (modificador em cima) ============ */
  .atributo {
    text-align: center;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(139,105,20,0.4);
    border-radius: 6px; padding: 12px 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .atributo .nome-atr {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .atributo .modificador {
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    color: var(--gold-bright); font-size: 28px; line-height: 1;
    background: linear-gradient(180deg, rgba(184,138,44,0.12), transparent);
    padding: 6px 0; border-radius: 4px;
    text-shadow: 0 0 12px rgba(184,138,44,0.3);
  }
  .atributo .valor-base {
    background: transparent; border: 1px solid rgba(139,105,20,0.3);
    color: var(--parchment); font-family: 'Cinzel', serif;
    font-size: 15px; font-weight: 600; text-align: center;
    padding: 4px 6px; border-radius: 3px; width: 100%;
  }
  .atributo .valor-base:focus { outline: 1px solid var(--gold-bright); }

  /* ============ AÇÕES ============ */
  .acoes {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 24px; padding-top: 18px;
    border-top: 1px solid rgba(139,105,20,0.3);
    align-items: center; flex-wrap: wrap;
  }
  .status-msg { margin-right: auto; font-size: 13px; font-style: italic; color: var(--text-dim); }
  .status-msg.ok    { color: var(--ok); }
  .status-msg.erro  { color: var(--erro); }

  /* ============ EQUIPAMENTO ============ */
  .moedas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .moeda-box {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(139,105,20,0.4);
    border-radius: 4px; padding: 10px 6px; text-align: center;
  }
  .moeda-box label { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); letter-spacing: 1px; }
  .moeda-box input { width: 100%; background: transparent; border: none; color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; text-align: center; margin-top: 4px; outline: none; }
  .moeda-box input:focus { background: rgba(255,255,255,0.08); border-radius: 3px; }

  .item-tabela {
    width: 100%; border-collapse: collapse; margin-top: 10px;
    background: rgba(0,0,0,0.15); border-radius: 4px; overflow: hidden;
  }
  .item-tabela th, .item-tabela td {
    padding: 8px 10px; text-align: left; font-size: 13px;
    border-bottom: 1px solid rgba(139,105,20,0.2);
  }
  .item-tabela th {
    background: rgba(139,105,20,0.18); color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  }
  .item-tabela tr:last-child td { border-bottom: none; }
  .item-tabela .lixo {
    background: transparent; border: 1px solid rgba(139,29,29,0.4); color: #c47a5a;
    padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  .item-tabela .lixo:hover { background: var(--blood); color: var(--parchment); }
  .item-vazio { padding: 18px; text-align: center; color: var(--text-dim); font-style: italic; }

  .adicionar-bloco { display: flex; gap: 8px; align-items: end; margin-top: 14px; flex-wrap: wrap; }
  .adicionar-bloco .campo { flex: 1; min-width: 160px; margin: 0; }

  /* ============ MAGIAS PREPARADAS ============ */
  .magias-lista { display: flex; flex-direction: column; gap: 6px; }
  .magia-item {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(139,105,20,0.25);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .magia-item:hover { border-color: rgba(139,105,20,0.5); }
  .magia-item.aberta { border-color: var(--gold-bright); }
  .magia-row {
    display: grid; grid-template-columns: 50px 1fr 100px 110px 28px;
    gap: 10px; align-items: center;
    padding: 10px 12px; cursor: pointer;
    user-select: none;
  }
  .magia-nivel { font-family: 'Cinzel', serif; font-weight: 700; color: var(--gold-bright); font-size: 13px; }
  .magia-nome  { color: var(--parchment); font-size: 14px; }
  .magia-escola { font-size: 11px; color: var(--text-dim); font-style: italic; }
  .magia-tags  { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .magia-tags span {
    font-size: 9px; padding: 2px 6px; border-radius: 2px;
    background: rgba(139,29,29,0.3); color: #c47a5a;
    font-family: 'Cinzel', serif; letter-spacing: 0.5px;
  }
  .magia-chevron {
    color: var(--gold); font-size: 14px; text-align: center;
    transition: transform 0.2s;
  }
  .magia-item.aberta .magia-chevron { transform: rotate(90deg); color: var(--gold-bright); }

  .magia-detalhe {
    padding: 0 14px 14px;
    border-top: 1px solid rgba(139,105,20,0.2);
    margin-top: 0;
    display: none;
    background: rgba(0,0,0,0.15);
  }
  .magia-item.aberta .magia-detalhe { display: block; }
  .magia-info {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px 14px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(139,105,20,0.15);
    margin-bottom: 10px;
  }
  .magia-info-item { font-size: 12px; }
  .magia-info-key {
    font-family: 'Cinzel', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 2px;
  }
  .magia-info-val { color: var(--parchment); }
  .magia-desc { font-size: 13px; line-height: 1.6; color: var(--parchment); }
  .magia-desc p { margin-bottom: 8px; }
  .magia-maior {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(139,105,20,0.2);
    font-size: 12px; color: var(--parchment-dim); font-style: italic;
  }
  .magia-maior strong { color: var(--gold-bright); font-style: normal; }

  @media (max-width: 600px) {
    .magia-row { grid-template-columns: 40px 1fr 24px; row-gap: 4px; }
    .magia-escola, .magia-tags { grid-column: 2 / 4; font-size: 10px; }
    .magia-info { grid-template-columns: 1fr 1fr; }
  }

  /* ============ HABILIDADES ============ */
  .habilidade-card {
    background: rgba(0,0,0,0.2); border: 1px solid rgba(139,105,20,0.3);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 10px;
  }
  .habilidade-card h4 {
    font-family: 'Cinzel', serif; color: var(--gold-bright);
    font-size: 13px; margin-bottom: 6px;
  }
  .habilidade-card p { font-size: 13px; line-height: 1.55; color: var(--parchment); }

  /* PERÍCIAS / SALVAGUARDAS */
  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  @media (max-width: 600px) { .check-grid { grid-template-columns: 1fr; } }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; background: rgba(0,0,0,0.15);
    border: 1px solid rgba(139,105,20,0.2); border-radius: 3px;
    font-size: 13px;
  }
  .check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
  .check-row .atr-tag { font-size: 9px; color: var(--text-dim); margin-left: 4px; letter-spacing: 1px; }
  /* Checkbox medieval custom — substitui o input padrão */
  .check-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border: 1.5px solid var(--gold);
    background: var(--shadow);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check-row input[type="checkbox"]:hover { border-color: var(--gold-bright); box-shadow: 0 0 4px rgba(184,138,44,0.4); }
  .check-row input[type="checkbox"]:checked {
    background: linear-gradient(160deg, var(--gold-bright), var(--gold));
    border-color: var(--gold-bright);
    box-shadow: 0 0 6px rgba(212,168,67,0.5);
  }
  .check-row input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    color: var(--shadow);
    font-weight: 900;
    font-size: 14px;
    line-height: 1;
  }
  .check-row input[type="checkbox"]:disabled {
    opacity: 0.3; cursor: not-allowed; border-color: var(--text-dim);
  }
  .check-row input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }
  .check-row .exp-marker {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-dim); letter-spacing: 1px;
    margin-left: auto;
  }
  .check-row .exp-marker input { accent-color: var(--gold-bright); }
  /* Valor calculado da salvaguarda/perícia (modificador + proficiência) */
  .check-row .valor-calc {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 14px; color: var(--gold-bright);
    background: rgba(139,105,20,0.18);
    border: 1px solid rgba(184,138,44,0.4);
    padding: 3px 9px; border-radius: 12px;
    min-width: 38px; text-align: center;
    margin-left: auto;
  }

  /* ============ VISUAL COMBATE: HP + stats principais ============ */
  .combate-hero {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr;
    gap: 14px; margin-bottom: 20px;
  }
  @media (max-width: 700px) { .combate-hero { grid-template-columns: 1fr; } }

  .hp-wrap {
    background: linear-gradient(160deg, rgba(107,16,16,0.25), rgba(0,0,0,0.4));
    border: 1px solid var(--blood);
    border-radius: 8px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  .hp-titulo {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .hp-icone { font-size: 18px; }
  .hp-numero {
    text-align: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 28px; font-weight: 900;
    color: var(--gold-bright);
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(184,138,44,0.4);
  }
  .hp-numero input {
    background: transparent; border: none;
    color: inherit; font-family: inherit; font-size: inherit;
    font-weight: inherit; text-align: center;
    width: 70px; outline: none;
    border-bottom: 1px dashed rgba(184,138,44,0.3);
  }
  .hp-numero input:focus { border-bottom-color: var(--gold-bright); }
  .hp-numero .sep { color: var(--text-dim); margin: 0 4px; font-size: 22px; }
  .hp-temp-label { font-size: 11px; color: var(--text-dim); }
  .hp-temp-label input {
    width: 32px; background: transparent; border: none;
    color: var(--gold-light); font-weight: 700; text-align: center;
  }
  .hp-bar {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(139,29,29,0.5);
    border-radius: 4px;
    height: 18px;
    overflow: hidden;
    position: relative;
  }
  .hp-fill {
    height: 100%; transition: width 0.4s, background 0.4s;
    background: linear-gradient(90deg, #6b1010, #8b1d1d);
  }
  .hp-fill.medio { background: linear-gradient(90deg, #6b3010, #b88a2c); }
  .hp-fill.baixo { background: linear-gradient(90deg, #4a0808, #6b1010); }
  .hp-fill.critico { background: repeating-linear-gradient(45deg, #4a0808, #4a0808 6px, #6b1010 6px, #6b1010 12px); animation: hp-pulse 1s ease-in-out infinite; }
  @keyframes hp-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  .hp-percent {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--parchment); letter-spacing: 1px;

  }

  .stat-hero {
    background: rgba(0,0,0,0.3);

  }
  .stat-hero .stat-icone { font-size: 26px; line-height: 1; margin-bottom: 6px; }
  .stat-hero .stat-titulo {
    font-family: 'Cinzel', serif; font-size: 10px;

  /* Stats menores (iniciativa, deslocamento, dado de vida, exaustão) */

  @media (max-width: 700px) { .stats-mini { grid-template-columns: repeat(2, 1fr); } }
  .stat-mini {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(139,105,20,0.3);

  .stat-mini .ic { font-size: 18px; line-height: 1; margin-bottom: 4px; display: block; }
  .stat-mini label {
    display: block;
    font-family: 'Cinzel', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1px;

  .stat-mini input, .stat-mini select {

  .stat-mini .ajuda-mini { display: block; font-size: 9px; color: var(--text-dim); margin-top: 3px; font-style: italic; }

  .lista-tags {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start;

  .lista-tags .tag {

    font-size: 12px; color: var(--parchment);
  }
  .lista-tags .tag .x {
    cursor: pointer; color: var(--blood-bright); font-weight: 700;
    padding: 0 2px; border-radius: 50%;
  }
  .lista-tags .tag .x:hover { background: var(--blood-bright); color: var(--parchment); }
  .lista-tags-add { display: flex; gap: 6px; margin-top: 6px; }
  .lista-tags-add input { flex: 1; }

  /* ============ RESPONSIVIDADE ============ */
  @media (max-width: 800px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
    .moedas { grid-template-columns: repeat(2, 1fr); }
    .magia-row { grid-template-columns: 50px 1fr; row-gap: 4px; }
    .magia-escola, .magia-tags { grid-column: 2; }
  }
  @media (max-width: 480px) {
    main { padding: 0 8px 30px; }
    .tab-content { padding: 14px 12px; }
    .char-bar { padding: 10px; gap: 8px; }
    .char-bar select { font-size: 14px; min-height: 40px; }
    .btn { min-height: 40px; padding: 10px 12px; }
    .estrela-ativo { min-height: 44px; min-width: 60px; }
    .grid-6 { grid-template-columns: repeat(2, 1fr); }
    .atributo { padding: 14px 8px; }
    .atributo .modificador { font-size: 24px; }
    .atributo .valor-base { padding: 8px 4px; font-size: 16px; min-height: 36px; }
    /* Tabs: scroll horizontal limpo */
    .tabs { gap: 0; padding: 0 4px; }

    /* Check rows: touch friendly */
    .check-row { padding: 10px 12px; }
    .check-row input[type="checkbox"] { width: 22px; height: 22px; }
    .moedas { grid-template-columns: repeat(3, 1fr); }
    .moeda-box input { font-size: 16px; min-height: 36px; }
    /* Inputs ficam +touch */

    .campo textarea { font-size: 14px; }
  }
  *:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="back-btn">← Voltar</a>
  <div class="header-title" id="hdr-titulo">Minha Ficha</div>
  <div class="auth-slot" id="auth-slot" aria-label="Status de login"></div>
</header>

<main>
  <div id="conteudo">
    <div class="estado">Carregando…</div>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/phb_catalogo.js"></script>
<script>
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

const RACAS = ['','Anão','Elfo','Halfling','Humano','Draconato','Gnomo','Meio-Elfo','Meio-Orc','Tiefling'];
const CLASSES = ['','Bárbaro','Bardo','Bruxo','Clérigo','Druida','Feiticeiro','Guerreiro','Ladino','Mago','Monge','Paladino','Patrulheiro'];
const ALINHAMENTOS = ['','Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau'];
const ATRIBUTOS = [['for','Força'],['dex','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];
const CAMPANHAS = [
  ['', '— sem campanha —'],
  ['barovia', 'Maldição de Strahd (Barovia)'],
  ['mestre',  'Crônica dos Aventureiros'],
];

// Subclasses oficiais do PHB 5e por classe (chave normalizada → lista)
const SUBCLASSES_POR_CLASSE = {
  'barbaro':    ['Caminho do Furioso', 'Caminho do Guerreiro Totêmico'],
  'bardo':      ['Colégio do Conhecimento', 'Colégio do Valor'],
  'bruxo':      ['Patrono Arquifada', 'Patrono Senhor das Trevas', 'Patrono Grande Antigo'],
  'clerigo':    ['Domínio do Conhecimento', 'Domínio da Vida', 'Domínio da Luz', 'Domínio da Natureza', 'Domínio da Tempestade', 'Domínio Trapaceiro', 'Domínio da Guerra'],
  'druida':     ['Círculo da Terra', 'Círculo da Lua'],
  'feiticeiro': ['Linhagem Dracônica', 'Magia Selvagem'],
  'guerreiro':  ['Campeão', 'Mestre de Batalha', 'Cavaleiro Místico'],
  'ladino':     ['Ladrão', 'Assassino', 'Trapaceiro Arcano'],
  'mago':       ['Escola de Abjuração', 'Escola de Adivinhação', 'Escola de Conjuração', 'Escola de Encantamento', 'Escola de Evocação', 'Escola de Ilusão', 'Escola de Necromancia', 'Escola de Transmutação'],
  'monge':      ['Caminho da Mão Aberta', 'Caminho da Sombra', 'Caminho dos Quatro Elementos'],
  'paladino':   ['Juramento de Devoção', 'Juramento dos Anciões', 'Juramento de Vingança'],
  'patrulheiro':['Caçador', 'Mestre das Feras'],
};

// Perícias do PHB 5e (PT-BR) — mapeadas para o atributo base
const PERICIAS = [
  ['acrobacia',         'Acrobacia',         'dex'],
  ['adestrar_animais',  'Adestrar Animais',  'sab'],
  ['arcanismo',         'Arcanismo',         'int'],
  ['atletismo',         'Atletismo',         'for'],
  ['atuacao',           'Atuação',           'car'],
  ['enganacao',         'Enganação',         'car'],
  ['furtividade',       'Furtividade',       'dex'],
  ['historia',          'História',          'int'],
  ['intimidacao',       'Intimidação',       'car'],
  ['intuicao',          'Intuição',          'sab'],
  ['investigacao',      'Investigação',      'int'],
  ['medicina',          'Medicina',          'sab'],
  ['natureza',          'Natureza',          'int'],
  ['percepcao',         'Percepção',         'sab'],
  ['persuasao',         'Persuasão',         'car'],
  ['prestidigitacao',   'Prestidigitação',   'dex'],
  ['religiao',          'Religião',          'int'],
  ['sobrevivencia',     'Sobrevivência',     'sab'],
];

// Habilidades fixas por classe x nível (carregadas async)
let HABILIDADES_CLASSES = null;
async function carregarHabilidadesClasses() {
  if (HABILIDADES_CLASSES) return HABILIDADES_CLASSES;
  try {
    const r = await fetch('../data/habilidades_classes.json');
    HABILIDADES_CLASSES = await r.json();
    return HABILIDADES_CLASSES;
  } catch { return {}; }
}
function chaveDeClasse(classe) {
  return (classe || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

const mod = v => Math.floor(((+v||10) - 10) / 2);
const fmtMod = m => (m >= 0 ? '+' : '') + m;
// Bônus de proficiência por nível (PHB 5e): 1-4=+2, 5-8=+3, 9-12=+4, 13-16=+5, 17-20=+6
const bonusProf = nv => Math.floor(((+nv || 1) - 1) / 4) + 2;

let usuario = null;
let chars = [];
let charAtivo = null;
let tabAtiva = 'identidade';

// Favoritas: SOMENTE do banco (spell_lists do PJ ativo)
async function carregarFavoritasDoBanco() {
  if (!window.sb || !charAtivo?.id) return new Set();
  const { data, error } = await window.sb
    .from('spell_lists')
    .select('spell_names')
    .eq('character_id', charAtivo.id)
    .eq('nome', 'Favoritas')
    .maybeSingle();
  if (error) { console.warn('[ficha] favoritas:', error.message); return new Set(); }
  return new Set(data?.spell_names || []);
}

// Catálogo de magias (carrega só quando necessário)
let magiasCache = null;
async function carregarMagiasCache() {
  if (magiasCache) return magiasCache;
  try {
    const r = await fetch('../data/magias_data.json');
    magiasCache = await r.json();
    return magiasCache;
  } catch { return []; }
}

async function init() {
  usuario = await window.Auth.requerLogin('login.html');
  if (!usuario) return;
  await window.Auth.renderHeader('#auth-slot');
  await carregarPersonagens();
}

async function carregarPersonagens() {
  const { data, error } = await window.sb
    .from('characters').select('*')
    .eq('user_id', usuario.id)
    .order('created_at', { ascending: true });
  if (error) {
    $('#conteudo').innerHTML = `<div class="estado">Erro ao carregar: ${escape(error.message)}</div>`;
    return;
  }
  chars = data || [];
  if (!chars.length) {
    await criarPersonagem('Meu Personagem', true);  // novo PJ já ativo
    return;
  }
  charAtivo = chars[0];
  render();
}

async function criarPersonagem(nome, jaAtivo = false) {
  const payload = { user_id: usuario.id, nome: nome || 'Novo Personagem' };
  if (jaAtivo) payload.is_active = true;
  const { data, error } = await window.sb.from('characters').insert(payload).select('*').single();
  if (error) { alert('Erro ao criar personagem: ' + error.message); return; }
  chars.push(data);
  charAtivo = data;
  render();
}

async function deletarPersonagem(id) {
  if (!confirm('Deletar este personagem? Suas favoritas e dados serão perdidos.')) return;
  const { error } = await window.sb.from('characters').delete().eq('id', id);
  if (error) { alert('Erro ao deletar: ' + error.message); return; }
  chars = chars.filter(c => c.id !== id);
  charAtivo = chars[0] || null;
  if (!charAtivo) { await criarPersonagem('Meu Personagem', true); return; }
  render();
}

async function alternarAtivo() {
  const novo = !charAtivo.is_active;
  const { error } = await window.sb
    .from('characters').update({ is_active: novo }).eq('id', charAtivo.id);
  if (error) { alert('Erro: ' + error.message); return; }
  // Trigger no banco desativa os outros do mesmo user
  charAtivo.is_active = novo;
  if (novo) chars = chars.map(c => ({ ...c, is_active: c.id === charAtivo.id }));
  render();
}

function escape(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Parser de número com vírgula PT-BR (10,5 → 10.5)
function parseNum(txt, opts = {}) {
  if (txt === null || txt === undefined || txt === '') return opts.padrao ?? 0;
  const s = String(txt).replace(',', '.').trim();
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  if (opts.min !== undefined && n < opts.min) return null;
  if (opts.max !== undefined && n > opts.max) return null;
  if (opts.inteiro && !Number.isInteger(n)) return null;
  return n;
}

function render() {
  const c = charAtivo;
  const atrs = c.atributos || {for:10,dex:10,con:10,int:10,sab:10,car:10};

  const titulo = `${c.nome || 'Sem nome'}${c.classe ? ' · ' + c.classe : ''}${c.nivel ? ' (Nv ' + c.nivel + ')' : ''}`;
  $('#hdr-titulo').textContent = titulo;

  // Aviso de visibilidade pro Mestre
  const temCampanha = !!c.campanha;
  const ehAtivo    = !!c.is_active;
  let aviso = '';
  if (temCampanha && ehAtivo) {
    aviso = `<div class="aviso-visibilidade ok">
      <span class="icone" aria-hidden="true">✓</span>
      <span>Esta ficha aparece no painel do Mestre — campanha: <strong>${escape(CAMPANHAS.find(([k]) => k === c.campanha)?.[1] || c.campanha)}</strong></span>
    </div>`;
  } else {
    const problemas = [];
    if (!temCampanha) problemas.push('vincule a uma <strong>Campanha</strong> (aba Identidade)');
    if (!ehAtivo)     problemas.push('marque como <strong>★ Ativo</strong> (botão no topo)');
    aviso = `<div class="aviso-visibilidade">
      <span class="icone" aria-hidden="true">⚠</span>
      <span>Esta ficha <strong>não aparece pro Mestre</strong>. Para mostrar: ${problemas.join(' e ')}.</span>
    </div>`;
  }

  $('#conteudo').innerHTML = `
    ${aviso}
    <div class="char-bar">
      <span class="pj-label">Personagem</span>
      <select id="sel-char" aria-label="Selecionar personagem">
        ${chars.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${escape(x.nome)}${x.classe ? ' — ' + escape(x.classe) : ''}${x.nivel ? ' N' + x.nivel : ''}${x.is_active?' ★':''}</option>`).join('')}
      </select>
      <button class="estrela-ativo ${c.is_active?'ativo':''}" id="btn-ativo" type="button" aria-pressed="${!!c.is_active}" title="Marcar como personagem ativo (visível ao Mestre)">
        <span aria-hidden="true">${c.is_active?'★':'☆'}</span>
        <span class="lbl">${c.is_active?'Ativo':'Ativar'}</span>
      </button>
      <button class="btn" type="button" id="btn-novo">+ Novo</button>
      <button class="btn danger" type="button" id="btn-deletar">Deletar</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab ${tabAtiva==='identidade'?'ativa':''}" data-tab="identidade" role="tab">Identidade</button>
      <button class="tab ${tabAtiva==='combate'?'ativa':''}" data-tab="combate" role="tab">Combate</button>
      <button class="tab ${tabAtiva==='habilidades'?'ativa':''}" data-tab="habilidades" role="tab">Habilidades</button>
      <button class="tab ${tabAtiva==='magias'?'ativa':''}" data-tab="magias" role="tab">Magias</button>
      <button class="tab ${tabAtiva==='equipamento'?'ativa':''}" data-tab="equipamento" role="tab">Equipamento</button>
      <button class="tab ${tabAtiva==='roleplay'?'ativa':''}" data-tab="roleplay" role="tab">Roleplay</button>
    </div>

    <form class="tab-content" id="ficha-form" novalidate>
      ${renderTab(c, atrs)}
      <div class="acoes">
        <span class="status-msg" id="status" aria-live="polite">💾 Auto-save ativo · alterações salvam em ~1s</span>
        <button class="btn primary" type="submit" id="btn-salvar" title="Forçar salvamento imediato">💾 Salvar agora</button>
      </div>
    </form>
  `;

  conectarListeners();
}

function renderSubclasseSelect(classe, atual) {
  const chave = chaveDeClasse(classe);
  const opcoes = SUBCLASSES_POR_CLASSE[chave] || [];
  if (!opcoes.length) {
    return `<select name="subclasse" disabled style="opacity:.5"><option>${classe ? 'Sem subclasses cadastradas' : 'Escolha uma classe'}</option></select>`;
  }
  return `<select name="subclasse" id="sel-subclasse">
    <option value="">— escolher —</option>
    ${opcoes.map(o => `<option ${o===atual?'selected':''}>${escape(o)}</option>`).join('')}
  </select>`;
}

function renderListaTags(field, label, valores) {
  const tags = (valores || []).map((v, i) =>
    `<span class="tag">${escape(v)}<span class="x" data-rmtag="${field}" data-idx="${i}" role="button" tabindex="0">✕</span></span>`).join('');
  return `<div class="campo"><label>${label}</label>
    <div class="lista-tags" id="tags-${field}">${tags || '<span style="color:var(--text-dim);font-style:italic;font-size:12px;padding:4px">Nenhum</span>'}</div>
    <div class="lista-tags-add">
      <input type="text" id="add-${field}-input" placeholder="Adicionar...">
      <button type="button" class="btn" data-addtag="${field}">+</button>
    </div></div>`;
}

function renderTab(c, atrs) {
  switch (tabAtiva) {
    case 'identidade':  return renderIdentidade(c, atrs);
    case 'combate':     return renderCombate(c);
    case 'habilidades': return renderHabilidades(c);
    case 'magias':      return renderMagias(c);
    case 'equipamento': return renderEquipamento(c);
    case 'roleplay':    return renderRoleplay(c);
  }
}

function renderIdentidade(c, atrs) {
  return `
    <h3>Identidade</h3>
    <div class="grid-2">
      <div class="campo"><label>Nome do Personagem</label>
        <input name="nome" value="${escape(c.nome)}" required></div>
      <div class="campo"><label>Nível (1–20)</label>
        <input name="nivel" type="text" inputmode="numeric" value="${c.nivel||1}" data-validar="int" data-min="1" data-max="20">
        <span class="erro-msg">Nível inválido (1–20)</span></div>
      <div class="campo"><label>Raça</label>
        <select name="raca">${RACAS.map(r => `<option ${r===c.raca?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="campo"><label>Classe</label>
        <select name="classe" id="sel-classe">${CLASSES.map(cl => `<option ${cl===c.classe?'selected':''}>${cl}</option>`).join('')}</select></div>
      <div class="campo"><label>Subclasse</label>
        ${renderSubclasseSelect(c.classe, c.subclasse)}
        <span class="ajuda">Opções automáticas conforme classe (PHB 5e).</span></div>
      <div class="campo"><label>Origem (Background)</label>
        <input name="origem" value="${escape(c.origem||'')}"></div>
      <div class="campo"><label>Alinhamento</label>
        <select name="alinhamento">${ALINHAMENTOS.map(a => `<option ${a===c.alinhamento?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="campo"><label>Campanha (visível pro Mestre)</label>
        <select name="campanha">${CAMPANHAS.map(([k, lbl]) => `<option value="${k}" ${k===(c.campanha||'')?'selected':''}>${lbl}</option>`).join('')}</select>
        <span class="ajuda">Salve a ficha para vincular à campanha escolhida.</span></div>
    </div>

    <h3>Idiomas e Ferramentas</h3>
    <div class="grid-2">
      ${renderListaTags('idiomas', 'Idiomas', c.idiomas || ['Comum'])}
      ${renderListaTags('ferramentas', 'Proficiências em Ferramentas', c.ferramentas || [])}
    </div>
    <div class="campo" style="margin-top:14px"><label>Características Raciais</label>
      <textarea name="tracos_raciais" placeholder="Ex.: Visão no Escuro 18m, Resistência Anã, Proficiência em Machados">${escape(c.tracos_raciais||'')}</textarea></div>

    <h3>Atributos</h3>
    <div class="grid-6">
      ${ATRIBUTOS.map(([k, nome]) => `
        <div class="atributo">
          <span class="nome-atr">${nome.slice(0,3).toUpperCase()}</span>
          <span class="modificador" data-mod="${k}">${fmtMod(mod(atrs[k]))}</span>
          <input type="text" inputmode="numeric" class="valor-base" name="attr_${k}" value="${atrs[k] ?? 10}" data-attr="${k}" data-validar="int" data-min="1" data-max="30" aria-label="${nome} (valor base 1-30)">
        </div>
      `).join('')}
    </div>
  `;
}

function renderCombate(c) {
  const slots = c.slots_magia || {};
  const salv = c.salvaguardas || {};
  const per = c.pericias || {};
  const hpAtual = c.hp_atual ?? 10;
  const hpMax = c.hp_max ?? 10;
  const pct = hpMax > 0 ? Math.max(0, Math.min(100, Math.round((hpAtual / hpMax) * 100))) : 0;
  const icone = pct <= 0 ? '💀' : pct <= 25 ? '🩸' : pct <= 50 ? '🧡' : pct <= 75 ? '❤️' : '💖';
  const classeBar = pct <= 15 ? 'critico' : pct <= 35 ? 'baixo' : pct <= 65 ? 'medio' : '';
  return `
    <div class="combate-hero">
      <div class="hp-wrap">

async function popularHabilidades(classe, nivel) {
  const wrap = document.getElementById('hab-wrap');
  if (!wrap) return;
  if (!classe) {
    wrap.innerHTML = `<div class="item-vazio">Sem classe definida.</div>`;
    return;
  }
  const db = await carregarHabilidadesClasses();
  const habs = (db[chaveDeClasse(classe)] || []).filter(h => h.nivel <= (nivel||1));
  if (!habs.length) {
    wrap.innerHTML = `<div class="item-vazio">Nenhuma habilidade encontrada para ${escape(classe)}.</div>`;
    return;
  }
  // Agrupa por nível
  const porNivel = {};
  for (const h of habs) (porNivel[h.nivel] = porNivel[h.nivel] || []).push(h);
  wrap.innerHTML = Object.entries(porNivel).sort(([a],[b]) => +a - +b).map(([nv, lista]) => `
    <div class="habilidade-card">
      <h4>Nível ${nv}</h4>
      ${lista.map(h => `<div style="margin-bottom:8px"><strong style="color:var(--gold-bright)">${escape(h.nome)}.</strong> <span style="color:var(--parchment)">${escape(h.desc || '—')}</span></div>`).join('')}
    </div>
  `).join('');
}

async function carregarMagiasPreparadas() {
  const wrap = document.getElementById('magias-prep');
  if (!wrap) return;
  const favSet = await carregarFavoritasDoBanco();
  if (!favSet.size) {
    wrap.innerHTML = `<div class="item-vazio">Nenhuma magia favoritada. Abra o <a href="magias.html" style="color:var(--gold-bright)">Grimório</a> e clique na estrela ☆ das magias que seu personagem prepara.</div>`;
    return;
  }
  const todas = await carregarMagiasCache();
  const lista = todas.filter(m => favSet.has(m.nome))
    .sort((a,b) => a.nivel - b.nivel || a.nome.localeCompare(b.nome, 'pt'));
  if (!lista.length) { wrap.innerHTML = `<div class="item-vazio">Nenhuma magia encontrada.</div>`; return; }

  wrap.innerHTML = `<div class="magias-lista">${lista.map((m, i) => {
    const nv = m.nivel === 0 ? 'Truque' : `${m.nivel}°`;
    const tags = [m.ritual?'<span>Ritual</span>':'', m.concentracao?'<span>Conc.</span>':''].filter(Boolean).join('');
    const descHtml = (m.descricao || '').split(/\n\n+/).map(p => `<p>${escape(p.trim())}</p>`).join('');
    const comps = (m.componentes || '') + (m.material ? ` (${escape(m.material)})` : '');
    return `<div class="magia-item" data-idx="${i}">
      <div class="magia-row" role="button" tabindex="0" aria-expanded="false">
        <span class="magia-nivel">${nv}</span>
        <span class="magia-nome">${escape(m.nome)}</span>
        <span class="magia-escola">${escape(m.escola)}</span>
        <span class="magia-tags">${tags}</span>
        <span class="magia-chevron" aria-hidden="true">▸</span>
      </div>
      <div class="magia-detalhe">
        <div class="magia-info">
          <div class="magia-info-item"><div class="magia-info-key">Tempo</div><div class="magia-info-val">${escape(m.tempoCast || '—')}</div></div>
          <div class="magia-info-item"><div class="magia-info-key">Alcance</div><div class="magia-info-val">${escape(m.alcance || '—')}</div></div>
          <div class="magia-info-item"><div class="magia-info-key">Componentes</div><div class="magia-info-val">${comps || '—'}</div></div>
          <div class="magia-info-item"><div class="magia-info-key">Duração</div><div class="magia-info-val">${escape(m.duracao || '—')}</div></div>
        </div>
        <div class="magia-desc">${descHtml || '<p>—</p>'}</div>
        ${m.maiorNivel ? `<div class="magia-maior"><strong>Em Níveis Superiores.</strong> ${escape(m.maiorNivel)}</div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;

  // Toggle expand
  wrap.querySelectorAll('.magia-row').forEach(row => {
    const acao = () => {
      const item = row.closest('.magia-item');
      const aberto = item.classList.toggle('aberta');
      row.setAttribute('aria-expanded', aberto);
    };
    row.addEventListener('click', acao);
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); acao(); } });
  });
}

function conectarListeners() {
  // Trocar personagem
  const sel = $('#sel-char');
  if (sel) sel.addEventListener('change', e => {
    charAtivo = chars.find(x => x.id === e.target.value) || chars[0];
    render();
  });
  // Novo
  const novoBtn = $('#btn-novo');
  if (novoBtn) novoBtn.addEventListener('click', async () => {
    const nome = prompt('Nome do novo personagem:');
    if (nome) await criarPersonagem(nome);
  });
  // Deletar
  const delBtn = $('#btn-deletar');
  if (delBtn) delBtn.addEventListener('click', () => deletarPersonagem(charAtivo.id));
  // Estrela ativo
  const ativoBtn = $('#btn-ativo');
  if (ativoBtn) ativoBtn.addEventListener('click', alternarAtivo);

  // Tabs
  $$('.tab').forEach(t => t.addEventListener('click', () => {
    tabAtiva = t.dataset.tab;
    render();
    if (tabAtiva === 'magias') carregarMagiasPreparadas();
  }));

  // Modificadores ao vivo (e recalcula salv/perícias se a tab Combate estiver presente)
  $$('[data-attr]').forEach(inp => {
    inp.addEventListener('input', () => { validarEAtualizarMod(inp); recalcularValoresPericiasSalv(); });
  });
  // Nível também afeta bônus de proficiência
  const inpNivel = document.querySelector('[name="nivel"]');
  if (inpNivel) inpNivel.addEventListener('input', () => {
    const v = parseNum(inpNivel.value, { inteiro: true, min: 1, max: 20 });
    if (v !== null) charAtivo.nivel = v;
    recalcularValoresPericiasSalv();
  });

  // Validação inline
  $$('[data-validar]').forEach(inp => {
    inp.addEventListener('input', () => validarCampo(inp));
    inp.addEventListener('blur', () => validarCampo(inp));
  });

  // Carregar magias se já estiver na aba
  if (tabAtiva === 'magias') carregarMagiasPreparadas();

  // Habilidades — carrega quando entra
  if (tabAtiva === 'habilidades') popularHabilidades(charAtivo.classe, charAtivo.nivel);

  // Listeners de tags (idiomas/ferramentas) — só na aba identidade
  if (tabAtiva === 'identidade') {
    conectarListenersTags();
    // Quando a classe muda, atualiza dropdown de subclasse
    const selClasse = document.getElementById('sel-classe');
    if (selClasse) selClasse.addEventListener('change', e => {
      const wrap = document.querySelector('[name="subclasse"]')?.closest('.campo');
      if (wrap) {
        const ajuda = wrap.querySelector('.ajuda');
        wrap.querySelector('select,input')?.remove();
        wrap.insertBefore(
          Object.assign(document.createElement('div'), { innerHTML: renderSubclasseSelect(e.target.value, '') }).firstElementChild,
          ajuda
        );
      }
    });
  }

  // Barra de HP ao vivo
  const hpAtual = document.getElementById('hp-atual-input');
  const hpMax = document.getElementById('hp-max-input');
  if (hpAtual && hpMax) {
    const atualizarBarraHP = () => {
      const a = parseNum(hpAtual.value, { inteiro: true }) ?? 0;
      const m = parseNum(hpMax.value, { inteiro: true }) ?? 0;
      const pct = m > 0 ? Math.max(0, Math.min(100, Math.round((a / m) * 100))) : 0;
      const fill = document.getElementById('hp-fill');
      const pctEl = document.getElementById('hp-percent');
      const icEl = document.getElementById('hp-icone-atual');
      if (fill) {
        fill.style.width = pct + '%';
        fill.className = 'hp-fill' + (pct <= 15 ? ' critico' : pct <= 35 ? ' baixo' : pct <= 65 ? ' medio' : '');
      }
      if (pctEl) pctEl.textContent = pct + '%';
      if (icEl) icEl.textContent = pct <= 0 ? '💀' : pct <= 25 ? '🩸' : pct <= 50 ? '🧡' : pct <= 75 ? '❤️' : '💖';
    };
    hpAtual.addEventListener('input', atualizarBarraHP);
    hpMax.addEventListener('input', atualizarBarraHP);
  }

  // Listeners das checkboxes de perícia (habilita/desabilita E quando P muda)
  $$('input[name^="per_"][name$="_prof"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const k = cb.name.replace('per_', '').replace('_prof', '');
      const exp = document.querySelector(`input[name="per_${k}_exp"]`);
      if (exp) {
        exp.disabled = !cb.checked;
        if (!cb.checked) exp.checked = false;
      }
      recalcularValoresPericiasSalv();
    });
  });
  $$('input[name^="per_"][name$="_exp"]').forEach(cb => cb.addEventListener('change', recalcularValoresPericiasSalv));
  $$('input[name^="salv_"]').forEach(cb => cb.addEventListener('change', recalcularValoresPericiasSalv));

  // Botões de equipamento
  if (tabAtiva === 'equipamento') conectarListenersEquipamento();

  // Submit manual (botão)
  const form = $('#ficha-form');
  if (form) {
    form.addEventListener('submit', salvar);
    // ── AUTO-SAVE ── (qualquer mudança dispara salvamento em 800ms)
    const autoSave = debounce(() => {
      const ev = new Event('submit', { cancelable: true });
      form.dispatchEvent(ev);
    }, 800);
    form.addEventListener('input', autoSave);
    form.addEventListener('change', autoSave);
  }
}

// Debounce simples
let _debounceTimers = new Map();
function debounce(fn, ms) {
  return function(...args) {
    const key = fn;
    if (_debounceTimers.has(key)) clearTimeout(_debounceTimers.get(key));
    _debounceTimers.set(key, setTimeout(() => fn.apply(this, args), ms));
  };
}

function validarCampo(inp) {
  const tipo = inp.dataset.validar;
  const min = inp.dataset.min !== undefined ? +inp.dataset.min : undefined;
  const max = inp.dataset.max !== undefined ? +inp.dataset.max : undefined;
  const valor = parseNum(inp.value, { inteiro: tipo === 'int', min, max });
  const valido = valor !== null;
  inp.classList.toggle('erro', !valido);
  inp.closest('.campo')?.classList.toggle('tem-erro', !valido);
  return valido;
}

function validarEAtualizarMod(inp) {
  if (validarCampo(inp)) {
    const k = inp.dataset.attr;
    const v = parseNum(inp.value, { inteiro: true, min: 1, max: 30 });
    if (v !== null) {
      const el = document.querySelector(`[data-mod="${k}"]`);
      if (el) el.textContent = fmtMod(mod(v));
      // Atualiza no charAtivo pra recálculo das perícias funcionar
      if (!charAtivo.atributos) charAtivo.atributos = {};
      charAtivo.atributos[k] = v;
    }
  }
}

// Recalcula valores das salvaguardas e perícias on the fly (sem re-render)
function recalcularValoresPericiasSalv() {
  const atrs = charAtivo.atributos || {};
  const nv = +charAtivo.nivel || 1;
  const bp = bonusProf(nv);
  // Coleta inputs atuais (incluindo possíveis edições não-salvas)
  $$('[data-attr]').forEach(inp => {
    const v = parseNum(inp.value, { inteiro: true });
    if (v !== null) atrs[inp.dataset.attr] = v;
  });
  // Salvaguardas
  ATRIBUTOS.forEach(([k]) => {
    const cb = document.querySelector(`[data-salv="${k}"]`);
    const out = document.querySelector(`[data-salv-valor="${k}"]`);
    if (!cb || !out) return;
    const m = mod(atrs[k] ?? 10);
    out.textContent = fmtMod(m + (cb.checked ? bp : 0));
  });
  // Perícias
  PERICIAS.forEach(([k, , atr]) => {
    const prof = document.querySelector(`[data-per="${k}"]`);
    const exp = document.querySelector(`[data-per-exp="${k}"]`);
    const out = document.querySelector(`[data-per-valor="${k}"]`);
    if (!prof || !out) return;
    const m = mod(atrs[atr] ?? 10);
    out.textContent = fmtMod(m + (prof.checked ? bp : 0) + (exp?.checked ? bp : 0));
  });
}

function conectarListenersTags() {
  // Adicionar tag
  $$('[data-addtag]').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.addtag;
    const input = document.getElementById(`add-${f}-input`);
    const v = input.value.trim();
    if (!v) return;
    if (!charAtivo[f]) charAtivo[f] = [];
    if (!charAtivo[f].includes(v)) charAtivo[f].push(v);
    input.value = '';
    render();
  }));
  // Remover tag
  $$('[data-rmtag]').forEach(x => x.addEventListener('click', () => {
    const f = x.dataset.rmtag;
    const idx = +x.dataset.idx;
    if (charAtivo[f]) {
      charAtivo[f].splice(idx, 1);
      render();
    }
  }));
  // Enter no input adiciona
  ['idiomas','ferramentas'].forEach(f => {
    const i = document.getElementById(`add-${f}-input`);
    if (i) i.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.querySelector(`[data-addtag="${f}"]`).click(); }
    });
  });
}

function conectarListenersEquipamento() {
  // Remover item
  $$('[data-rm]').forEach(b => b.addEventListener('click', e => {
    const tipo = e.currentTarget.dataset.rm;
    const idx = +e.currentTarget.dataset.idx;
    const inv = charAtivo.inventario || {};
    if (!inv[tipo]) return;
    inv[tipo].splice(idx, 1);
    charAtivo.inventario = inv;
    render();  // re-renderiza apenas a tab
  }));

  // Adicionar arma do catálogo
  const btnArma = $('#btn-add-arma');
  if (btnArma) btnArma.addEventListener('click', () => {
    const sel = $('#add-arma');
    if (!sel.value) return;
    try {
      const arma = JSON.parse(sel.value);
      const inv = charAtivo.inventario || {};
      inv.armas = inv.armas || [];
      inv.armas.push(arma);
      charAtivo.inventario = inv;
      render();
    } catch (e) { alert('Erro: ' + e.message); }
  });

  // Adicionar armadura
  const btnArm = $('#btn-add-armadura');
  if (btnArm) btnArm.addEventListener('click', () => {
    const sel = $('#add-armadura');
    if (!sel.value) return;
    try {
      const arm = JSON.parse(sel.value);
      const inv = charAtivo.inventario || {};
      inv.armaduras = inv.armaduras || [];
      inv.armaduras.push(arm);
      charAtivo.inventario = inv;
      render();
    } catch (e) { alert('Erro: ' + e.message); }
  });

  // Adicionar item do catálogo
  const btnItemCat = $('#btn-add-item-cat');
  if (btnItemCat) btnItemCat.addEventListener('click', () => {
    const sel = $('#add-item-catalogo');
    const qtd = +($('#add-item-qtd').value || 1);
    if (!sel.value) return;
    try {
      const it = JSON.parse(sel.value);
      it.qtd = qtd;
      const inv = charAtivo.inventario || {};
      inv.itens = inv.itens || [];
      inv.itens.push(it);
      charAtivo.inventario = inv;
      render();
    } catch (e) { alert('Erro: ' + e.message); }
  });

  // Item personalizado
  const btnItemCustom = $('#btn-add-item-custom');
  if (btnItemCustom) btnItemCustom.addEventListener('click', () => {
    const nome = $('#add-item-nome').value.trim();
    const qtd = +($('#add-item-qtd-custom').value || 1);
    if (!nome) return;
    const inv = charAtivo.inventario || {};
    inv.itens = inv.itens || [];
    inv.itens.push({ nome, qtd, peso: '—' });
    charAtivo.inventario = inv;
    render();
  });
}

async function salvar(e) {
  e.preventDefault();
  const btn = $('#btn-salvar');
  const status = $('#status');

  // Valida todos os campos com data-validar
  const invalidos = [];
  $$('[data-validar]').forEach(inp => { if (!validarCampo(inp)) invalidos.push(inp); });
  if (invalidos.length) {
    status.className = 'status-msg erro';
    status.textContent = `❌ ${invalidos.length} campo(s) com erro — corrija antes de salvar`;
    invalidos[0].focus();
    return;
  }

  btn.disabled = true; status.className = 'status-msg'; status.textContent = 'Salvando…';

  const f = e.target;
  const fd = new FormData(f);
  const payload = { ...charAtivo };  // começa com o estado atual (preserva tabs não-renderizadas)

  // Helpers
  const num = (k, intt = true) => {
    if (!fd.has(k)) return undefined;
    const v = parseNum(fd.get(k), { inteiro: intt });
    return v === null ? undefined : v;
  };
  const txt = (k) => fd.has(k) ? (fd.get(k) || null) : undefined;

  // Identidade
  const set = (k, v) => { if (v !== undefined) payload[k] = v; };
  set('nome', txt('nome'));
  set('nivel', num('nivel'));
  set('raca', txt('raca'));
  set('classe', txt('classe'));
  set('subclasse', txt('subclasse'));
  set('origem', txt('origem'));
  set('alinhamento', txt('alinhamento'));
  // campanha: '' significa "sem campanha" → null no banco
  if (fd.has('campanha')) {
    const v = fd.get('campanha');
    payload.campanha = v ? v : null;
  }
  set('tracos_raciais', txt('tracos_raciais'));
  // idiomas e ferramentas (arrays) — pegam direto do estado (mantidos pelos handlers de tag)
  if (charAtivo.idiomas !== undefined)     payload.idiomas = charAtivo.idiomas;
  if (charAtivo.ferramentas !== undefined) payload.ferramentas = charAtivo.ferramentas;

  // Atributos (só se tab identidade)
  if (fd.has('attr_for')) {
    const atrs = {};
    for (const [k] of ATRIBUTOS) atrs[k] = num('attr_' + k) ?? 10;
    payload.atributos = atrs;
  }

  // Combate
  set('hp_atual', num('hp_atual'));
  set('hp_max', num('hp_max'));
  set('hp_temp', num('hp_temp'));
  set('ca', num('ca'));
  set('iniciativa_bonus', num('iniciativa_bonus'));
  set('deslocamento', num('deslocamento', false));  // decimal
  set('dado_vida_tipo', num('dado_vida_tipo'));
  set('dado_vida_atual', num('dado_vida_atual'));
  set('exaustao', num('exaustao'));

  // Slots (apenas se tab combate ativa)
  if (fd.has('slot_1_max')) {
    const slots = {};
    for (let n = 1; n <= 9; n++) {
      const max   = num(`slot_${n}_max`)   ?? 0;
      const atual = num(`slot_${n}_atual`) ?? 0;
      if (max > 0 || atual > 0) slots[n] = { max, atual };
    }
    payload.slots_magia = slots;
  }

  // Salvaguardas + Perícias + Magia (apenas se tab combate ativa)
  if (fd.has('salv_for')) {
    const salv = {};
    for (const [k] of ATRIBUTOS) salv[k] = fd.has('salv_' + k);
    payload.salvaguardas = salv;
    const per = {};
    for (const [k] of PERICIAS) {
      const prof = fd.has('per_' + k + '_prof');
      const exp  = fd.has('per_' + k + '_exp');
      if (prof || exp) per[k] = { prof, exp };
    }
    payload.pericias = per;
    set('truques_conhecidos', num('truques_conhecidos'));
    set('magias_conhecidas',  num('magias_conhecidas'));
    set('cd_resistencia',     num('cd_resistencia'));
    set('bonus_atq_magia',    num('bonus_atq_magia'));
  }

  // Características adicionais (aba Habilidades)
  set('caracteristicas_adicionais', txt('caracteristicas_adicionais'));

  // Moedas (apenas se tab equipamento ativa)
  if (fd.has('moeda_po')) {
    const inv = payload.inventario || { moedas:{}, armas:[], armaduras:[], itens:[] };
    inv.moedas = {};
    for (const md of window.PHB.MOEDAS) inv.moedas[md.codigo] = num('moeda_' + md.codigo) ?? 0;
    payload.inventario = inv;
  }
  // armas/armaduras/itens já foram setados pelo conectarListenersEquipamento (mantidos em payload.inventario)

  // Roleplay
  set('tracos_pessoais', txt('tracos_pessoais'));
  set('ideais', txt('ideais'));
  set('vinculos', txt('vinculos'));
  set('defeitos', txt('defeitos'));
  set('historia', txt('historia'));
  set('notas', txt('notas'));

  // Remove campos que não vão pro UPDATE
  delete payload.id;
  delete payload.user_id;
  delete payload.created_at;
  delete payload.updated_at;

  const { data, error } = await window.sb
    .from('characters').update(payload).eq('id', charAtivo.id).select('*').single();

  if (error) {
    status.className = 'status-msg erro';
    status.textContent = '❌ Erro: ' + error.message;
  } else {
    // Atualiza CAMPO POR CAMPO em vez de substituir o objeto inteiro
    // (preserva edições em progresso de outros campos não-salvos)
    Object.assign(charAtivo, payload);
    chars = chars.map(c => c.id === charAtivo.id ? charAtivo : c);
    status.className = 'status-msg ok';
    status.textContent = '✓ Salvo  ·  ' + new Date().toLocaleTimeString('pt-BR');
    setTimeout(() => { if (status.classList.contains('ok')) status.textContent = '💾 Auto-save ativo'; }, 2500);
  }
  btn.disabled = false;
}

init();
</script>
