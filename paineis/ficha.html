<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Minha Ficha — Personagem D&D 5e">
<meta name="theme-color" content="#0a0608">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<title>Minha Ficha — D&D 5e</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0608;
    --bg-card: #1a1018;
    --bg-card-soft: #221520;
    --bg-input: rgba(255,255,255,0.04);
    --gold: #8B6914;
    --gold-bright: #b88a2c;
    --gold-light: #d4a843;
    --blood: #6b1010;
    --blood-bright: #8b1d1d;
    --parchment: #d4c5a0;
    --parchment-dim: #a89878;
    --shadow: #050304;
    --text-dim: #8c7d5e;
    --ok: #8fc28f;
    --erro: #e88a8a;
  }

  html, body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg-deep) radial-gradient(ellipse at top, #1e1018 0%, #0d0810 50%, #050304 100%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
  }

  /* ============ HEADER ============ */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,6,8,0.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--gold);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }
  .back-btn {
    text-decoration: none; color: var(--parchment-dim);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid var(--gold);
    border-radius: 2px; transition: all 0.2s;
  }
  .back-btn:hover { background: var(--gold); color: var(--shadow); }
  .header-title {
    font-family: 'Cinzel Decorative', serif; font-size: clamp(15px, 3vw, 22px);
    font-weight: 700; color: var(--gold-bright); letter-spacing: 2px;
    flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .auth-slot { display: flex; align-items: center; gap: 8px; font-family: 'Cinzel', serif; font-size: 11px; }
  .auth-nome { color: var(--parchment-dim); letter-spacing: 1px; }
  .auth-btn {
    padding: 6px 12px; background: transparent;
    border: 1px solid var(--gold); color: var(--parchment-dim);
    border-radius: 2px; font-family: 'Cinzel', serif; font-size: 10px;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    text-decoration: none; cursor: pointer; transition: all 0.2s;
  }
  .auth-btn:hover { background: var(--gold); color: var(--shadow); }
  @media (max-width: 600px) { .auth-nome { display: none; } }

  /* ============ MAIN ============ */
  main { max-width: 1000px; margin: 18px auto; padding: 0 14px 36px; }
  .estado { padding: 30px; text-align: center; color: var(--text-dim); font-style: italic; }

  /* ============ BARRA DE PERSONAGEM ============ */
  .char-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
    border: 1px solid rgba(139,105,20,0.4);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .char-bar .pj-label {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .char-bar select {
    flex: 1; min-width: 180px;
    background: var(--bg-input); border: 1px solid var(--gold);
    color: var(--parchment); font-family: 'EB Garamond', serif;
    font-size: 15px; padding: 8px 12px; border-radius: 3px; outline: none;
  }
  .char-bar select:focus { border-color: var(--gold-bright); }
  .char-bar option { background: #1a1018; }
  /* Desktop: char-bar-acoes é "transparente" (botões viram filhos diretos) */
  .char-bar-acoes { display: contents; }
  @media (max-width: 600px) {
    .char-bar-acoes { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; }
  }

  .btn { padding: 9px 14px; background: transparent;
    border: 1px solid var(--gold); color: var(--parchment);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    border-radius: 3px; cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { background: var(--gold); color: var(--shadow); }
  .btn.danger { border-color: var(--blood); color: #c47a5a; }
  .btn.danger:hover { background: var(--blood); color: var(--parchment); }
  .btn.primary {
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    border-color: var(--gold-bright); color: var(--shadow);
  }
  .btn.primary:hover { background: linear-gradient(to bottom, var(--gold-bright), var(--gold)); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* AVISO DE FICHA NÃO VISÍVEL PRO MESTRE */
  .aviso-visibilidade {
    background: linear-gradient(160deg, rgba(184,138,44,0.18), rgba(107,16,16,0.18));
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.5;
  }
  .aviso-visibilidade.ok {
    background: rgba(46,134,46,0.12);
    border-color: #2e862e;
    color: var(--ok);
  }
  .aviso-visibilidade .icone { font-size: 18px; flex-shrink: 0; }
  .aviso-visibilidade strong { color: var(--gold-bright); }

  /* ESTRELA "ATIVO" */
  .estrela-ativo {
    background: transparent; border: 1px solid rgba(139,105,20,0.4);
    color: var(--parchment-dim); font-size: 18px; line-height: 1;
    padding: 8px 12px; border-radius: 3px; cursor: pointer;
    transition: all 0.2s; min-width: 42px; min-height: 42px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Cinzel', serif;
  }
  .estrela-ativo .lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .estrela-ativo:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
  .estrela-ativo.ativo {
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    color: var(--shadow); border-color: var(--gold-bright);
    box-shadow: 0 0 12px rgba(212,168,67,0.4);
  }

  /* ============ TABS ============ */
  .tabs-wrap {
    position: relative;
    /* gradient hint nas bordas para indicar scroll horizontal em mobile */
  }
  .tabs-wrap::before, .tabs-wrap::after {
    content: ''; position: absolute; top: 0; bottom: 1px; width: 24px;
    pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity 0.2s;
  }
  .tabs-wrap::before { left: 0; background: linear-gradient(to right, var(--bg-card), transparent); }
  .tabs-wrap::after  { right: 0; background: linear-gradient(to left,  var(--bg-card), transparent); }
  .tabs-wrap.scroll-left::before  { opacity: 1; }
  .tabs-wrap.scroll-right::after  { opacity: 1; }
  .tabs {
    display: flex; gap: 4px; margin-bottom: 0;
    border-bottom: 1px solid rgba(139,105,20,0.4);
    overflow-x: auto; scrollbar-width: thin;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .tab { scroll-snap-align: start; }
  .tab {
    padding: 11px 18px; background: transparent;
    border: none; border-bottom: 2px solid transparent;
    color: var(--parchment-dim); font-family: 'Cinzel', serif;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .tab:hover { color: var(--gold-bright); }
  .tab.ativa { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
  .tab:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: -2px; }

  .tab-content {
    background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
    border: 1px solid rgba(139,105,20,0.4);
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 22px;
  }

  /* ============ CAMPOS ============ */
  h3 {
    font-family: 'Cinzel Decorative', serif; color: var(--gold-bright);
    font-size: 16px; letter-spacing: 1px;
    margin: 18px 0 12px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(139,105,20,0.3);
  }
  h3:first-of-type { margin-top: 0; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }

  .campo label {
    display: block; font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%; background: var(--bg-input);
    border: 1px solid rgba(139,105,20,0.3); color: var(--parchment);
    font-family: 'EB Garamond', serif; font-size: 14px;
    padding: 8px 11px; border-radius: 3px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus {
    border-color: var(--gold-bright); background: rgba(255,255,255,0.07);
  }
  .campo input.erro, .campo select.erro, .campo textarea.erro {
    border-color: var(--erro); background: rgba(139,29,29,0.15);
  }
  .campo textarea { min-height: 70px; resize: vertical; font-family: 'EB Garamond', serif; line-height: 1.5; }
  .campo .ajuda { display: block; margin-top: 4px; font-size: 11px; font-style: italic; color: var(--text-dim); }
  .campo .erro-msg { display: none; margin-top: 4px; font-size: 11px; color: var(--erro); }
  .campo.tem-erro .erro-msg { display: block; }
  .campo select option { background: #1a1018; color: var(--parchment); }

  /* ============ ATRIBUTOS (modificador em cima) ============ */
  .atributo {
    text-align: center;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(139,105,20,0.4);
    border-radius: 6px; padding: 12px 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .atributo .nome-atr {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .atributo .modificador {
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    color: var(--gold-bright); font-size: 28px; line-height: 1;
    background: linear-gradient(180deg, rgba(184,138,44,0.12), transparent);
    padding: 6px 0; border-radius: 4px;
    text-shadow: 0 0 12px rgba(184,138,44,0.3);
  }
  .atributo .valor-base {
    background: transparent; border: 1px solid rgba(139,105,20,0.3);
    color: var(--parchment); font-family: 'Cinzel', serif;
    font-size: 15px; font-weight: 600; text-align: center;
    padding: 4px 6px; border-radius: 3px; width: 100%;
  }
  .atributo .valor-base:focus { outline: 1px solid var(--gold-bright); }

  /* ============ AÇÕES ============ */
  .acoes {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 24px; padding-top: 18px;
    border-top: 1px solid rgba(139,105,20,0.3);
    align-items: center; flex-wrap: wrap;
  }
  .status-msg { margin-right: auto; font-size: 13px; font-style: italic; color: var(--text-dim); }
  .status-msg.ok    { color: var(--ok); }
  .status-msg.erro  { color: var(--erro); }

  /* ============ EQUIPAMENTO ============ */
  .bloco-equip {
    background: linear-gradient(180deg, rgba(20,12,6,0.55) 0%, rgba(10,5,2,0.35) 100%);
    border: 1px solid rgba(139,105,20,0.35);
    border-radius: 8px;
    padding: 14px 16px 16px;
    margin-bottom: 18px;
    box-shadow: inset 0 1px 0 rgba(212,175,55,0.07), 0 2px 8px rgba(0,0,0,0.35);
  }
  .bloco-equip-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(139,105,20,0.25);
  }
  .bloco-icone {
    font-size: 20px; line-height: 1;
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(139,105,20,0.15);
    border: 1px solid rgba(139,105,20,0.35);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bloco-titulo {
    font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
    color: var(--gold-bright); letter-spacing: 1.5px; text-transform: uppercase;
    margin: 0; flex: 1;
  }
  .contador-bloco {
    background: rgba(139,105,20,0.25);
    border: 1px solid rgba(139,105,20,0.5);
    color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700;
    padding: 2px 10px; border-radius: 12px; min-width: 28px; text-align: center;
  }
  .conv-hint {
    margin: 10px 0 0; font-size: 11px; color: var(--text-dim);
    font-style: italic; text-align: center; letter-spacing: 0.5px;
  }
  .moedas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 4px; }
  .moeda-box {
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.25) 100%);
    border: 1px solid rgba(139,105,20,0.4);
    border-radius: 6px; padding: 10px 6px 8px; text-align: center;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .moeda-box:hover {
    border-color: rgba(212,175,55,0.6);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(212,175,55,0.15);
    transform: translateY(-1px);
  }
  .moeda-ic { font-size: 18px; line-height: 1; margin-bottom: 4px; }
  .moeda-box label { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); letter-spacing: 1px; display: block; }
  .moeda-box input { width: 100%; background: transparent; border: none; color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; text-align: center; margin-top: 4px; outline: none; }
  .moeda-box input:focus { background: rgba(255,255,255,0.08); border-radius: 3px; }

  .item-tabela {
    width: 100%; border-collapse: collapse; margin-top: 10px;
    background: rgba(0,0,0,0.15); border-radius: 4px; overflow: hidden;
  }
  .item-tabela th, .item-tabela td {
    padding: 8px 10px; text-align: left; font-size: 13px;
    border-bottom: 1px solid rgba(139,105,20,0.2);
  }
  .item-tabela th {
    background: rgba(139,105,20,0.18); color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  }
  .item-tabela tr:last-child td { border-bottom: none; }
  .item-tabela .lixo {
    background: transparent; border: 1px solid rgba(139,29,29,0.4); color: #c47a5a;
    padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 12px;
    transition: all 0.15s;
    min-height: 28px; min-width: 28px;
  }
  .item-tabela .lixo:hover { background: var(--blood); color: var(--parchment); }
  .item-vazio { padding: 18px; text-align: center; color: var(--text-dim); font-style: italic; }

  /* MOBILE: tabela vira cards verticais (cada linha = um card) */
  @media (max-width: 600px) {
    .item-tabela, .item-tabela thead, .item-tabela tbody, .item-tabela tr, .item-tabela td {
      display: block;
    }
    .item-tabela { background: transparent; border: none; overflow: visible; }
    .item-tabela thead { display: none; }
    .item-tabela tr {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(139,105,20,0.35);
      border-radius: 6px;
      padding: 10px 38px 10px 12px;
      margin-bottom: 8px;
      position: relative;
    }
    .item-tabela td {
      border: none; padding: 3px 0; font-size: 13px;
      display: flex; gap: 6px; align-items: baseline;
    }
    .item-tabela td::before {
      content: attr(data-label);
      font-family: 'Cinzel', serif; color: var(--gold);
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      min-width: 70px; flex-shrink: 0;
    }
    .item-tabela td:first-child {
      font-weight: 700; color: var(--gold-bright); font-size: 15px;
      margin-bottom: 6px; padding-bottom: 6px;
      border-bottom: 1px dashed rgba(139,105,20,0.25);
    }
    .item-tabela td:first-child::before { content: ''; min-width: 0; }
    .item-tabela td:last-child {
      position: absolute; top: 8px; right: 8px;
      padding: 0; margin: 0; border: none;
    }
    .item-tabela td:last-child::before { content: ''; min-width: 0; }
    .item-tabela .lixo { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: 14px; }
  }

  .adicionar-bloco { display: flex; gap: 8px; align-items: end; margin-top: 14px; flex-wrap: wrap; }
  .adicionar-bloco .campo { flex: 1; min-width: 160px; margin: 0; }

  /* ============ MAGIAS PREPARADAS ============ */
  .magias-lista { display: flex; flex-direction: column; gap: 6px; }
  .magia-item {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(139,105,20,0.25);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .magia-item:hover { border-color: rgba(139,105,20,0.5); }
  .magia-item.aberta { border-color: var(--gold-bright); }
  .magia-row {
    display: grid; grid-template-columns: 50px 1fr 100px 110px 28px;
    gap: 10px; align-items: center;
    padding: 10px 12px; cursor: pointer;
    user-select: none;
  }
  .magia-nivel { font-family: 'Cinzel', serif; font-weight: 700; color: var(--gold-bright); font-size: 13px; }
  .magia-nome  { color: var(--parchment); font-size: 14px; }
  .magia-escola { font-size: 11px; color: var(--text-dim); font-style: italic; }
  .magia-tags  { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .magia-tags span {
    font-size: 9px; padding: 2px 6px; border-radius: 2px;
    background: rgba(139,29,29,0.3); color: #c47a5a;
    font-family: 'Cinzel', serif; letter-spacing: 0.5px;
  }
  .magia-chevron {
    color: var(--gold); font-size: 14px; text-align: center;
    transition: transform 0.2s;
  }
  .magia-item.aberta .magia-chevron { transform: rotate(90deg); color: var(--gold-bright); }

  .magia-detalhe {
    padding: 0 14px 14px;
    border-top: 1px solid rgba(139,105,20,0.2);
    margin-top: 0;
    display: none;
    background: rgba(0,0,0,0.15);
  }
  .magia-item.aberta .magia-detalhe { display: block; }
  .magia-info {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px 14px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(139,105,20,0.15);
    margin-bottom: 10px;
  }
  .magia-info-item { font-size: 12px; }
  .magia-info-key {
    font-family: 'Cinzel', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 2px;
  }
  .magia-info-val { color: var(--parchment); }
  .magia-desc { font-size: 13px; line-height: 1.6; color: var(--parchment); }
  .magia-desc p { margin-bottom: 8px; }
  .magia-maior {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(139,105,20,0.2);
    font-size: 12px; color: var(--parchment-dim); font-style: italic;
  }
  .magia-maior strong { color: var(--gold-bright); font-style: normal; }

  .magia-conjurar-bar {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(139,105,20,0.2);
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  }
  .magia-truque-info { font-size: 11px; color: var(--text-dim); font-style: italic; }
  .btn-conjurar {
    background: linear-gradient(to bottom, #6b3a8a, #4a2660);
    border: 1px solid #a35cd0;
    color: #f0e0ff;
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
    transition: all 0.15s; min-height: 36px;
    box-shadow: 0 0 10px rgba(163,92,208,0.25);
  }
  .btn-conjurar:hover {
    background: linear-gradient(to bottom, #8049a8, #6b3a8a);
    transform: translateY(-1px);
    box-shadow: 0 0 14px rgba(163,92,208,0.5);
  }
  .btn-conjurar:active { transform: translateY(0); }

  /* ─── Modal Conjurar ─── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px; backdrop-filter: blur(3px);
  }
  .modal-card {
    background: linear-gradient(180deg, var(--bg-card), var(--bg-card-soft));
    border: 2px solid var(--gold); border-radius: 10px;
    padding: 24px; max-width: 480px; width: 100%;
    box-shadow: 0 0 40px rgba(0,0,0,0.7), 0 0 20px rgba(212,175,55,0.2);
  }
  .modal-card h3 {
    color: var(--gold-bright); margin: 0 0 8px;
    font-family: 'Cinzel Decorative', serif; font-size: 18px;
  }
  .modal-card h3 em { color: var(--parchment); font-style: italic; }
  .modal-slots {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .modal-slot-btn {
    background: linear-gradient(160deg, var(--bg-card-soft), var(--bg-card));
    border: 1.5px solid var(--gold); border-radius: 6px;
    padding: 10px 6px; cursor: pointer; text-align: center;
    transition: all 0.15s; min-height: 80px;
  }
  .modal-slot-btn:hover:not(:disabled) {
    background: linear-gradient(160deg, var(--bg-card), var(--bg-card-soft));
    border-color: var(--gold-bright);
    box-shadow: 0 0 10px rgba(212,175,55,0.3); transform: translateY(-2px);
  }
  .modal-slot-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-slot-nv {
    color: var(--gold); font-family: 'Cinzel', serif; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px;
  }
  .modal-slot-disp {
    color: var(--gold-bright); font-family: 'Cinzel', serif;
    font-size: 22px; font-weight: 700; margin: 4px 0;
  }
  .modal-slot-lbl { font-size: 10px; color: var(--text-dim); font-style: italic; }
  .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; }

  .toast-conjurar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, rgba(60,30,80,0.95), rgba(40,20,55,0.95));
    border: 1.5px solid #a35cd0; border-radius: 8px;
    padding: 12px 20px; color: #f0e0ff;
    font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 12px rgba(163,92,208,0.3);
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    z-index: 999; pointer-events: none;
  }
  .toast-conjurar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-conjurar strong { color: #d4a8ff; }

  @media (max-width: 600px) {
    .magia-row { grid-template-columns: 40px 1fr 24px; row-gap: 4px; }
    .magia-escola, .magia-tags { grid-column: 2 / 4; font-size: 10px; }
    .magia-info { grid-template-columns: 1fr 1fr; }
    .modal-card { padding: 18px; max-width: 100%; }
    .modal-slots { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .modal-slot-btn { min-height: 70px; padding: 8px 4px; }
    .modal-slot-disp { font-size: 18px; }
  }

  /* ============ HABILIDADES ============ */
  .habilidade-card {
    background: rgba(0,0,0,0.2); border: 1px solid rgba(139,105,20,0.3);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 10px;
  }
  .habilidade-card h4 {
    font-family: 'Cinzel', serif; color: var(--gold-bright);
    font-size: 13px; margin-bottom: 6px;
  }
  .habilidade-card p { font-size: 13px; line-height: 1.55; color: var(--parchment); }

  .hab-feature {
    padding: 10px 0; border-bottom: 1px dashed rgba(139,105,20,0.18);
  }
  .hab-feature:last-child { border-bottom: none; }
  .hab-feature.ativa { border-left: 2px solid var(--gold); padding-left: 10px; }
  .hab-feature-head {
    display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start;
  }
  .hab-feature-titulo strong { color: var(--gold-bright); }
  .hab-desc { color: var(--parchment); font-size: 13px; line-height: 1.5; display: block; margin-top: 2px; }
  .hab-sub-tag {
    display: inline-block; font-size: 9px; background: rgba(184,138,44,0.25);
    color: var(--gold-bright); padding: 1px 6px; border-radius: 8px;
    letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase;
  }
  .hab-tracker {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(139,105,20,0.25);
    border-radius: 6px; padding: 6px 10px; min-width: 180px;
  }
  .hab-tracker-lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; }
  .hab-tracker-max {
    width: 36px; background: transparent; border: 1px solid rgba(139,105,20,0.4);
    border-radius: 3px; color: var(--gold-bright); font-family: 'Cinzel', serif;
    font-size: 13px; text-align: center; padding: 2px;
  }
  .hab-pips { display: inline-flex; gap: 3px; }
  .hab-pip {
    width: 14px; height: 14px; border-radius: 50%;
    background: transparent; border: 1.5px solid var(--gold);
    cursor: pointer; padding: 0; transition: background 0.12s, transform 0.1s;
  }
  .hab-pip.gasto {
    background: radial-gradient(circle, var(--gold-bright), var(--gold));
    box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
  }
  .hab-pip:hover { transform: scale(1.18); }
  .hab-disp { font-size: 11px; color: var(--gold); font-family: 'Cinzel', serif; }
  .hab-disp strong { color: var(--gold-bright); font-size: 14px; }
  @media (max-width: 600px) {
    .hab-feature-head { grid-template-columns: 1fr; }
    .hab-tracker { justify-content: flex-start; }
    .hab-pip { width: 20px; height: 20px; }
    .hab-tracker-max { min-height: 32px; width: 42px; }
  }

  /* Características personalizadas */
  .hab-add-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 14px;
    border-top: 1px solid rgba(139,105,20,0.25);
  }
  .hab-add-bar h3 { margin: 0; }
  .hab-feature { position: relative; }
  .cfeat-remove {
    position: absolute; top: 8px; right: 0;
    background: transparent; border: 1px solid rgba(139,29,29,0.5);
    color: #c47a5a;
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  .cfeat-remove:hover { background: var(--blood); color: var(--parchment); }
  .cfeat-nome {
    width: 100%; padding: 8px 10px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(139,105,20,0.35);
    border-radius: 4px;
    color: var(--gold-bright);
    font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700;
    margin-bottom: 6px;
    outline: none;
  }
  .cfeat-nome:focus { border-color: var(--gold); background: rgba(0,0,0,0.4); }
  .cfeat-desc {
    width: 100%; padding: 8px 10px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(139,105,20,0.25);
    border-radius: 4px;
    color: var(--parchment);
    font-family: 'EB Garamond', serif; font-size: 13px; line-height: 1.5;
    min-height: 50px; resize: vertical;
    outline: none;
  }
  .cfeat-desc:focus { border-color: var(--gold-bright); background: rgba(0,0,0,0.3); }

  /* PERÍCIAS / SALVAGUARDAS */
  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  @media (max-width: 600px) { .check-grid { grid-template-columns: 1fr; } }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; background: rgba(0,0,0,0.15);
    border: 1px solid rgba(139,105,20,0.2); border-radius: 3px;
    font-size: 13px;
  }
  .check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
  .check-row .atr-tag { font-size: 9px; color: var(--text-dim); margin-left: 4px; letter-spacing: 1px; }
  /* Checkbox medieval custom — substitui o input padrão */
  .check-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border: 1.5px solid var(--gold);
    background: var(--shadow);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check-row input[type="checkbox"]:hover { border-color: var(--gold-bright); box-shadow: 0 0 4px rgba(184,138,44,0.4); }
  .check-row input[type="checkbox"]:checked {
    background: linear-gradient(160deg, var(--gold-bright), var(--gold));
    border-color: var(--gold-bright);
    box-shadow: 0 0 6px rgba(212,168,67,0.5);
  }
  .check-row input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    color: var(--shadow);
    font-weight: 900;
    font-size: 14px;
    line-height: 1;
  }
  .check-row input[type="checkbox"]:disabled {
    opacity: 0.3; cursor: not-allowed; border-color: var(--text-dim);
  }
  .check-row input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }
  .check-row .exp-marker {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-dim); letter-spacing: 1px;
    margin-left: auto;
  }
  .check-row .exp-marker input { accent-color: var(--gold-bright); }
  /* Valor calculado da salvaguarda/perícia (modificador + proficiência) */
  .check-row .valor-calc {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 14px; color: var(--gold-bright);
    background: rgba(139,105,20,0.18);
    border: 1px solid rgba(184,138,44,0.4);
    padding: 3px 9px; border-radius: 12px;
    min-width: 38px; text-align: center;
    margin-left: auto;
  }

  /* ============ VISUAL COMBATE: HP + stats principais ============ */
  .combate-hero {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr;
    gap: 14px; margin-bottom: 20px;
  }
  @media (max-width: 700px) { .combate-hero { grid-template-columns: 1fr; } }

  .hp-wrap {
    background: linear-gradient(160deg, rgba(107,16,16,0.25), rgba(0,0,0,0.4));
    border: 1px solid var(--blood);
    border-radius: 8px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  .hp-titulo {
    font-family: 'Cinzel', serif; font-size: 11px;
    color: var(--gold); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .hp-icone { font-size: 18px; }
  .hp-numero {
    text-align: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 28px; font-weight: 900;
    color: var(--gold-bright);
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(184,138,44,0.4);
  }
  .hp-numero input {
    background: transparent; border: none;
    color: inherit; font-family: inherit; font-size: inherit;
    font-weight: inherit; text-align: center;
    width: 70px; outline: none;
    border-bottom: 1px dashed rgba(184,138,44,0.3);
  }
  .hp-numero input:focus { border-bottom-color: var(--gold-bright); }
  .hp-numero .sep { color: var(--text-dim); margin: 0 4px; font-size: 22px; }
  .hp-temp-label { font-size: 11px; color: var(--text-dim); }
  .hp-temp-label input {
    width: 32px; background: transparent; border: none;
    color: var(--gold-light); font-weight: 700; text-align: center;
  }
  .hp-bar {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(139,29,29,0.5);
    border-radius: 4px;
    height: 18px;
    overflow: hidden;
    position: relative;
  }
  .hp-fill {
    height: 100%; transition: width 0.4s, background 0.4s;
    background: linear-gradient(90deg, #6b1010, #8b1d1d);
  }
  .hp-fill.medio { background: linear-gradient(90deg, #6b3010, #b88a2c); }
  .hp-fill.baixo { background: linear-gradient(90deg, #4a0808, #6b1010); }
  .hp-fill.critico { background: repeating-linear-gradient(45deg, #4a0808, #4a0808 6px, #6b1010 6px, #6b1010 12px); animation: hp-pulse 1s ease-in-out infinite; }
  @keyframes hp-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  .hp-percent {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--parchment); letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  /* ===== Painel aplicar dano/cura ===== */
  .hp-aplicar {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed rgba(139,29,29,0.4);
  }
  .hp-aplicar-titulo {
    font-family: 'Cinzel', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px; text-align: center;
  }
  .hp-aplicar-linha {
    display: flex; gap: 6px; align-items: center; justify-content: center;
    flex-wrap: wrap;
  }
  .hp-aplicar-linha input {
    width: 56px; padding: 8px 6px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--gold);
    color: var(--parchment); font-family: 'Cinzel', serif;
    font-size: 16px; font-weight: 700; text-align: center;
    border-radius: 4px; outline: none;
  }
  .hp-aplicar-linha input:focus { border-color: var(--gold-bright); background: rgba(0,0,0,0.7); }
  .hp-btn {
    padding: 8px 12px;
    border: 1px solid;
    border-radius: 4px;
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 700; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s;
    background: transparent;
    min-height: 36px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .hp-btn.dano {
    border-color: var(--blood-bright); color: #f4b8a8;
  }
  .hp-btn.dano:hover { background: var(--blood); color: var(--parchment); }
  .hp-btn.cura {
    border-color: #2e862e; color: #8fc28f;
  }
  .hp-btn.cura:hover { background: #2e5e2e; color: var(--parchment); }
  .hp-quick {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
    margin-top: 8px;
  }
  .hp-quick button {
    padding: 6px 4px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(139,105,20,0.35);
    color: var(--parchment-dim);
    font-family: 'Cinzel', serif; font-size: 10px;
    font-weight: 700;
    border-radius: 3px;
    cursor: pointer; transition: all 0.15s;
    min-height: 30px;
  }
  .hp-quick button.q-dano { border-color: rgba(139,29,29,0.5); color: #d49890; }
  .hp-quick button.q-dano:hover { background: rgba(139,29,29,0.3); color: var(--parchment); border-color: var(--blood-bright); }
  .hp-quick button.q-cura { border-color: rgba(46,134,46,0.5); color: #8fc28f; }
  .hp-quick button.q-cura:hover { background: rgba(46,134,46,0.25); color: var(--parchment); border-color: #2e862e; }
  @media (max-width: 600px) {
    .hp-aplicar-linha input { width: 70px; font-size: 17px; padding: 10px; min-height: 42px; }
    .hp-btn { padding: 10px 14px; font-size: 12px; min-height: 42px; }
    .hp-quick { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .hp-quick button { font-size: 12px; padding: 10px 4px; min-height: 40px; }
  }

  .stat-hero {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(139,105,20,0.4);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .stat-hero .stat-icone { font-size: 26px; line-height: 1; margin-bottom: 6px; }
  .stat-hero .stat-titulo {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .stat-hero input {
    background: transparent; border: 1px solid rgba(139,105,20,0.3);
    color: var(--gold-bright);
    font-family: 'Cinzel Decorative', serif;
    font-size: 24px; font-weight: 700; text-align: center;
    width: 100%; padding: 6px 4px; border-radius: 4px;
    outline: none;
  }
  .stat-hero input:focus { border-color: var(--gold-bright); }

  /* Stats menores (iniciativa, deslocamento, dado de vida, exaustão) */
  .stats-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 700px) { .stats-mini { grid-template-columns: repeat(2, 1fr); } }
  .stat-mini {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(139,105,20,0.3);
    border-radius: 6px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-mini .ic { font-size: 18px; line-height: 1; margin-bottom: 4px; display: block; }
  .stat-mini label {
    display: block;
    font-family: 'Cinzel', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .stat-mini input, .stat-mini select {
    width: 100%; background: transparent;
    border: 1px solid rgba(139,105,20,0.3); color: var(--parchment);
    font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600;
    text-align: center; padding: 6px 4px; border-radius: 3px;
    outline: none;
  }
  .stat-mini input:focus, .stat-mini select:focus { border-color: var(--gold-bright); }
  .stat-mini .ajuda-mini { display: block; font-size: 9px; color: var(--text-dim); margin-top: 3px; font-style: italic; }
  .readonly-stat {
    width: 100%;
    background: rgba(139,105,20,0.12);
    border: 1px solid rgba(139,105,20,0.4);
    color: var(--gold-bright);
    font-family: 'Cinzel Decorative', serif; font-size: 18px; font-weight: 700;
    text-align: center; padding: 6px 4px; border-radius: 3px;
    cursor: help;
  }

  .lista-tags {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start;
    padding: 8px; background: rgba(0,0,0,0.15);
    border: 1px solid rgba(139,105,20,0.2); border-radius: 3px;
    min-height: 38px;
  }
  .lista-tags .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; background: rgba(139,105,20,0.2);
    border: 1px solid rgba(139,105,20,0.4); border-radius: 12px;
    font-size: 12px; color: var(--parchment);
  }
  .lista-tags .tag .x {
    cursor: pointer; color: var(--blood-bright); font-weight: 700;
    padding: 0 2px; border-radius: 50%;
  }
  .lista-tags .tag .x:hover { background: var(--blood-bright); color: var(--parchment); }
  .lista-tags-add { display: flex; gap: 6px; margin-top: 6px; }
  .lista-tags-add input { flex: 1; }

  /* ============ RESPONSIVIDADE ============ */
  @media (max-width: 800px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
    .moedas { grid-template-columns: repeat(2, 1fr); }
    .magia-row { grid-template-columns: 50px 1fr; row-gap: 4px; }
    .magia-escola, .magia-tags { grid-column: 2; }
  }
  @media (max-width: 600px) {
    /* Char-bar reorganizada em mobile: select 100%, depois botões em grid */
    .char-bar {
      display: grid;
      grid-template-areas: "label" "select" "acoes";
      gap: 8px; padding: 12px;
    }
    .char-bar .pj-label { grid-area: label; text-align: center; }
    .char-bar select { grid-area: select; min-width: 0; }
    .char-bar #btn-ativo, .char-bar #btn-novo, .char-bar #btn-deletar {
      /* todos vão pra área acoes via wrapper */
    }
    .char-bar-acoes {
      grid-area: acoes;
      display: grid; grid-template-columns: 1fr auto auto; gap: 6px;
    }
    /* Aviso visibilidade mais compacto */
    .aviso-visibilidade { padding: 8px 12px; font-size: 12px; line-height: 1.4; gap: 8px; margin-bottom: 12px; }
    .aviso-visibilidade .icone { font-size: 16px; }
  }

  @media (max-width: 480px) {
    main { padding: 0 8px 30px; }
    .tab-content { padding: 14px 12px; }
    .char-bar { padding: 10px; gap: 8px; }
    .char-bar select { font-size: 14px; min-height: 40px; }
    .btn { min-height: 40px; padding: 10px 12px; }
    .estrela-ativo { min-height: 44px; min-width: 60px; }
    .grid-6 { grid-template-columns: repeat(2, 1fr); }
    .atributo { padding: 14px 8px; }
    .atributo .modificador { font-size: 24px; }
    .atributo .valor-base { padding: 8px 4px; font-size: 16px; min-height: 36px; }
    /* Tabs: scroll horizontal limpo */
    .tabs { gap: 0; padding: 0 4px; }
    .tab { padding: 14px 14px; font-size: 11px; min-height: 44px; }
    /* Check rows: touch friendly */
    .check-row { padding: 10px 12px; }
    .check-row input[type="checkbox"] { width: 22px; height: 22px; }
    .moedas { grid-template-columns: repeat(3, 1fr); }
    .moeda-box input { font-size: 16px; min-height: 36px; }
    /* Inputs ficam +touch */
    .campo input, .campo select { padding: 12px; min-height: 42px; font-size: 15px; }

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/phb_catalogo.js"></script>
<script src="../assets/js/phb_slots.js"></script>
<script>
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

const RACAS = ['','Anão','Elfo','Halfling','Humano','Draconato','Gnomo','Meio-Elfo','Meio-Orc','Tiefling'];
const CLASSES = ['','Bárbaro','Bardo','Bruxo','Clérigo','Druida','Feiticeiro','Guerreiro','Ladino','Mago','Monge','Paladino','Patrulheiro'];
const ALINHAMENTOS = ['','Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau'];
const ATRIBUTOS = [['for','Força'],['dex','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];
const CAMPANHAS = [
  ['', '— sem campanha —'],
  ['barovia', 'Maldição de Strahd (Barovia)'],
  ['mestre',  'Crônica dos Aventureiros'],
];

// Dado de vida fixo por classe (PHB 5e)
const DADO_VIDA_POR_CLASSE = {
  'barbaro': 12, 'bardo': 8, 'bruxo': 8, 'clerigo': 8, 'druida': 8,
  'feiticeiro': 6, 'guerreiro': 10, 'ladino': 8, 'mago': 6, 'monge': 8,
  'paladino': 10, 'patrulheiro': 10,
};
function dadoVidaDaClasse(classe) {
  return DADO_VIDA_POR_CLASSE[chaveDeClasse(classe)] || null;
}

// Subclasses oficiais do PHB 5e por classe (chave normalizada → lista)
const SUBCLASSES_POR_CLASSE = {
  'barbaro':    ['Caminho do Furioso', 'Caminho do Guerreiro Totêmico'],
  'bardo':      ['Colégio do Conhecimento', 'Colégio do Valor'],
  'bruxo':      ['Patrono Arquifada', 'Patrono Senhor das Trevas', 'Patrono Grande Antigo'],
  'clerigo':    ['Domínio do Conhecimento', 'Domínio da Vida', 'Domínio da Luz', 'Domínio da Natureza', 'Domínio da Tempestade', 'Domínio Trapaceiro', 'Domínio da Guerra', 'Domínio da Morte'],
  'druida':     ['Círculo da Terra', 'Círculo da Lua'],
  'feiticeiro': ['Linhagem Dracônica', 'Magia Selvagem'],
  'guerreiro':  ['Campeão', 'Mestre de Batalha', 'Cavaleiro Místico'],
  'ladino':     ['Ladrão', 'Assassino', 'Trapaceiro Arcano'],
  'mago':       ['Escola de Abjuração', 'Escola de Adivinhação', 'Escola de Conjuração', 'Escola de Encantamento', 'Escola de Evocação', 'Escola de Ilusão', 'Escola de Necromancia', 'Escola de Transmutação'],
  'monge':      ['Caminho da Mão Aberta', 'Caminho da Sombra', 'Caminho dos Quatro Elementos'],
  'paladino':   ['Juramento de Devoção', 'Juramento dos Anciões', 'Juramento de Vingança', 'Quebrador de Juramento'],
  'patrulheiro':['Caçador', 'Mestre das Feras'],
};

// Perícias do PHB 5e (PT-BR) — mapeadas para o atributo base
const PERICIAS = [
  ['acrobacia',         'Acrobacia',         'dex'],
  ['adestrar_animais',  'Adestrar Animais',  'sab'],
  ['arcanismo',         'Arcanismo',         'int'],
  ['atletismo',         'Atletismo',         'for'],
  ['atuacao',           'Atuação',           'car'],
  ['enganacao',         'Enganação',         'car'],
  ['furtividade',       'Furtividade',       'dex'],
  ['historia',          'História',          'int'],
  ['intimidacao',       'Intimidação',       'car'],
  ['intuicao',          'Intuição',          'sab'],
  ['investigacao',      'Investigação',      'int'],
  ['medicina',          'Medicina',          'sab'],
  ['natureza',          'Natureza',          'int'],
  ['percepcao',         'Percepção',         'sab'],
  ['persuasao',         'Persuasão',         'car'],
  ['prestidigitacao',   'Prestidigitação',   'dex'],
  ['religiao',          'Religião',          'int'],
  ['sobrevivencia',     'Sobrevivência',     'sab'],
];

// Habilidades fixas por classe x nível (carregadas async)
let HABILIDADES_CLASSES = null;
async function carregarHabilidadesClasses() {
  if (HABILIDADES_CLASSES) return HABILIDADES_CLASSES;
  try {
    const r = await fetch('../data/habilidades_classes.json');
    HABILIDADES_CLASSES = await r.json();
    return HABILIDADES_CLASSES;
  } catch { return {}; }
}
function chaveDeClasse(classe) {
  return (classe || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function classeUsaMagia(c) {
  if (!c) return false;
  const tipo = window.SlotsPHB ? window.SlotsPHB.tipoDaClasse(c.classe, c.subclasse) : null;
  return !!tipo;
}

const mod = v => Math.floor(((+v||10) - 10) / 2);
const fmtMod = m => (m >= 0 ? '+' : '') + m;
// Bônus de proficiência por nível (PHB 5e): 1-4=+2, 5-8=+3, 9-12=+4, 13-16=+5, 17-20=+6
const bonusProf = nv => Math.floor(((+nv || 1) - 1) / 4) + 2;

let usuario = null;
let chars = [];
let charAtivo = null;
let tabAtiva = 'identidade';
let _ultimoSaveLocal = 0;          // pra ignorar echo do próprio save
let canalFicha = null;             // canal realtime
let mudancaPendente = null;        // payload do update externo aguardando

// Favoritas: SOMENTE do banco (spell_lists do PJ ativo)
async function carregarFavoritasDoBanco() {
  if (!window.sb || !charAtivo?.id) return new Set();
  const { data, error } = await window.sb
    .from('spell_lists')
    .select('spell_names')
    .eq('character_id', charAtivo.id)
    .eq('nome', 'Favoritas')
    .maybeSingle();
  if (error) { console.warn('[ficha] favoritas:', error.message); return new Set(); }
  return new Set(data?.spell_names || []);
}

// Catálogo de magias (carrega só quando necessário)
let magiasCache = null;
async function carregarMagiasCache() {
  if (magiasCache) return magiasCache;
  try {
    const r = await fetch('../data/magias_data.json');
    magiasCache = await r.json();
    return magiasCache;
  } catch { return []; }
}

async function init() {
  usuario = await window.Auth.requerLogin('login.html');
  if (!usuario) return;
  await window.Auth.renderHeader('#auth-slot');
  await carregarPersonagens();
  escutarMudancasExternas();
  configurarToastExterno();
}

// ─── Realtime: detecta quando o Mestre (ou outra aba) edita meu PJ ─
function escutarMudancasExternas() {
  if (!window.sb || !usuario) return;
  if (canalFicha) canalFicha.unsubscribe();
  canalFicha = window.sb.channel('ficha-' + usuario.id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'characters', filter: `user_id=eq.${usuario.id}` },
      payload => onUpdateExterno(payload.new))
    .subscribe();
}

let _toastDebounce = null;
function onUpdateExterno(novo) {
  // Ignora se foi nosso próprio save (echo do realtime — em até 3s)
  if (Date.now() - _ultimoSaveLocal < 3000) return;
  // Atualiza chars silenciosamente sempre (mantém cache fresco)
  const idx = chars.findIndex(c => c.id === novo.id);
  if (idx >= 0) chars[idx] = novo;
  // Só notifica se for o PJ ativo
  if (!charAtivo || novo.id !== charAtivo.id) return;
  // Sempre guarda a versão MAIS RECENTE (substitui pendente)
  mudancaPendente = novo;
  // Debounce de 2s: enquanto chegarem updates, espera. Só mostra toast
  // quando o Mestre parar de digitar (evita spam de notificação durante auto-save).
  if (_toastDebounce) clearTimeout(_toastDebounce);
  _toastDebounce = setTimeout(() => {
    _toastDebounce = null;
    if (!mudancaPendente) return;
    const tEl = document.getElementById('toast-externo');
    const tMsg = document.getElementById('te-msg');
    if (tMsg) tMsg.textContent = `O Mestre editou "${mudancaPendente.nome}". Aplicar mudanças agora?`;
    if (tEl) tEl.classList.add('show');
  }, 2000);
}

function configurarToastExterno() {
  const tEl = document.getElementById('toast-externo');
  const btnAtualizar = document.getElementById('te-atualizar');
  const btnIgnorar  = document.getElementById('te-ignorar');
  if (btnAtualizar) btnAtualizar.addEventListener('click', () => {
    if (mudancaPendente) {
      charAtivo = mudancaPendente;
      chars = chars.map(c => c.id === charAtivo.id ? charAtivo : c);
      mudancaPendente = null;
      render();
    }
    if (tEl) tEl.classList.remove('show');
  });
  if (btnIgnorar) btnIgnorar.addEventListener('click', () => {
    mudancaPendente = null;
    if (tEl) tEl.classList.remove('show');
  });
}

async function carregarPersonagens() {
  const { data, error } = await window.sb
    .from('characters').select('*')
    .eq('user_id', usuario.id)
    .order('created_at', { ascending: true });
  if (error) {
    $('#conteudo').innerHTML = `<div class="estado">Erro ao carregar: ${escape(error.message)}</div>`;
    return;
  }
  chars = data || [];
  if (!chars.length) {
    await criarPersonagem('Meu Personagem', true);  // novo PJ já ativo
    return;
  }
  charAtivo = chars[0];
  render();
}

async function criarPersonagem(nome, jaAtivo = false) {
  const payload = { user_id: usuario.id, nome: nome || 'Novo Personagem' };
  if (jaAtivo) payload.is_active = true;
  const { data, error } = await window.sb.from('characters').insert(payload).select('*').single();
  if (error) { alert('Erro ao criar personagem: ' + error.message); return; }
  chars.push(data);
  charAtivo = data;
  render();
}

async function deletarPersonagem(id) {
  if (!confirm('Deletar este personagem? Suas favoritas e dados serão perdidos.')) return;
  const { error } = await window.sb.from('characters').delete().eq('id', id);
  if (error) { alert('Erro ao deletar: ' + error.message); return; }
  chars = chars.filter(c => c.id !== id);
  charAtivo = chars[0] || null;
  if (!charAtivo) { await criarPersonagem('Meu Personagem', true); return; }
  render();
}

async function alternarAtivo() {
  const novo = !charAtivo.is_active;
  const { error } = await window.sb
    .from('characters').update({ is_active: novo }).eq('id', charAtivo.id);
  if (error) { alert('Erro: ' + error.message); return; }
  // Trigger no banco desativa os outros do mesmo user
  charAtivo.is_active = novo;
  if (novo) chars = chars.map(c => ({ ...c, is_active: c.id === charAtivo.id }));
  render();
}

function escape(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Parser de número com vírgula PT-BR (10,5 → 10.5)
function parseNum(txt, opts = {}) {
  if (txt === null || txt === undefined || txt === '') return opts.padrao ?? 0;
  const s = String(txt).replace(',', '.').trim();
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  if (opts.min !== undefined && n < opts.min) return null;
  if (opts.max !== undefined && n > opts.max) return null;
  if (opts.inteiro && !Number.isInteger(n)) return null;
  return n;
}

function renderSubclasseSelect(classe, atual) {
  const chave = chaveDeClasse(classe);
  const opcoes = SUBCLASSES_POR_CLASSE[chave] || [];
  if (!opcoes.length) {
    return `<select name="subclasse" disabled style="opacity:.5"><option>${classe ? 'Sem subclasses cadastradas' : 'Escolha uma classe'}</option></select>`;
  }
  return `<select name="subclasse" id="sel-subclasse">
    <option value="">— escolher —</option>
    ${opcoes.map(o => `<option ${o===atual?'selected':''}>${escape(o)}</option>`).join('')}
  </select>`;
}

function renderListaTags(field, label, valores) {
  const tags = (valores || []).map((v, i) =>
    `<span class="tag">${escape(v)}<span class="x" data-rmtag="${field}" data-idx="${i}" role="button" tabindex="0">✕</span></span>`).join('');
  return `<div class="campo"><label>${label}</label>
    <div class="lista-tags" id="tags-${field}">${tags || '<span style="color:var(--text-dim);font-style:italic;font-size:12px;padding:4px">Nenhum</span>'}</div>
    <div class="lista-tags-add">
      <input type="text" id="add-${field}-input" placeholder="Adicionar...">
      <button type="button" class="btn" data-addtag="${field}">+</button>
    </div></div>`;
}

function renderTab(c, atrs) {
  // Se PJ não usa magia e a tab "magias" estava ativa, joga pra identidade
  if (tabAtiva === 'magias' && !classeUsaMagia(c)) tabAtiva = 'identidade';
  switch (tabAtiva) {
    case 'identidade':  return renderIdentidade(c, atrs);
    case 'combate':     return renderCombate(c);
    case 'habilidades': return renderHabilidades(c);
    case 'magias':      return renderMagias(c);
    case 'equipamento': return renderEquipamento(c);
    case 'roleplay':    return renderRoleplay(c);
  }
}

function renderSlotsMagia(c, slots) {
  const tipo = (window.SlotsPHB && c.classe) ? window.SlotsPHB.tipoDaClasse(c.classe, c.subclasse) : null;
  const slotsClasse = (window.SlotsPHB && c.classe) ? window.SlotsPHB.porClasse(c.classe, c.nivel || 1, c.subclasse) : null;

  // Classe sem slots (Bárbaro, Guerreiro, Ladino, Monge sem subclasse mágica)
  if (!slotsClasse) {
    return `<div class="slots-vazio">⚔️ ${c.classe || 'Classe'} não recebe espaços de magia pelas regras padrão.<br><span style="font-size:11px">(Subclasses Cavaleiro Místico e Trapaceiro Arcano podem ter — registre em "Características Adicionais".)</span></div>`;
  }

  const cabecalho = tipo === 'pact'
    ? `<div class="slots-info"><span class="ic">🔮</span><div>Bruxo usa <strong>Magia do Pacto</strong>: todos os slots são do mesmo nível e recuperam em <strong>descanso curto</strong>.</div></div>`
    : tipo === 'third'
    ? `<div class="slots-info"><span class="ic">📜</span><div>1/3 conjurador (<strong>${escape(c.subclasse)}</strong>) · Nível <strong>${c.nivel||1}</strong>. Slots calculados pela subclasse, recuperam em <strong>descanso longo</strong>.</div></div>`
    : `<div class="slots-info"><span class="ic">📜</span><div>Espaços calculados automaticamente: <strong>${c.classe}</strong> · Nível <strong>${c.nivel||1}</strong>. Recuperam em <strong>descanso longo</strong>.</div></div>`;

  const niveisComSlots = Object.entries(slotsClasse).filter(([nv, max]) => max > 0);
  if (!niveisComSlots.length) {
    return cabecalho + `<div class="slots-vazio">No nível atual, esta classe ainda não tem espaços de magia.</div>`;
  }

  return cabecalho + `<div class="slots-grid">
    ${[1,2,3,4,5,6,7,8,9].map(nv => {
      const max = slotsClasse[nv] || 0;
      const s = slots[nv] || { atual: 0, max: 0 };
      const usados = Math.min(s.atual || 0, max);
      const disponivel = max - usados;
      if (max === 0) {
        return `<div class="slot-card indisponivel">
          <div class="slot-titulo">Nível ${nv}</div>
          <div class="slot-max">—</div>
          <div class="slot-status">indisponível</div>
        </div>`;
      }
      const pips = Array.from({length: max}).map((_, i) =>
        `<button type="button" class="slot-pip ${i < usados ? 'gasto' : ''}" data-slot-nv="${nv}" data-slot-idx="${i}" aria-label="Slot ${nv}° nível, espaço ${i+1}, ${i < usados ? 'gasto' : 'disponível'}"></button>`
      ).join('');
      return `<div class="slot-card">
        <div class="slot-titulo">Nível ${nv}</div>
        <div class="slot-max" title="Máximo da classe">${max}</div>
        <div class="slot-pips" data-slot-nv="${nv}">${pips}</div>
        <div class="slot-status"><strong>${disponivel}</strong> / ${max} disponíveis</div>
        <input type="hidden" name="slot_${nv}_max" value="${max}">
        <input type="hidden" name="slot_${nv}_atual" value="${usados}">
      </div>`;
    }).join('')}
  </div>`;
}

function slugFeature(nome) {
  return (nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 80);
}

// Detecta se uma feature tem usos limitados por descanso/dia analisando
// nome + descrição. Retorna {max, periodo, tipo} ou null para passivas.
// max=0 quando a fórmula é variável (ex.: "1 + mod CAR") — usuário ajusta.
function detectarUsosLimitados(h) {
  const txt = (h.nome || '') + ' ' + (h.desc || '');

  // 1) (N/descanso|dia|longo|curto) — padrão explícito no nome
  let m = txt.match(/\(\s*(\d+)\s*\/\s*(descanso(?:\s+(?:curto|longo))?|dia|longo|curto|long\.?|curt\.?)\s*\)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 2) (N uso/usos) no nome
  m = txt.match(/\(\s*(\d+)\s+usos?\s*\)/i);
  if (m) return { max: +m[1], periodo: 'descanso' };

  // 3) "Nx/descanso" ou "Nx/dia" (sem parênteses)
  m = txt.match(/(\d+)\s*x\s*\/\s*(descanso(?:\s+(?:curto|longo))?|dia|longo|curto)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 4) "N vezes por (descanso|dia)" ou "N vezes entre descansos"
  m = txt.match(/(\d+)\s+vezes?\s+(?:por|a\s+cada|entre)\s+(descanso[s]?(?:\s+(?:curto|longo))?|dia)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 5) "uma vez por (descanso|dia|turno)"
  if (/uma\s+vez\s+(?:por|a\s+cada|entre)\s+(descanso|dia|turno)/i.test(txt)) {
    return { max: 1, periodo: RegExp.$1.toLowerCase() };
  }

  // 6) "1x cada/descanso" / "1x/dia"
  m = txt.match(/(\d+)\s*x\s+cada\s+(descanso|dia)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 7) Fórmula "Usos = X" ou "X usos = ..." (ex.: Sentido Divino do Paladino)
  if (/usos?\s*=/i.test(txt) || /usos?\s*por\s+descanso/i.test(txt)) {
    return { max: 0, periodo: 'descanso' };  // editável manualmente
  }

  // 8) "/descanso longo" ou "/descanso curto" no fim de uma cláusula com número
  m = txt.match(/(\d+)\s*\/\s*(descanso\s+(?:curto|longo)|dia|longo|curto)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 9) "recupera em descanso" + número de cargas/pontos no início (ex.: pontos de feitiçaria)
  if (/recupera\s+em\s+descanso\s+(curto|longo)/i.test(txt) &&
      /(\d+)\s+(?:pontos?|cargas?|usos?)/i.test(txt)) {
    return { max: 0, periodo: 'descanso ' + RegExp.$1.toLowerCase() };  // editável
  }

  return null;  // passiva — sem tracker
}

async function popularHabilidades(classe, nivel, subclasse) {
  const wrap = document.getElementById('hab-wrap');
  if (!wrap) return;
  if (!classe) {
    wrap.innerHTML = `<div class="item-vazio">Sem classe definida.</div>`;
    return;
  }
  const db = await carregarHabilidadesClasses();
  const todas = db[chaveDeClasse(classe)] || [];
  // Filtra: nivel <= atual AND (sem subclasse OR subclasse === subclasse do PJ)
  const habs = todas.filter(h => h.nivel <= (nivel || 1) && (!h.subclasse || h.subclasse === subclasse));
  if (!habs.length) {
    wrap.innerHTML = `<div class="item-vazio">Nenhuma habilidade encontrada para ${escape(classe)}.</div>`;
    return;
  }
  // Agrupa por nível
  const porNivel = {};
  for (const h of habs) (porNivel[h.nivel] = porNivel[h.nivel] || []).push(h);
  const recursos = charAtivo.recursos_usados || {};

  wrap.innerHTML = Object.entries(porNivel).sort(([a],[b]) => +a - +b).map(([nv, lista]) => `
    <div class="habilidade-card">
      <h4>Nível ${nv}</h4>
      ${lista.map(h => {
        const slug = slugFeature(h.nome);
        const detectado = detectarUsosLimitados(h);
        const r = recursos[slug] || {};
        // max efetivo: o que está salvo > o detectado pelo regex
        const maxSalvo = +r.max || 0;
        const maxDetectado = detectado ? +detectado.max : 0;
        const max = maxSalvo > 0 ? maxSalvo : maxDetectado;
        const usos = Math.min(+r.atual || 0, max);
        const disp = Math.max(0, max - usos);

        // SEM tracker: feature passiva (nenhum padrão de uso detectado)
        if (!detectado && maxSalvo === 0) {
          return `<div class="hab-feature passiva" data-hab-slug="${slug}">
            ${h.subclasse ? `<span class="hab-sub-tag">${escape(h.subclasse)}</span>` : ''}
            <div class="hab-feature-titulo">
              <strong>${escape(h.nome)}.</strong>
              <span class="hab-desc">${escape(h.desc || '—')}</span>
            </div>
          </div>`;
        }

        // COM tracker: feature usável (limite detectado ou já configurado)
        const periodo = detectado?.periodo || 'descanso';
        const pips = max > 0 ? Array.from({length: max}).map((_, i) =>
          `<button type="button" class="hab-pip ${i < usos ? 'gasto' : ''}" data-hab-slug="${slug}" data-hab-idx="${i}" aria-label="Uso ${i+1} ${i < usos ? 'gasto' : 'disponível'}"></button>`
        ).join('') : '';
        return `<div class="hab-feature ativa" data-hab-slug="${slug}">
          ${h.subclasse ? `<span class="hab-sub-tag">${escape(h.subclasse)}</span>` : ''}
          <div class="hab-feature-head">
            <div class="hab-feature-titulo">
              <strong>${escape(h.nome)}.</strong>
              <span class="hab-desc">${escape(h.desc || '—')}</span>
            </div>
            <div class="hab-tracker" title="Recupera em ${escape(periodo)}">
              <label class="hab-tracker-lbl">Usos:</label>
              ${max > 0 ? `
                <span class="hab-pips">${pips}</span>
                <span class="hab-disp"><strong>${disp}</strong>/${max}</span>
              ` : ''}
              <input type="text" inputmode="numeric" class="hab-tracker-max" value="${max}" data-hab-max="${slug}" aria-label="Máximo de usos" title="Ajuste o máximo (a regra padrão é ${detectado?.max || '?'})">
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  // Listeners dos pips (toggle gasto/disponível) e do max
  wrap.querySelectorAll('.hab-pip').forEach(pip => {
    pip.addEventListener('click', () => {
      const slug = pip.dataset.habSlug;
      const idx  = +pip.dataset.habIdx;
      const rec  = charAtivo.recursos_usados || {};
      const cur  = rec[slug] || { atual: 0, max: 0 };
      // Click no pip "gasto" → recupera 1; click no pip "disponível" → gasta 1
      cur.atual = pip.classList.contains('gasto') ? idx : idx + 1;
      cur.atual = Math.max(0, Math.min(cur.max, cur.atual));
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursos();
      popularHabilidades(classe, nivel, subclasse);  // re-render
    });
  });

  wrap.querySelectorAll('.hab-tracker-max').forEach(inp => {
    inp.addEventListener('change', () => {
      const slug = inp.dataset.habMax;
      const val  = Math.max(0, Math.min(20, parseInt(inp.value, 10) || 0));
      const rec  = charAtivo.recursos_usados || {};
      const cur  = rec[slug] || { atual: 0, max: 0 };
      cur.max = val;
      cur.atual = Math.min(cur.atual, val);
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursos();
      popularHabilidades(classe, nivel, subclasse);
    });
  });
}

// Salva recursos_usados via UPDATE direto (sem passar pelo form geral, que pode estar em outra tab)
async function salvarRecursos() {
  if (!charAtivo?.id) return;
  try {
    _ultimoSaveLocal = Date.now();
    await window.sb.from('characters')
      .update({ recursos_usados: charAtivo.recursos_usados || {} })
      .eq('id', charAtivo.id);
  } catch (e) { console.warn('[recursos] erro ao salvar:', e); }
}

// Renderiza a lista de features personalizadas (cards estruturados)
function popularFeaturesPersonalizadas() {
  const wrap = document.getElementById('hab-custom-wrap');
  if (!wrap) return;
  const lista = Array.isArray(charAtivo.features_personalizadas) ? charAtivo.features_personalizadas : [];
  if (!lista.length) {
    wrap.innerHTML = `<div class="item-vazio" style="padding:14px">Nenhuma característica personalizada ainda. Clique <strong>+ Adicionar característica</strong> acima.</div>`;
    return;
  }
  const recursos = charAtivo.recursos_usados || {};
  wrap.innerHTML = `<div class="habilidade-card">
    ${lista.map((f, idx) => {
      const slug = 'custom_' + (f.id || idx);
      const max = +f.max || 0;
      const r = recursos[slug] || { atual: 0, max: 0 };
      const maxEfetivo = max > 0 ? max : (+r.max || 0);
      const usos = Math.min(+r.atual || 0, maxEfetivo);
      const disp = Math.max(0, maxEfetivo - usos);
      const pips = maxEfetivo > 0 ? Array.from({length: maxEfetivo}).map((_, i) =>
        `<button type="button" class="hab-pip ${i < usos ? 'gasto' : ''}" data-cfeat-slug="${slug}" data-cfeat-idx="${i}" aria-label="Uso ${i+1}"></button>`
      ).join('') : '';
      return `<div class="hab-feature ${maxEfetivo > 0 ? 'ativa' : 'passiva'}" data-cfeat-idx="${idx}">
        <button type="button" class="cfeat-remove" data-cfeat-rm="${idx}" title="Remover" aria-label="Remover característica">✕</button>
        <div class="hab-feature-head">
          <div class="hab-feature-titulo">
            <input type="text" class="cfeat-nome" data-cfeat-field="nome" data-cfeat-idx="${idx}" value="${escape(f.nome || '')}" placeholder="Nome da característica" aria-label="Nome">
            <textarea class="cfeat-desc" data-cfeat-field="desc" data-cfeat-idx="${idx}" placeholder="Descrição (opcional)" aria-label="Descrição">${escape(f.desc || '')}</textarea>
          </div>
          <div class="hab-tracker">
            <label class="hab-tracker-lbl">Usos:</label>
            ${maxEfetivo > 0 ? `
              <span class="hab-pips">${pips}</span>
              <span class="hab-disp"><strong>${disp}</strong>/${maxEfetivo}</span>
            ` : ''}
            <input type="text" inputmode="numeric" class="hab-tracker-max" value="${max}" data-cfeat-max="${idx}" title="Máximo de usos (0 = passiva, sem tracker)" aria-label="Máximo de usos">
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // Pip click → toggle gasto
  wrap.querySelectorAll('.hab-pip[data-cfeat-slug]').forEach(pip => {
    pip.addEventListener('click', () => {
      const slug = pip.dataset.cfeatSlug;
      const idx  = +pip.dataset.cfeatIdx;
      const rec  = charAtivo.recursos_usados || {};
      const featList = charAtivo.features_personalizadas || [];
      const featIdx = featList.findIndex((f, i) => 'custom_' + (f.id || i) === slug);
      const max = featIdx >= 0 ? (+featList[featIdx].max || 0) : 0;
      const cur = rec[slug] || { atual: 0, max };
      cur.max = max;
      cur.atual = pip.classList.contains('gasto') ? idx : (idx + 1);
      cur.atual = Math.max(0, Math.min(max, cur.atual));
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursos();
      popularFeaturesPersonalizadas();
    });
  });

  // Nome / desc / max — salva no estado
  wrap.querySelectorAll('[data-cfeat-field]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = +el.dataset.cfeatIdx;
      const field = el.dataset.cfeatField;
      if (!charAtivo.features_personalizadas[idx]) return;
      charAtivo.features_personalizadas[idx][field] = el.value;
      salvarFeaturesPersonalizadas();
    });
  });

  wrap.querySelectorAll('.hab-tracker-max[data-cfeat-max]').forEach(inp => {
    inp.addEventListener('change', () => {
      const idx = +inp.dataset.cfeatMax;
      const val = Math.max(0, Math.min(20, parseInt(inp.value, 10) || 0));
      if (!charAtivo.features_personalizadas[idx]) return;
      charAtivo.features_personalizadas[idx].max = val;
      // Ajusta recursos_usados também
      const f = charAtivo.features_personalizadas[idx];
      const slug = 'custom_' + (f.id || idx);
      const rec = charAtivo.recursos_usados || {};
      const cur = rec[slug] || { atual: 0, max: 0 };
      cur.max = val;
      cur.atual = Math.min(cur.atual, val);
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarFeaturesPersonalizadas();
      salvarRecursos();
      popularFeaturesPersonalizadas();
    });
  });

  // Remover
  wrap.querySelectorAll('[data-cfeat-rm]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.cfeatRm;
      if (!confirm('Remover esta característica?')) return;
      const f = charAtivo.features_personalizadas[idx];
      if (f) {
        const slug = 'custom_' + (f.id || idx);
        const rec = charAtivo.recursos_usados || {};
        delete rec[slug];
        charAtivo.recursos_usados = rec;
      }
      charAtivo.features_personalizadas.splice(idx, 1);
      salvarFeaturesPersonalizadas();
      salvarRecursos();
      popularFeaturesPersonalizadas();
    });
  });
}

function abrirModalConjurar(nomeMagia, nivelMin) {
  const c = charAtivo;
  const slotsClasse = (window.SlotsPHB && c.classe) ? window.SlotsPHB.porClasse(c.classe, c.nivel || 1, c.subclasse) : null;
  if (!slotsClasse) {
    alert('Sua classe/subclasse não tem espaços de magia.');
    return;
  }
  const slotsAtuais = c.slots_magia || {};
  // Lista níveis ≥ nivelMin com slots disponíveis
  const opcoes = [];
  for (let n = nivelMin; n <= 9; n++) {
    const max = slotsClasse[n] || 0;
    const usados = (slotsAtuais[n]?.atual) || 0;
    const disp = Math.max(0, max - usados);
    if (max > 0) opcoes.push({ nv: n, disp, max });
  }
  if (!opcoes.length) {
    alert(`Sem espaços de nível ${nivelMin} ou superior nesta classe.`);
    return;
  }

  // Cria overlay
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h3 id="modal-titulo">✨ Conjurar <em>${escape(nomeMagia)}</em></h3>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:14px">
        Magia de <strong>${nivelMin}° nível</strong>. Escolha em qual espaço gastar:
      </p>
      <div class="modal-slots">
        ${opcoes.map(o => `
          <button type="button" class="modal-slot-btn" ${o.disp <= 0 ? 'disabled' : ''} data-nv="${o.nv}">
            <div class="modal-slot-nv">Nível ${o.nv}</div>
            <div class="modal-slot-disp">${o.disp} / ${o.max}</div>
            <div class="modal-slot-lbl">${o.disp <= 0 ? 'esgotado' : (o.nv > nivelMin ? 'upcast' : 'disponível')}</div>
          </button>
        `).join('')}
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn" id="modal-cancelar">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const fechar = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });
  overlay.querySelector('#modal-cancelar').addEventListener('click', fechar);

  overlay.querySelectorAll('.modal-slot-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', async () => {
      const nv = +btn.dataset.nv;
      const slots = c.slots_magia || {};
      const max = slotsClasse[nv] || 0;
      const atual = (slots[nv]?.atual) || 0;
      slots[nv] = { atual: Math.min(max, atual + 1), max };
      c.slots_magia = slots;
      fechar();
      // Salva direto (não passa pelo form, evita conflito de tabs)
      try {
        _ultimoSaveLocal = Date.now();
        await window.sb.from('characters').update({ slots_magia: slots }).eq('id', c.id);
        mostrarToastConjurar(nomeMagia, nv);
      } catch (e) {
        alert('Erro ao gastar slot: ' + e.message);
      }
    });
  });

  // ESC fecha
  const onKey = (e) => { if (e.key === 'Escape') { fechar(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
}

function mostrarToastConjurar(nome, nv) {
  const t = document.createElement('div');
  t.className = 'toast-conjurar';
  t.innerHTML = `✨ <strong>${escape(nome)}</strong> conjurada · slot de nível ${nv} gasto`;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2500);
}

// Gera <optgroup> agrupando pela propriedade `categoria` (alfabético dentro do grupo).
function optgroupsPorCategoria(lista, formatarRotulo) {
  const grupos = {};
  for (const it of lista) {
    const cat = it.categoria || 'Outros';
    (grupos[cat] = grupos[cat] || []).push(it);
  }
  // Lista já vem ordenada alfabeticamente; só agrupa
  return Object.keys(grupos).sort((a,b) => a.localeCompare(b, 'pt'))
    .map(cat => `<optgroup label="${escape(cat)}">
      ${grupos[cat].map(it => `<option value='${escape(JSON.stringify(it))}'>${formatarRotulo(it)}</option>`).join('')}
    </optgroup>`).join('');
}

// Para armaduras: agrupa pelo campo `tipo` (Leve / Média / Pesada / Escudo)
function optgroupsPorTipo(lista, formatarRotulo) {
  const grupos = {};
  for (const it of lista) {
    const cat = it.tipo || 'Outros';
    (grupos[cat] = grupos[cat] || []).push(it);
  }
  const ordem = ['Leve', 'Média', 'Pesada', 'Escudo'];
  return Object.keys(grupos).sort((a,b) => {
    const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  }).map(cat => `<optgroup label="${escape(cat)}">
    ${grupos[cat].map(it => `<option value='${escape(JSON.stringify(it))}'>${formatarRotulo(it)}</option>`).join('')}
  </optgroup>`).join('');
}

}

  if (btn) btn.classList.toggle('editando', !bloqueado);
  if (hint) hint.style.display = bloqueado ? '' : 'none';
}
