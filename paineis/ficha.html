<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Minha Ficha — Personagem D&D 5e">
<meta name="theme-color" content="#0a0608">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<title>Minha Ficha — D&D 5e</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0608;
    --bg-card: #1a1018;
    --bg-card-soft: #221520;
    --gold: #8B6914;
    --gold-bright: #b88a2c;
    --blood: #6b1010;
    --blood-bright: #8b1d1d;
    --parchment: #d4c5a0;
    --parchment-dim: #a89878;
    --shadow: #050304;
    --text-dim: #8c7d5e;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg-deep) radial-gradient(ellipse at top, #1e1018 0%, #0d0810 50%, #050304 100%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
  }

  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,6,8,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--gold);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }
  .back-btn, .auth-btn {
    text-decoration: none;
    color: var(--parchment-dim);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid var(--gold);
    border-radius: 2px;
    transition: all 0.2s;
    background: transparent; cursor: pointer;
  }
  .back-btn:hover, .auth-btn:hover { background: var(--gold); color: var(--shadow); }
  .header-title {
    font-family: 'Cinzel Decorative', serif; font-size: clamp(16px, 3vw, 24px);
    font-weight: 700; color: var(--gold-bright); letter-spacing: 2px;
    flex: 1; text-align: center;
  }
  .auth-slot { display: flex; align-items: center; gap: 8px; font-family: 'Cinzel', serif; font-size: 11px; }
  .auth-nome { color: var(--parchment-dim); letter-spacing: 1px; }
  @media (max-width: 600px) { .auth-nome { display: none; } }

  main {
    max-width: 980px;
    margin: 24px auto;
    padding: 0 16px 48px;
  }

  .estado {
    padding: 24px; text-align: center;
    color: var(--text-dim); font-style: italic;
  }

  /* Seletor de personagem */
  .char-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .char-bar select, .char-bar input {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--gold);
    color: var(--parchment);
    font-family: 'EB Garamond', serif; font-size: 15px;
    padding: 9px 12px; border-radius: 3px; outline: none;
  }
  .char-bar select { min-width: 240px; }
  .char-bar select:focus, .char-bar input:focus { border-color: var(--gold-bright); }
  .char-bar option { background: #1a1018; }
  .btn-novo, .btn-deletar {
    padding: 9px 16px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--parchment);
    font-family: 'Cinzel', serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    border-radius: 3px; cursor: pointer; transition: all 0.2s;
  }
  .btn-novo:hover { background: var(--gold); color: var(--shadow); }
  .btn-deletar { border-color: var(--blood); color: #c47a5a; }
  .btn-deletar:hover { background: var(--blood); color: var(--parchment); }

  /* Card ficha */
  .ficha {
    background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
    border: 1px solid rgba(139,105,20,0.5);
    border-radius: 4px;
    padding: 22px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .ficha h2 {
    font-family: 'Cinzel Decorative', serif;
    color: var(--gold-bright); font-size: 18px;
    margin: 22px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(139,105,20,0.3);
    letter-spacing: 1px;
  }
  .ficha h2:first-of-type { margin-top: 0; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (max-width: 700px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
  }

  .campo label {
    display: block;
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--gold); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(139,105,20,0.3);
    color: var(--parchment);
    font-family: 'EB Garamond', serif; font-size: 14px;
    padding: 7px 10px; border-radius: 3px; outline: none;
    transition: border-color 0.15s;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus {
    border-color: var(--gold-bright); background: rgba(255,255,255,0.06);
  }
  .campo textarea { min-height: 60px; resize: vertical; }
  .campo input[type="number"] { -moz-appearance: textfield; }

  .atributo {
    text-align: center;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(139,105,20,0.4);
    border-radius: 4px;
    padding: 10px 6px;
  }
  .atributo label { font-size: 10px; }
  .atributo input {
    width: 100%; text-align: center;
    background: transparent; border: none;
    color: var(--gold-bright); font-size: 22px;
    font-family: 'Cinzel', serif; font-weight: 700;
    margin: 4px 0;
  }
  .mod {
    display: block; color: var(--parchment-dim);
    font-size: 13px; font-family: 'Cinzel', serif;
  }

  .slot-linha {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    gap: 8px; align-items: center;
    padding: 4px 0;
  }
  .slot-linha .lvl { font-family: 'Cinzel', serif; color: var(--gold); font-size: 12px; }

  .acoes {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 24px; padding-top: 18px;
    border-top: 1px solid rgba(139,105,20,0.3);
  }
  .btn-salvar {
    padding: 11px 28px;
    background: linear-gradient(to bottom, var(--gold), #6a4f0e);
    border: 1px solid var(--gold-bright); color: var(--shadow);
    font-family: 'Cinzel', serif; font-size: 12px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    border-radius: 2px; cursor: pointer; transition: all 0.2s;
  }
  .btn-salvar:hover { background: linear-gradient(to bottom, var(--gold-bright), var(--gold)); }
  .btn-salvar:disabled { opacity: 0.6; cursor: wait; }

  .status-msg {
    margin-right: auto;
    font-size: 13px; font-style: italic;
    color: var(--text-dim);
  }
  .status-msg.ok    { color: #8fc28f; }
  .status-msg.erro  { color: #e88a8a; }

  *:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="back-btn">← Voltar</a>
  <div class="header-title">Minha Ficha</div>
  <div class="auth-slot" id="auth-slot" aria-label="Status de login"></div>
</header>

<main>
  <div id="conteudo">
    <div class="estado">Carregando…</div>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
const $ = sel => document.querySelector(sel);

const RACAS = ['','Anão','Elfo','Halfling','Humano','Draconato','Gnomo','Meio-Elfo','Meio-Orc','Tiefling'];
const CLASSES = ['','Bárbaro','Bardo','Bruxo','Clérigo','Druida','Feiticeiro','Guerreiro','Ladino','Mago','Monge','Paladino','Patrulheiro'];
const ALINHAMENTOS = ['','Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau'];
const ATRIBUTOS = [['for','Força'],['dex','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];

const mod = v => Math.floor(((+v||10) - 10) / 2);
const fmtMod = m => (m >= 0 ? '+' : '') + m;

let usuario  = null;
let chars    = [];
let charAtivo = null;

async function init() {
  usuario = await window.Auth.requerLogin('login.html');
  if (!usuario) return;  // redirecionou
  await window.Auth.renderHeader('#auth-slot');
  await carregarPersonagens();
}

async function carregarPersonagens() {
  const { data, error } = await window.sb
    .from('characters').select('*')
    .eq('user_id', usuario.id)
    .order('created_at', { ascending: true });
  if (error) {
    $('#conteudo').innerHTML = `<div class="estado">Erro ao carregar: ${escape(error.message)}</div>`;
    return;
  }
  chars = data || [];
  if (!chars.length) {
    await criarPersonagem('Meu Personagem');
    return;
  }
  charAtivo = chars[0];
  render();
}

async function criarPersonagem(nome) {
  const { data, error } = await window.sb
    .from('characters')
    .insert({ user_id: usuario.id, nome: nome || 'Novo Personagem' })
    .select('*').single();
  if (error) { alert('Erro ao criar personagem: ' + error.message); return; }
  chars.push(data);
  charAtivo = data;
  render();
}

async function deletarPersonagem(id) {
  if (!confirm('Deletar este personagem? Suas favoritas e dados serão perdidos.')) return;
  const { error } = await window.sb.from('characters').delete().eq('id', id);
  if (error) { alert('Erro ao deletar: ' + error.message); return; }
  chars = chars.filter(c => c.id !== id);
  charAtivo = chars[0] || null;
  if (!charAtivo) { await criarPersonagem('Meu Personagem'); return; }
  render();
}

function escape(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const c = charAtivo;
  const atrs = c.atributos || {for:10,dex:10,con:10,int:10,sab:10,car:10};
  const slots = c.slots_magia || {};

  $('#conteudo').innerHTML = `
    <div class="char-bar">
      <label for="sel-char" style="font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase">Personagem</label>
      <select id="sel-char">
        ${chars.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${escape(x.nome)}${x.classe ? ' — ' + escape(x.classe) + (x.nivel ? ' N' + x.nivel : '') : ''}</option>`).join('')}
      </select>
      <button class="btn-novo" type="button" id="btn-novo">+ Novo</button>
      <button class="btn-deletar" type="button" id="btn-deletar">Deletar</button>
    </div>

    <form class="ficha" id="ficha-form">
      <h2>Identidade</h2>
      <div class="grid-2">
        <div class="campo"><label>Nome do Personagem</label><input name="nome" value="${escape(c.nome)}" required></div>
        <div class="campo"><label>Nível</label><input name="nivel" type="number" min="1" max="20" value="${c.nivel||1}"></div>
        <div class="campo"><label>Raça</label><select name="raca">${RACAS.map(r => `<option ${r===c.raca?'selected':''}>${r}</option>`).join('')}</select></div>
        <div class="campo"><label>Classe</label><select name="classe">${CLASSES.map(cl => `<option ${cl===c.classe?'selected':''}>${cl}</option>`).join('')}</select></div>
        <div class="campo"><label>Subclasse</label><input name="subclasse" value="${escape(c.subclasse||'')}"></div>
        <div class="campo"><label>Origem (Background)</label><input name="origem" value="${escape(c.origem||'')}"></div>
        <div class="campo"><label>Alinhamento</label><select name="alinhamento">${ALINHAMENTOS.map(a => `<option ${a===c.alinhamento?'selected':''}>${a}</option>`).join('')}</select></div>
      </div>

      <h2>Atributos</h2>
      <div class="grid-6">
        ${ATRIBUTOS.map(([k,nome]) => `
          <div class="atributo">
            <label>${nome.slice(0,3).toUpperCase()}</label>
            <input type="number" name="attr_${k}" min="1" max="30" value="${atrs[k] ?? 10}" data-attr="${k}">
            <span class="mod" data-mod="${k}">${fmtMod(mod(atrs[k]))}</span>
          </div>
        `).join('')}
      </div>

      <h2>Combate</h2>
      <div class="grid-3">
        <div class="campo"><label>PV Atual</label><input name="hp_atual" type="number" value="${c.hp_atual ?? 10}"></div>
        <div class="campo"><label>PV Máximo</label><input name="hp_max" type="number" min="0" value="${c.hp_max ?? 10}"></div>
        <div class="campo"><label>PV Temporários</label><input name="hp_temp" type="number" min="0" value="${c.hp_temp ?? 0}"></div>
        <div class="campo"><label>CA</label><input name="ca" type="number" value="${c.ca ?? 10}"></div>
        <div class="campo"><label>Iniciativa (bônus)</label><input name="iniciativa_bonus" type="number" value="${c.iniciativa_bonus ?? 0}"></div>
        <div class="campo"><label>Deslocamento (m)</label><input name="deslocamento" type="number" value="${c.deslocamento ?? 9}"></div>
        <div class="campo"><label>Dado de Vida</label>
          <select name="dado_vida_tipo">
            ${[6,8,10,12].map(d => `<option value="${d}" ${d===(c.dado_vida_tipo||8)?'selected':''}>d${d}</option>`).join('')}
          </select>
        </div>
        <div class="campo"><label>Dados de Vida Restantes</label><input name="dado_vida_atual" type="number" min="0" value="${c.dado_vida_atual ?? 1}"></div>
        <div class="campo"><label>Exaustão (0–6)</label><input name="exaustao" type="number" min="0" max="6" value="${c.exaustao ?? 0}"></div>
      </div>

      <h2>Espaços de Magia</h2>
      <div id="slots">
        ${[1,2,3,4,5,6,7,8,9].map(n => {
          const s = slots[n] || {max:0,used:0};
          return `<div class="slot-linha">
            <span class="lvl">${n}°</span>
            <div class="campo"><label>Máximo</label><input type="number" min="0" name="slot_${n}_max" value="${s.max}"></div>
            <div class="campo"><label>Usados</label><input type="number" min="0" name="slot_${n}_used" value="${s.used}"></div>
          </div>`;
        }).join('')}
      </div>

      <h2>Roleplay</h2>
      <div class="grid-2">
        <div class="campo"><label>Traços de Personalidade</label><textarea name="tracos_pessoais">${escape(c.tracos_pessoais||'')}</textarea></div>
        <div class="campo"><label>Ideais</label><textarea name="ideais">${escape(c.ideais||'')}</textarea></div>
        <div class="campo"><label>Vínculos</label><textarea name="vinculos">${escape(c.vinculos||'')}</textarea></div>
        <div class="campo"><label>Defeitos</label><textarea name="defeitos">${escape(c.defeitos||'')}</textarea></div>
      </div>

      <h2>História e Notas</h2>
      <div class="campo" style="margin-bottom:12px"><label>História</label><textarea name="historia" style="min-height:90px">${escape(c.historia||'')}</textarea></div>
      <div class="campo"><label>Notas</label><textarea name="notas" style="min-height:60px">${escape(c.notas||'')}</textarea></div>

      <div class="acoes">
        <span class="status-msg" id="status"></span>
        <button class="btn-salvar" type="submit" id="btn-salvar">💾 Salvar</button>
      </div>
    </form>
  `;

  $('#sel-char').addEventListener('change', e => {
    charAtivo = chars.find(x => x.id === e.target.value);
    render();
  });
  $('#btn-novo').addEventListener('click', async () => {
    const nome = prompt('Nome do novo personagem:');
    if (nome) await criarPersonagem(nome);
  });
  $('#btn-deletar').addEventListener('click', () => deletarPersonagem(charAtivo.id));

  // Atualiza modificadores ao vivo
  document.querySelectorAll('[data-attr]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.dataset.attr;
      document.querySelector(`[data-mod="${k}"]`).textContent = fmtMod(mod(inp.value));
    });
  });

  $('#ficha-form').addEventListener('submit', salvar);
}

async function salvar(e) {
  e.preventDefault();
  const btn = $('#btn-salvar');
  const status = $('#status');
  btn.disabled = true; status.className = 'status-msg'; status.textContent = 'Salvando…';

  const f = e.target;
  const fd = new FormData(f);

  const atributos = {};
  for (const [k] of ATRIBUTOS) atributos[k] = +(fd.get('attr_' + k) || 10);

  const slots_magia = {};
  for (let n = 1; n <= 9; n++) {
    const max  = +(fd.get(`slot_${n}_max`)  || 0);
    const used = +(fd.get(`slot_${n}_used`) || 0);
    if (max > 0 || used > 0) slots_magia[n] = { max, used };
  }

  const payload = {
    nome: fd.get('nome'),
    nivel: +fd.get('nivel') || 1,
    raca: fd.get('raca') || null,
    classe: fd.get('classe') || null,
    subclasse: fd.get('subclasse') || null,
    origem: fd.get('origem') || null,
    alinhamento: fd.get('alinhamento') || null,
    atributos,
    hp_atual: +fd.get('hp_atual'),
    hp_max: +fd.get('hp_max'),
    hp_temp: +fd.get('hp_temp'),
    ca: +fd.get('ca'),
    iniciativa_bonus: +fd.get('iniciativa_bonus'),
    deslocamento: +fd.get('deslocamento'),
    dado_vida_tipo: +fd.get('dado_vida_tipo'),
    dado_vida_atual: +fd.get('dado_vida_atual'),
    exaustao: +fd.get('exaustao'),
    slots_magia,
    tracos_pessoais: fd.get('tracos_pessoais') || null,
    ideais: fd.get('ideais') || null,
    vinculos: fd.get('vinculos') || null,
    defeitos: fd.get('defeitos') || null,
    historia: fd.get('historia') || null,
    notas: fd.get('notas') || null,
  };

  const { data, error } = await window.sb
    .from('characters')
    .update(payload)
    .eq('id', charAtivo.id)
    .select('*').single();

  if (error) {
    status.className = 'status-msg erro';
    status.textContent = 'Erro: ' + error.message;
  } else {
    charAtivo = data;
    chars = chars.map(c => c.id === data.id ? data : c);
    status.className = 'status-msg ok';
    status.textContent = '✓ Salvo';
    setTimeout(() => status.textContent = '', 2500);
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
