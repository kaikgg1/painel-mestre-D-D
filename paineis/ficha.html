    </div>`;
  } else {
    const problemas = [];
    if (!temCampanha) problemas.push('vincule a uma <strong>Campanha</strong> (aba Identidade)');
    if (!ehAtivo)     problemas.push('marque como <strong>★ Ativo</strong> (botão no topo)');
    aviso = `<div class="aviso-visibilidade">
      <span class="icone" aria-hidden="true">⚠</span>
      <span>Esta ficha <strong>não aparece pro Mestre</strong>. Para mostrar: ${problemas.join(' e ')}.</span>
    </div>`;
  }

  $('#conteudo').innerHTML = `
    ${aviso}
    <div class="char-bar">
      <span class="pj-label">Personagem</span>
      <select id="sel-char" aria-label="Selecionar personagem">
        ${chars.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${escape(x.nome)}${x.classe ? ' — ' + escape(x.classe) : ''}${x.nivel ? ' N' + x.nivel : ''}${x.is_active?' ★':''}</option>`).join('')}
      </select>
      <div class="char-bar-acoes">
        <button class="btn-lock-toggle no-lock" type="button" id="btn-lock-toggle" aria-pressed="false" aria-label="Alternar modo edição">
          <span id="lock-toggle-label">🔒 Editar</span>
        </button>
        <button class="estrela-ativo ${c.is_active?'ativo':''} no-lock" id="btn-ativo" type="button" aria-pressed="${!!c.is_active}" title="Marcar como personagem ativo (visível ao Mestre)">
          <span aria-hidden="true">${c.is_active?'★':'☆'}</span>
          <span class="lbl">${c.is_active?'Ativo':'Ativar'}</span>
        </button>
        <button class="btn no-lock" type="button" id="btn-novo">+ Novo</button>
        <button class="btn danger no-lock" type="button" id="btn-deletar">Deletar</button>
      </div>
    </div>

    <div class="lock-banner" aria-live="polite">🔒 Ficha bloqueada para evitar edições acidentais — clique em <strong>Editar</strong> para desbloquear.</div>

    <div class="tabs-wrap" id="tabs-wrap">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab ${tabAtiva==='identidade'?'ativa':''}" data-tab="identidade" role="tab">Identidade</button>
        <button class="tab ${tabAtiva==='combate'?'ativa':''}" data-tab="combate" role="tab">Combate</button>
        <button class="tab ${tabAtiva==='habilidades'?'ativa':''}" data-tab="habilidades" role="tab">Habilidades</button>
        ${classeUsaMagia(c) ? `<button class="tab ${tabAtiva==='magias'?'ativa':''}" data-tab="magias" role="tab">Magias</button>` : ''}
        <button class="tab ${tabAtiva==='equipamento'?'ativa':''}" data-tab="equipamento" role="tab">Equipamento</button>
        <button class="tab ${tabAtiva==='aliados'?'ativa':''}" data-tab="aliados" role="tab">Aliados</button>
        <button class="tab ${tabAtiva==='roleplay'?'ativa':''}" data-tab="roleplay" role="tab">Roleplay</button>
      </div>
    </div>

    <form class="tab-content" id="ficha-form" novalidate>
      ${renderTab(c, atrs)}
      <div class="acoes">
        <span class="status-msg" id="status" aria-live="polite">💾 Auto-save ativo · suas alterações salvam sozinhas</span>
        <!-- Botão "Salvar agora" removido: auto-save cuida de tudo. O submit ainda é disparado programaticamente. -->
      </div>
    </form>
  `;

  conectarListeners();
}

function renderSubclasseSelect(classe, atual) {
  const chave = chaveDeClasse(classe);
  const opcoes = SUBCLASSES_POR_CLASSE[chave] || [];
  if (!opcoes.length) {
    return `<select name="subclasse" disabled style="opacity:.5"><option>${classe ? 'Sem subclasses cadastradas' : 'Escolha uma classe'}</option></select>`;
  }
  return `<select name="subclasse" id="sel-subclasse">
    <option value="">— escolher —</option>
    ${opcoes.map(o => `<option ${o===atual?'selected':''}>${escape(o)}</option>`).join('')}
  </select>`;
}

function renderListaTags(field, label, valores) {
  const tags = (valores || []).map((v, i) =>
    `<span class="tag">${escape(v)}<span class="x" data-rmtag="${field}" data-idx="${i}" role="button" tabindex="0">✕</span></span>`).join('');
  return `<div class="campo"><label>${label}</label>
    <div class="lista-tags" id="tags-${field}">${tags || '<span style="color:var(--text-dim);font-style:italic;font-size:12px;padding:4px">Nenhum</span>'}</div>
    <div class="lista-tags-add">
      <input type="text" id="add-${field}-input" placeholder="Adicionar...">
      <button type="button" class="btn" data-addtag="${field}">+</button>
    </div></div>`;
}

function renderTab(c, atrs) {
  // Se PJ não usa magia e a tab "magias" estava ativa, joga pra identidade
  if (tabAtiva === 'magias' && !classeUsaMagia(c)) tabAtiva = 'identidade';
  switch (tabAtiva) {
    case 'identidade':  return renderIdentidade(c, atrs);
    case 'combate':     return renderCombate(c);
    case 'habilidades': return renderHabilidades(c);
    case 'magias':      return renderMagias(c);
    case 'equipamento': return renderEquipamento(c);
    case 'aliados':     return renderAliados(c);
    case 'roleplay':    return renderRoleplay(c);
  }
}

function renderIdentidade(c, atrs) {
  return `
    <h3>Identidade</h3>

      <div class="campo"><label>Nome do Personagem</label>
        <input name="nome" value="${escape(c.nome)}" required></div>
      <div class="campo"><label>Nível (1–20)</label>
        <input name="nivel" type="text" inputmode="numeric" value="${c.nivel||1}" data-validar="int" data-min="1" data-max="20">
        <span class="erro-msg">Nível inválido (1–20)</span></div>
      <div class="campo"><label>Raça</label>
        <select name="raca">${RACAS.map(r => `<option ${r===c.raca?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="campo"><label>Classe</label>
        <select name="classe" id="sel-classe">${CLASSES.map(cl => `<option ${cl===c.classe?'selected':''}>${cl}</option>`).join('')}</select></div>
      <div class="campo"><label>Subclasse</label>
        ${renderSubclasseSelect(c.classe, c.subclasse)}
        <span class="ajuda">Opções automáticas conforme classe (PHB 5e).</span></div>
      <div class="campo"><label>Origem (Background)</label>
        <input name="origem" value="${escape(c.origem||'')}"></div>
      <div class="campo"><label>Alinhamento</label>
        <select name="alinhamento">${ALINHAMENTOS.map(a => `<option ${a===c.alinhamento?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="campo"><label>Campanha (visível pro Mestre)</label>
        <select name="campanha">${CAMPANHAS.map(([k, lbl]) => `<option value="${k}" ${k===(c.campanha||'')?'selected':''}>${lbl}</option>`).join('')}</select>

          <div class="hp-aplicar-titulo">Aplicar Dano ou Cura</div>
          <div class="hp-aplicar-linha">
            <button type="button" class="hp-btn dano" data-aplicar="dano" aria-label="Aplicar dano">🩸 Dano</button>
            <input type="text" inputmode="numeric" id="hp-aplicar-input" value="" placeholder="0" aria-label="Quantidade">
            <button type="button" class="hp-btn cura" data-aplicar="cura" aria-label="Aplicar cura">✨ Cura</button>
          </div>
          <div class="hp-quick" aria-label="Atalhos rápidos">
            <button type="button" class="q-dano" data-quick="-20">-20</button>
            <button type="button" class="q-dano" data-quick="-10">-10</button>
            <button type="button" class="q-dano" data-quick="-5">-5</button>
            <button type="button" class="q-dano" data-quick="-1">-1</button>
            <button type="button" class="q-cura" data-quick="1">+1</button>
            <button type="button" class="q-cura" data-quick="5">+5</button>
            <button type="button" class="q-cura" data-quick="10">+10</button>
            <button type="button" class="q-cura" data-quick="20">+20</button>
          </div>
        </div>
      </div>

      <div class="stat-hero">
        <div class="stat-icone" aria-hidden="true">🛡️</div>
        <div class="stat-titulo">Classe de Armadura</div>
        <input name="ca" type="text" inputmode="numeric" value="${c.ca ?? 10}" data-validar="int" aria-label="CA">
      </div>

      <div class="stat-hero">
        <div class="stat-icone" aria-hidden="true">⚡</div>
        <div class="stat-titulo">Iniciativa</div>

    <div class="stats-mini">

      <div class="stat-mini">
        <span class="ic" aria-hidden="true">🎲</span>
        <label>Dado de Vida</label>
        ${(() => {
          const dv = dadoVidaDaClasse(c.classe) || c.dado_vida_tipo || 8;
          return `<div class="readonly-stat" id="dv-display" title="Definido pela classe (D&D 5e)">d${dv}</div>

              <span class="bonus-pm">±</span>

    ${classeUsaMagia(c) ? `
    <h3>Magia</h3>
    <div class="grid-3">
      <div class="campo"><label>Truques Conhecidos</label>
        <input type="text" inputmode="numeric" name="truques_conhecidos" value="${c.truques_conhecidos ?? 0}" data-validar="int" data-min="0"></div>
      <div class="campo"><label>Magias Conhecidas</label>
        <input type="text" inputmode="numeric" name="magias_conhecidas" value="${c.magias_conhecidas ?? 0}" data-validar="int" data-min="0"></div>
      <div class="campo"><label>CD de Resistência</label>
        <input type="text" inputmode="numeric" name="cd_resistencia" value="${c.cd_resistencia ?? 8}" data-validar="int" data-min="0">
        <span class="ajuda">8 + prof + mod do atributo de conjuração</span></div>
      <div class="campo"><label>Bônus de Ataque de Magia</label>
        <input type="text" inputmode="numeric" name="bonus_atq_magia" value="${c.bonus_atq_magia ?? 0}" data-validar="int"></div>

    <h3>Espaços de Magia</h3>

function renderSlotsMagia(c, slots) {
  const tipo = (window.SlotsPHB && c.classe) ? window.SlotsPHB.tipoDaClasse(c.classe, c.subclasse) : null;
  const slotsClasse = (window.SlotsPHB && c.classe) ? window.SlotsPHB.porClasse(c.classe, c.nivel || 1, c.subclasse) : null;

  // Classe sem slots (Bárbaro, Guerreiro, Ladino, Monge sem subclasse mágica)
  if (!slotsClasse) {
    return `<div class="slots-vazio">⚔️ ${c.classe || 'Classe'} não recebe espaços de magia pelas regras padrão.<br><span style="font-size:11px">(Subclasses Cavaleiro Místico e Trapaceiro Arcano podem ter — registre em "Características Adicionais".)</span></div>`;
  }

  const cabecalho = tipo === 'pact'
    ? `<div class="slots-info"><span class="ic">🔮</span><div>Bruxo usa <strong>Magia do Pacto</strong>: todos os slots são do mesmo nível e recuperam em <strong>descanso curto</strong>.</div></div>`
    : tipo === 'third'
    ? `<div class="slots-info"><span class="ic">📜</span><div>1/3 conjurador (<strong>${escape(c.subclasse)}</strong>) · Nível <strong>${c.nivel||1}</strong>. Slots calculados pela subclasse, recuperam em <strong>descanso longo</strong>.</div></div>`
    : `<div class="slots-info"><span class="ic">📜</span><div>Espaços calculados automaticamente: <strong>${c.classe}</strong> · Nível <strong>${c.nivel||1}</strong>. Recuperam em <strong>descanso longo</strong>.</div></div>`;

  const niveisComSlots = Object.entries(slotsClasse).filter(([nv, max]) => max > 0);
  if (!niveisComSlots.length) {
    return cabecalho + `<div class="slots-vazio">No nível atual, esta classe ainda não tem espaços de magia.</div>`;
  }

  return cabecalho + `<div class="slots-grid">
    ${[1,2,3,4,5,6,7,8,9].map(nv => {
      const max = slotsClasse[nv] || 0;
      const s = slots[nv] || { atual: 0, max: 0 };
      const usados = Math.min(s.atual || 0, max);
      const disponivel = max - usados;
      if (max === 0) {
        return `<div class="slot-card indisponivel">
          <div class="slot-titulo">Nível ${nv}</div>
          <div class="slot-max">—</div>
          <div class="slot-status">indisponível</div>
        </div>`;
      }
      const pips = Array.from({length: max}).map((_, i) =>
        `<button type="button" class="slot-pip ${i < usados ? 'gasto' : ''}" data-slot-nv="${nv}" data-slot-idx="${i}" aria-label="Slot ${nv}° nível, espaço ${i+1}, ${i < usados ? 'gasto' : 'disponível'}"></button>`
      ).join('');
      return `<div class="slot-card">
        <div class="slot-titulo">Nível ${nv}</div>
        <div class="slot-max" title="Máximo da classe">${max}</div>
        <div class="slot-pips" data-slot-nv="${nv}">${pips}</div>
        <div class="slot-status"><strong>${disponivel}</strong> / ${max} disponíveis</div>
        <input type="hidden" name="slot_${nv}_max" value="${max}">
        <input type="hidden" name="slot_${nv}_atual" value="${usados}">
      </div>`;
    }).join('')}
  </div>`;
}

/* ============================================================
   RECURSOS DE CLASSE — trackers por classe × nível
   Cada classe define recursos rastreáveis que escalam com o nível.
   Pips clicáveis salvam em charAtivo.recursos_usados (mesma tabela
   usada pelas features auto-detectadas).
   ============================================================ */
const _max1 = v => Math.max(1, v);
const RECURSOS_POR_CLASSE = {
  barbaro: (nv) => [
    { id: 'furia', nome: 'Fúria', icone: '🔥',
      max: nv >= 17 ? 6 : nv >= 12 ? 5 : nv >= 6 ? 4 : nv >= 3 ? 3 : 2,
      periodo: 'descanso longo', dica: 'Ação bônus · Dano de fúria: ' + (nv >= 16 ? '+4' : nv >= 9 ? '+3' : '+2') }
  ],
  bardo: (nv, a) => [
    { id: 'inspiracao_bardica', nome: 'Inspiração Bárdica', icone: '🎵',
      max: _max1(mod(a.car)),
      periodo: nv >= 5 ? 'descanso curto' : 'descanso longo',
      dica: 'Dado: ' + (nv >= 15 ? 'd12' : nv >= 10 ? 'd10' : nv >= 5 ? 'd8' : 'd6') + ' · Ação bônus' }
  ],
  bruxo: (nv) => {
    const r = [];
    const slotsPacto = nv >= 11 ? 3 : nv >= 2 ? 2 : 1;
    const nivelSlot = nv >= 9 ? 5 : nv >= 7 ? 4 : nv >= 5 ? 3 : nv >= 3 ? 2 : 1;
    r.push({ id: 'magias_pacto', nome: 'Magias do Pacto', icone: '🔮',
      max: slotsPacto, periodo: 'descanso curto',
      dica: `Slots de nível ${nivelSlot}` });
    if (nv >= 11) r.push({ id: 'arcano_6', nome: 'Arcano Místico 6°', icone: '◆', max: 1, periodo: 'descanso longo' });
    if (nv >= 13) r.push({ id: 'arcano_7', nome: 'Arcano Místico 7°', icone: '◆', max: 1, periodo: 'descanso longo' });
    if (nv >= 15) r.push({ id: 'arcano_8', nome: 'Arcano Místico 8°', icone: '◆', max: 1, periodo: 'descanso longo' });
    if (nv >= 17) r.push({ id: 'arcano_9', nome: 'Arcano Místico 9°', icone: '◆', max: 1, periodo: 'descanso longo' });
    return r;
  },
  clerigo: (nv) => [
    { id: 'canalizar_divindade', nome: 'Canalizar Divindade', icone: '✨',
      max: nv >= 18 ? 3 : nv >= 6 ? 2 : 1, periodo: 'descanso curto',
      dica: 'Expulsar Mortos-Vivos + opção do domínio' }
  ],
  druida: (nv) => [
    { id: 'forma_selvagem', nome: 'Forma Selvagem', icone: '🐺',
      max: nv >= 20 ? 99 : 2, periodo: 'descanso curto',
      dica: nv >= 20 ? 'Ilimitada (Arquidruida)' : `CR ${nv >= 8 ? '1' : nv >= 4 ? '1/2' : '1/4'}` }
  ],
  feiticeiro: (nv) => [
    { id: 'pontos_feiticaria', nome: 'Pontos de Feitiçaria', icone: '✨',
      max: nv, periodo: 'descanso longo',
      dica: 'Converte ⇄ slots · Custos: slot 1°=2pt, 2°=3, 3°=5, 4°=6, 5°=7' }
  ],
  guerreiro: (nv) => {
    const r = [
      { id: 'retomar_folego', nome: 'Retomar o Fôlego', icone: '💨', max: 1, periodo: 'descanso curto',
        dica: `Cura 1d10 + ${nv} PV (ação bônus)` },
      { id: 'surto_acao', nome: 'Surto de Ação', icone: '⚡',
        max: nv >= 17 ? 2 : 1, periodo: 'descanso curto', dica: 'Ação adicional no turno' },
    ];
    if (nv >= 9) r.push({ id: 'indomavel', nome: 'Indomável', icone: '🛡',
      max: nv >= 17 ? 3 : nv >= 13 ? 2 : 1, periodo: 'descanso longo',
      dica: 'Re-rola teste de resistência falhado' });
    return r;
  },
  ladino: (nv) => [
    { id: 'golpe_sorte', nome: 'Golpe de Sorte', icone: '🍀', max: 1, periodo: 'descanso curto',
      dica: 'Falha → sucesso (ou sucesso inimigo → falha)', visivel: nv >= 20 }
  ].filter(r => r.visivel !== false),
  mago: (nv) => [
    { id: 'recuperacao_arcana', nome: 'Recuperação Arcana', icone: '🔮',
      max: 1, periodo: 'descanso longo',
      dica: `Recupera slots: soma ≤ ${Math.ceil(nv/2)}, nenhum acima do 5°` }
  ],
  monge: (nv) => {
    if (nv < 2) return [];
    return [
      { id: 'chi', nome: 'Pontos de Chi', icone: '☯', max: nv, periodo: 'descanso curto',
        dica: 'Rajada de Golpes (1) · Defesa Paciente (1) · Passo do Vento (1) · Golpe Atordoante (1)' }
    ];
  },
  paladino: (nv, a) => {
    const r = [
      { id: 'cura_maos', nome: 'Cura pelas Mãos', icone: '💚', max: nv * 5, periodo: 'descanso longo',
        dica: 'Pool de PV · Distribua como quiser entre toques', step: 1 },
      { id: 'sentido_divino', nome: 'Sentido Divino', icone: '👁',
        max: 1 + Math.max(0, mod(a.car)), periodo: 'descanso longo',
        dica: 'Detecta celestiais/mortos-vivos/corruptos em 18m' },
    ];
    if (nv >= 14) r.push({ id: 'toque_purificador', nome: 'Toque Purificador', icone: '✨',
      max: _max1(mod(a.car)), periodo: 'descanso longo', dica: 'Termina 1 efeito mágico' });
    return r;
  },
  patrulheiro: (nv) => {
    // Patrulheiro PHB tem poucos slots rastreáveis fora dos slots de magia
    return [];
  },
};

function recursosPara(c, atrs) {
  if (!c) return [];
  const chave = chaveDeClasse(c.classe);
  const fn = RECURSOS_POR_CLASSE[chave];
  if (!fn) return [];
  const nv = +c.nivel || 1;
  try { return fn(nv, atrs || c.atributos || {}); }
  catch { return []; }
}

function renderRecursosClasse(c) {
  const wrap = document.getElementById('recursos-classe-wrap');
  if (!wrap) return;
  const recursos = recursosPara(c, c.atributos);
  if (!recursos.length) { wrap.innerHTML = ''; return; }

  const usados = c.recursos_usados || {};
  const ehFeit = chaveDeClasse(c.classe) === 'feiticeiro';

  const cards = recursos.map(r => {
    const usado = Math.min(r.max, usados[r.id] || 0);
    const livre = r.max - usado;
    const passo = r.step || 1;
    // Pool grande (>10) usa input numérico; senão pips visuais
    const usaPool = r.max > 12;
    const corpoTracker = usaPool
      ? `<div class="rc-pool">
           <button type="button" class="rc-pool-btn no-lock" data-act="menos" data-rc="${escape(r.id)}" data-rc-step="${passo}" aria-label="Usar 1">−</button>
           <button type="button" class="rc-pool-btn rc-pool-btn-big no-lock" data-act="menos" data-rc="${escape(r.id)}" data-rc-step="5" aria-label="Usar 5">−5</button>
           <div class="rc-pool-display"><strong class="rc-pool-livre">${livre}</strong><span class="rc-pool-sep">/</span><span class="rc-pool-max">${r.max}</span></div>
           <button type="button" class="rc-pool-btn rc-pool-btn-big no-lock" data-act="mais" data-rc="${escape(r.id)}" data-rc-step="5" aria-label="Recuperar 5">+5</button>
           <button type="button" class="rc-pool-btn no-lock" data-act="mais" data-rc="${escape(r.id)}" data-rc-step="${passo}" aria-label="Recuperar 1">+</button>
         </div>`
      : `<div class="rc-pips" data-rc="${escape(r.id)}" data-rc-max="${r.max}">
           ${Array.from({length: r.max}, (_, i) =>
             `<span class="rc-pip ${i < usado ? 'gasto' : ''}" data-rc-idx="${i}" role="button" tabindex="0" aria-label="Uso ${i+1} de ${r.max}"></span>`
           ).join('')}
           <span class="rc-frac"><strong>${livre}</strong>/${r.max}</span>
         </div>`;

    return `
      <div class="rc-card" data-rc-card="${escape(r.id)}">
        <div class="rc-head">
          <span class="rc-icone" aria-hidden="true">${r.icone || '●'}</span>
          <div class="rc-titulo-wrap">
            <div class="rc-nome">${escape(r.nome)}</div>
            <div class="rc-periodo">↻ ${escape(r.periodo || '')}</div>
          </div>
          <button type="button" class="rc-reset no-lock" data-rc-reset="${escape(r.id)}" title="Recuperar tudo" aria-label="Recuperar todos os usos">⟲</button>
        </div>
        ${corpoTracker}
        ${r.dica ? `<div class="rc-dica">${escape(r.dica)}</div>` : ''}
      </div>`;
  }).join('');

  const cabec = `
    <div class="rc-cabecalho">
      <h3 style="margin:0">Recursos de ${escape(c.classe || 'Classe')} <span class="rc-nv">N${+c.nivel || 1}</span></h3>
      ${ehFeit ? `<button type="button" class="btn no-lock" id="btn-fei-converter" title="Converter pontos ⇄ slots">⇄ Converter</button>` : ''}
    </div>`;

  wrap.innerHTML = `
    <div class="rc-painel">
      ${cabec}
      <div class="rc-grid">${cards}</div>
    </div>`;

  ligarListenersRecursos();
  if (ehFeit) ligarConversorFeiticaria();
}

// Event delegation: 1 listener no painel inteiro, em vez de N listeners individuais.
// Evita memory leak quando renderRecursosClasse é chamada muitas vezes (realtime updates).
function ligarListenersRecursos() {
  const painel = document.querySelector('.rc-painel');
  if (!painel) return;
  if (painel.dataset.rcWired === '1') return;  // idempotente
  painel.dataset.rcWired = '1';

  painel.addEventListener('click', e => {
    const pip = e.target.closest('.rc-pip');
    if (pip) { alternarPipRecurso(pip); return; }

    const poolBtn = e.target.closest('.rc-pool-btn');
    if (poolBtn) {
      const id = poolBtn.dataset.rc;
      const passo = +poolBtn.dataset.rcStep || 1;
      const delta = poolBtn.dataset.act === 'menos' ? +passo : -passo;
      ajustarRecurso(id, delta);
      return;
    }

    const reset = e.target.closest('.rc-reset');
    if (reset) {
      const id = reset.dataset.rcReset;
      if (!charAtivo) return;
      const rec = charAtivo.recursos_usados || {};
      gravarUsadoRecurso(rec, id, 0);
      charAtivo.recursos_usados = rec;
      renderRecursosClasse(charAtivo);
      salvarRecursosSeguro();
      return;
    }
  });

  // Acessibilidade: Enter/Espaço nos pips
  painel.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const pip = e.target.closest('.rc-pip');
    if (!pip) return;
    e.preventDefault();
    alternarPipRecurso(pip);
  });
}

// Lock por recurso — bloqueia cliques múltiplos durante o salvamento
// (evita race entre alternarPipRecurso → realtime → ajustarRecurso)
const _lockRecurso = new Set();

// Lê o valor atual de "usado" de um recurso lidando com 2 formatos
// (number bruto OU objeto {atual, max} pras features personalizadas)
function lerUsadoRecurso(rec, id) {
  const v = rec[id];
  if (typeof v === 'number') return v;
  if (v && typeof v.atual === 'number') return v.atual;
  return 0;
}
function gravarUsadoRecurso(rec, id, novoUsado) {
  // Preserva o formato existente (não migra dado entre execuções)
  const v = rec[id];
  if (v && typeof v === 'object' && 'atual' in v) {
    rec[id] = { ...v, atual: novoUsado };
  } else {
    rec[id] = novoUsado;
  }
}

async function alternarPipRecurso(pip) {
  const grupo = pip.closest('.rc-pips');
  const id = grupo.dataset.rc;
  if (_lockRecurso.has(id)) return;  // já tem um save em voo
  const max = +grupo.dataset.rcMax;
  const idx = +pip.dataset.rcIdx;
  const pips = [...grupo.querySelectorAll('.rc-pip')];
  const eraGasto = pip.classList.contains('gasto');
  const novoGastos = Math.max(0, Math.min(max, eraGasto ? idx : idx + 1));
  if (!charAtivo) return;

  // Snapshot pra rollback se o save falhar
  const rec = charAtivo.recursos_usados || {};
  const antes = lerUsadoRecurso(rec, id);

  // Otimismo: atualiza UI imediato
  gravarUsadoRecurso(rec, id, novoGastos);
  charAtivo.recursos_usados = rec;
  pips.forEach((p, i) => p.classList.toggle('gasto', i < novoGastos));
  if (window.FX) FX.slot(pip);
  const frac = grupo.querySelector('.rc-frac');
  if (frac) frac.innerHTML = `<strong>${max - novoGastos}</strong>/${max}`;

  _lockRecurso.add(id);
  try {
    await salvarRecursos();
  } catch (e) {
    // Rollback
    gravarUsadoRecurso(rec, id, antes);
    charAtivo.recursos_usados = rec;
    pips.forEach((p, i) => p.classList.toggle('gasto', i < antes));
    if (frac) frac.innerHTML = `<strong>${max - antes}</strong>/${max}`;
    if (typeof toast === 'function') toast('⚠ Falha ao salvar — tente novamente');
    console.warn('[recursos] rollback:', e);
  } finally {
    _lockRecurso.delete(id);
  }
}

async function ajustarRecurso(id, delta) {
  if (!charAtivo) return;
  if (_lockRecurso.has(id)) return;
  const recs = recursosPara(charAtivo, charAtivo.atributos);
  const def = recs.find(r => r.id === id);
  if (!def) return;

  const rec = charAtivo.recursos_usados || {};
  const antes = lerUsadoRecurso(rec, id);
  const novo = Math.max(0, Math.min(def.max, antes + delta));
  if (novo === antes) return;  // sem mudança

  gravarUsadoRecurso(rec, id, novo);
  charAtivo.recursos_usados = rec;

  // Atualiza display do card desse recurso (sem re-render geral pra evitar flicker)
  const card = document.querySelector(`[data-rc-card="${CSS.escape(id)}"]`);
  if (card) {
    const livre = def.max - novo;
    const lEl = card.querySelector('.rc-pool-livre');
    if (lEl) lEl.textContent = livre;
    const frac = card.querySelector('.rc-frac');
    if (frac) frac.innerHTML = `<strong>${livre}</strong>/${def.max}`;
    const grupo = card.querySelector('.rc-pips');
    if (grupo) {
      grupo.querySelectorAll('.rc-pip').forEach((p, i) => p.classList.toggle('gasto', i < novo));
    }
  }

  _lockRecurso.add(id);
  try {
    await salvarRecursos();
  } catch (e) {
    gravarUsadoRecurso(rec, id, antes);
    charAtivo.recursos_usados = rec;
    if (card) {
      const livre = def.max - antes;
      const lEl = card.querySelector('.rc-pool-livre');
      if (lEl) lEl.textContent = livre;
      const frac = card.querySelector('.rc-frac');
      if (frac) frac.innerHTML = `<strong>${livre}</strong>/${def.max}`;
      const grupo = card.querySelector('.rc-pips');
      if (grupo) {
        grupo.querySelectorAll('.rc-pip').forEach((p, i) => p.classList.toggle('gasto', i < antes));
      }
    }
    if (typeof toast === 'function') toast('⚠ Falha ao salvar — tente novamente');
    console.warn('[recursos] rollback:', e);
  } finally {
    _lockRecurso.delete(id);
  }
}

/* ===== FEITICEIRO: Conversor Pontos ⇄ Slots ===== */
function ligarConversorFeiticaria() {
  const btn = document.getElementById('btn-fei-converter');
  if (!btn) return;
  btn.addEventListener('click', abrirModalConversorFeit);
}

// Custos PHB para criar slot via pontos de feitiçaria
const CUSTO_SLOT_DE_PONTOS = { 1: 2, 2: 3, 3: 5, 4: 6, 5: 7 };

function abrirModalConversorFeit() {
  if (!charAtivo) return;
  const nv = +charAtivo.nivel || 1;
  const recs = recursosPara(charAtivo, charAtivo.atributos);
  const ptDef = recs.find(r => r.id === 'pontos_feiticaria');
  if (!ptDef) return;
  const ptUsados = (charAtivo.recursos_usados || {}).pontos_feiticaria || 0;
  const ptLivres = ptDef.max - ptUsados;

  // Quais slots o feiticeiro pode criar? (PHB: até 5° nível)
  const slotsMagia = charAtivo.slots_magia || {};
  let opcoes = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const custo = CUSTO_SLOT_DE_PONTOS[lvl];
    const podePagar = ptLivres >= custo;
    opcoes += `
      <button type="button" class="fei-opt ${podePagar ? '' : 'desabilitada'}"
              data-fei-criar="${lvl}" ${podePagar ? '' : 'disabled'}>
        <span class="fei-opt-lvl">Slot ${lvl}°</span>
        <span class="fei-opt-custo">${custo} pt</span>
      </button>`;
  }

  // Quais slots pode converter EM pontos? (PHB: 1 slot de nível X = X pontos)
  let conversaoVolta = '';
  for (let lvl = 1; lvl <= 9; lvl++) {
    const s = slotsMagia[lvl];
    if (!s) continue;
    const livres = (s.max || 0) - (s.used || 0);
    if (livres <= 0) continue;
    conversaoVolta += `
      <button type="button" class="fei-opt" data-fei-quebrar="${lvl}">
        <span class="fei-opt-lvl">Slot ${lvl}°</span>
        <span class="fei-opt-custo">→ ${lvl} pt</span>
      </button>`;
  }
  if (!conversaoVolta) conversaoVolta = '<div class="fei-vazio">Nenhum slot disponível para converter.</div>';

  const overlay = document.createElement('div');
  overlay.className = 'fei-overlay';
  overlay.innerHTML = `
    <div class="fei-modal" role="dialog" aria-modal="true" aria-labelledby="fei-titulo">
      <button class="fei-close" type="button" aria-label="Fechar">✕</button>
      <div class="fei-titulo" id="fei-titulo">⇄ Fonte de Magia</div>
      <div class="fei-status">Pontos de Feitiçaria: <strong>${ptLivres}</strong> / ${ptDef.max}</div>
      <div class="fei-sec">
        <div class="fei-sec-titulo">Criar slot (gasta pontos)</div>
        <div class="fei-grid">${opcoes}</div>
      </div>
      <div class="fei-sec">
        <div class="fei-sec-titulo">Quebrar slot em pontos</div>
        <div class="fei-grid">${conversaoVolta}</div>
      </div>
      <div class="fei-rodape">PHB: 1 slot 1°=2 · 2°=3 · 3°=5 · 4°=6 · 5°=7. Sem conversão acima do 5° nível.</div>
    </div>`;
  document.body.appendChild(overlay);

  const fechar = () => overlay.remove();
  overlay.querySelector('.fei-close').onclick = fechar;
  overlay.addEventListener('click', e => { if (e.target === overlay) fechar(); });

  // Criar slot
  overlay.querySelectorAll('[data-fei-criar]').forEach(b => {
    b.onclick = () => {
      const lvl = +b.dataset.feiCriar;
      const custo = CUSTO_SLOT_DE_PONTOS[lvl];
      const rec = charAtivo.recursos_usados || {};
      const usados = rec.pontos_feiticaria || 0;
      if (ptDef.max - usados < custo) return;
      // Garante que existe entry de slot desse nível
      const sm = charAtivo.slots_magia || {};
      if (!sm[lvl]) sm[lvl] = { max: 0, used: 0 };
      sm[lvl].max = Math.max(sm[lvl].max, 1);
      sm[lvl].used = Math.max(0, (sm[lvl].used || 0) - 1);
      // Se used já era 0, aumenta max (slot extra). Mais simples: max += 1, used não muda.
      // Padrão "criou um slot novo disponível": se used > 0, decrementa; senão max += 1
      charAtivo.slots_magia = sm;
      rec.pontos_feiticaria = usados + custo;
      charAtivo.recursos_usados = rec;
      toast(`✓ Slot de nível ${lvl} criado (-${custo} pt)`);
      salvarRecursosSeguro();
      // Salva slots_magia direto
      window.sb.from('characters').update({ slots_magia: charAtivo.slots_magia }).eq('id', charAtivo.id);
      fechar();
      renderRecursosClasse(charAtivo);
      // Re-render aba Combate se aberta (slots aparecem lá)
      const tabAtual = document.querySelector('.tab.ativa')?.dataset.tab;
      if (tabAtual === 'combate') render();
    };
  });

  // Quebrar slot
  overlay.querySelectorAll('[data-fei-quebrar]').forEach(b => {
    b.onclick = () => {
      const lvl = +b.dataset.feiQuebrar;
      const sm = charAtivo.slots_magia || {};
      if (!sm[lvl] || (sm[lvl].max - (sm[lvl].used || 0)) <= 0) return;
      sm[lvl].used = (sm[lvl].used || 0) + 1;
      const rec = charAtivo.recursos_usados || {};
      const usados = rec.pontos_feiticaria || 0;
      rec.pontos_feiticaria = Math.max(0, usados - lvl);
      charAtivo.slots_magia = sm;
      charAtivo.recursos_usados = rec;
      toast(`✓ Slot ${lvl}° → +${lvl} pt`);
      salvarRecursosSeguro();
      window.sb.from('characters').update({ slots_magia: charAtivo.slots_magia }).eq('id', charAtivo.id);
      fechar();
      renderRecursosClasse(charAtivo);
      const tabAtual = document.querySelector('.tab.ativa')?.dataset.tab;
      if (tabAtual === 'combate') render();
    };
  });
}

function slugFeature(nome) {
  return (nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 80);
}

// Detecta se uma feature tem usos limitados por descanso/dia analisando
// nome + descrição. Retorna {max, periodo, tipo} ou null para passivas.
// max=0 quando a fórmula é variável (ex.: "1 + mod CAR") — usuário ajusta.
function detectarUsosLimitados(h) {
  const txt = (h.nome || '') + ' ' + (h.desc || '');

  // 1) (N/descanso|dia|longo|curto) — padrão explícito no nome
  let m = txt.match(/\(\s*(\d+)\s*\/\s*(descanso(?:\s+(?:curto|longo))?|dia|longo|curto|long\.?|curt\.?)\s*\)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 2) (N uso/usos) no nome
  m = txt.match(/\(\s*(\d+)\s+usos?\s*\)/i);
  if (m) return { max: +m[1], periodo: 'descanso' };

  // 3) "Nx/descanso" ou "Nx/dia" (sem parênteses)
  m = txt.match(/(\d+)\s*x\s*\/\s*(descanso(?:\s+(?:curto|longo))?|dia|longo|curto)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 4) "N vezes por (descanso|dia)" ou "N vezes entre descansos"
  m = txt.match(/(\d+)\s+vezes?\s+(?:por|a\s+cada|entre)\s+(descanso[s]?(?:\s+(?:curto|longo))?|dia)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 5) "uma vez por (descanso|dia|turno)"
  if (/uma\s+vez\s+(?:por|a\s+cada|entre)\s+(descanso|dia|turno)/i.test(txt)) {
    return { max: 1, periodo: RegExp.$1.toLowerCase() };
  }

  // 6) "1x cada/descanso" / "1x/dia"
  m = txt.match(/(\d+)\s*x\s+cada\s+(descanso|dia)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 7) Fórmula "Usos = X" ou "X usos = ..." (ex.: Sentido Divino do Paladino)
  if (/usos?\s*=/i.test(txt) || /usos?\s*por\s+descanso/i.test(txt)) {
    return { max: 0, periodo: 'descanso' };  // editável manualmente
  }

  // 8) "/descanso longo" ou "/descanso curto" no fim de uma cláusula com número
  m = txt.match(/(\d+)\s*\/\s*(descanso\s+(?:curto|longo)|dia|longo|curto)/i);
  if (m) return { max: +m[1], periodo: m[2].toLowerCase() };

  // 9) "recupera em descanso" + número de cargas/pontos no início (ex.: pontos de feitiçaria)
  if (/recupera\s+em\s+descanso\s+(curto|longo)/i.test(txt) &&
      /(\d+)\s+(?:pontos?|cargas?|usos?)/i.test(txt)) {
    return { max: 0, periodo: 'descanso ' + RegExp.$1.toLowerCase() };  // editável
  }

  return null;  // passiva — sem tracker
}

async function popularHabilidades(classe, nivel, subclasse) {
  const wrap = document.getElementById('hab-wrap');
  if (!wrap) return;
  if (!classe) {
    wrap.innerHTML = `<div class="item-vazio">Sem classe definida.</div>`;
    return;
  }
  const db = await carregarHabilidadesClasses();
  if (!db) {
    wrap.innerHTML = `
      <div class="item-vazio" style="text-align:center;padding:20px">
        ⚠ Não foi possível carregar as habilidades.
        <button type="button" class="btn no-lock" style="display:block;margin:12px auto 0" onclick="popularHabilidades('${escape(classe)}', ${+nivel||1}, '${escape(subclasse||'')}')">Tentar de novo</button>
      </div>`;
    return;
  }
  const todas = db[chaveDeClasse(classe)] || [];
  // Filtra: nivel <= atual AND (sem subclasse OR subclasse === subclasse do PJ)
  const habs = todas.filter(h => h.nivel <= (nivel || 1) && (!h.subclasse || h.subclasse === subclasse));
  if (!habs.length) {
    wrap.innerHTML = `<div class="item-vazio">Nenhuma habilidade encontrada para ${escape(classe)}.</div>`;
    return;
  }
  // Agrupa por nível
  const porNivel = {};
  for (const h of habs) (porNivel[h.nivel] = porNivel[h.nivel] || []).push(h);
  const recursos = charAtivo.recursos_usados || {};

  wrap.innerHTML = Object.entries(porNivel).sort(([a],[b]) => +a - +b).map(([nv, lista]) => `
    <div class="habilidade-card">
      <h4>Nível ${nv}</h4>
      ${lista.map(h => {
        const slug = slugFeature(h.nome);
        const detectado = detectarUsosLimitados(h);
        const r = recursos[slug] || {};
        // max efetivo: o que está salvo > o detectado pelo regex
        const maxSalvo = +r.max || 0;
        const maxDetectado = detectado ? +detectado.max : 0;
        const max = maxSalvo > 0 ? maxSalvo : maxDetectado;
        const usos = Math.min(+r.atual || 0, max);
        const disp = Math.max(0, max - usos);

        // SEM tracker: feature passiva (nenhum padrão de uso detectado)
        if (!detectado && maxSalvo === 0) {
          return `<div class="hab-feature passiva" data-hab-slug="${slug}">
            ${h.subclasse ? `<span class="hab-sub-tag">${escape(h.subclasse)}</span>` : ''}
            <div class="hab-feature-titulo">
              <strong>${escape(h.nome)}.</strong>
              <span class="hab-desc">${escape(h.desc || '—')}</span>
            </div>
          </div>`;
        }

        // COM tracker: feature usável (limite detectado ou já configurado)
        const periodo = detectado?.periodo || 'descanso';
        const pips = max > 0 ? Array.from({length: max}).map((_, i) =>
          `<button type="button" class="hab-pip ${i < usos ? 'gasto' : ''}" data-hab-slug="${slug}" data-hab-idx="${i}" aria-label="Uso ${i+1} ${i < usos ? 'gasto' : 'disponível'}"></button>`
        ).join('') : '';
        return `<div class="hab-feature ativa" data-hab-slug="${slug}">
          ${h.subclasse ? `<span class="hab-sub-tag">${escape(h.subclasse)}</span>` : ''}
          <div class="hab-feature-head">
            <div class="hab-feature-titulo">
              <strong>${escape(h.nome)}.</strong>
              <span class="hab-desc">${escape(h.desc || '—')}</span>
            </div>
            <div class="hab-tracker" title="Recupera em ${escape(periodo)}">
              <label class="hab-tracker-lbl">Usos:</label>
              ${max > 0 ? `
                <span class="hab-pips">${pips}</span>
                <span class="hab-disp"><strong>${disp}</strong>/${max}</span>
              ` : ''}
              <input type="text" inputmode="numeric" class="hab-tracker-max" value="${max}" data-hab-max="${slug}" aria-label="Máximo de usos" title="Ajuste o máximo (a regra padrão é ${detectado?.max || '?'})">
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  // Listeners dos pips (toggle gasto/disponível) e do max
  wrap.querySelectorAll('.hab-pip').forEach(pip => {
    pip.addEventListener('click', () => {
      const slug = pip.dataset.habSlug;
      const idx  = +pip.dataset.habIdx;
      const rec  = charAtivo.recursos_usados || {};
      const cur  = rec[slug] || { atual: 0, max: 0 };
      // Click no pip "gasto" → recupera 1; click no pip "disponível" → gasta 1
      cur.atual = pip.classList.contains('gasto') ? idx : idx + 1;
      cur.atual = Math.max(0, Math.min(cur.max, cur.atual));
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursosSeguro();
      popularHabilidades(classe, nivel, subclasse);  // re-render
    });
  });

  wrap.querySelectorAll('.hab-tracker-max').forEach(inp => {
    inp.addEventListener('change', () => {
      const slug = inp.dataset.habMax;
      const val  = Math.max(0, Math.min(20, parseInt(inp.value, 10) || 0));
      const rec  = charAtivo.recursos_usados || {};
      const cur  = rec[slug] || { atual: 0, max: 0 };
      cur.max = val;
      cur.atual = Math.min(cur.atual, val);
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursosSeguro();
      popularHabilidades(classe, nivel, subclasse);
    });
  });
}

// Salva recursos_usados via UPDATE direto.
// Lança em caso de erro — use salvarRecursosSeguro() pra fire-and-forget.
async function salvarRecursos() {
  if (!charAtivo?.id) return;
  _ultimoSaveLocal = Date.now();
  const { error } = await window.sb.from('characters')
    .update({ recursos_usados: charAtivo.recursos_usados || {} })
    .eq('id', charAtivo.id);
  if (error) {
    console.warn('[recursos] erro ao salvar:', error);
    throw error;
  }
}

// Renderiza a lista de features personalizadas (cards estruturados)
function popularFeaturesPersonalizadas() {
  const wrap = document.getElementById('hab-custom-wrap');
  if (!wrap) return;
  const lista = Array.isArray(charAtivo.features_personalizadas) ? charAtivo.features_personalizadas : [];
  if (!lista.length) {
    wrap.innerHTML = `<div class="item-vazio" style="padding:14px">Nenhuma característica personalizada ainda. Clique <strong>+ Adicionar característica</strong> acima.</div>`;
    return;
  }
  const recursos = charAtivo.recursos_usados || {};
  wrap.innerHTML = `<div class="habilidade-card">
    ${lista.map((f, idx) => {
      const slug = 'custom_' + (f.id || idx);
      const max = +f.max || 0;
      const r = recursos[slug] || { atual: 0, max: 0 };
      const maxEfetivo = max > 0 ? max : (+r.max || 0);
      const usos = Math.min(+r.atual || 0, maxEfetivo);
      const disp = Math.max(0, maxEfetivo - usos);
      const pips = maxEfetivo > 0 ? Array.from({length: maxEfetivo}).map((_, i) =>
        `<button type="button" class="hab-pip ${i < usos ? 'gasto' : ''}" data-cfeat-slug="${slug}" data-cfeat-idx="${i}" aria-label="Uso ${i+1}"></button>`
      ).join('') : '';
      return `<div class="hab-feature ${maxEfetivo > 0 ? 'ativa' : 'passiva'}" data-cfeat-idx="${idx}">
        <button type="button" class="cfeat-remove" data-cfeat-rm="${idx}" title="Remover" aria-label="Remover característica">✕</button>
        <div class="hab-feature-head">
          <div class="hab-feature-titulo">
            <input type="text" class="cfeat-nome" data-cfeat-field="nome" data-cfeat-idx="${idx}" value="${escape(f.nome || '')}" placeholder="Nome da característica" aria-label="Nome">
            <textarea class="cfeat-desc" data-cfeat-field="desc" data-cfeat-idx="${idx}" placeholder="Descrição (opcional)" aria-label="Descrição">${escape(f.desc || '')}</textarea>
          </div>
          <div class="hab-tracker">
            <label class="hab-tracker-lbl">Usos:</label>
            ${maxEfetivo > 0 ? `
              <span class="hab-pips">${pips}</span>
              <span class="hab-disp"><strong>${disp}</strong>/${maxEfetivo}</span>
            ` : ''}
            <input type="text" inputmode="numeric" class="hab-tracker-max" value="${max}" data-cfeat-max="${idx}" title="Máximo de usos (0 = passiva, sem tracker)" aria-label="Máximo de usos">
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // Pip click → toggle gasto
  wrap.querySelectorAll('.hab-pip[data-cfeat-slug]').forEach(pip => {
    pip.addEventListener('click', () => {
      const slug = pip.dataset.cfeatSlug;
      const idx  = +pip.dataset.cfeatIdx;
      const rec  = charAtivo.recursos_usados || {};
      const featList = charAtivo.features_personalizadas || [];
      const featIdx = featList.findIndex((f, i) => 'custom_' + (f.id || i) === slug);
      const max = featIdx >= 0 ? (+featList[featIdx].max || 0) : 0;
      const cur = rec[slug] || { atual: 0, max };
      cur.max = max;
      cur.atual = pip.classList.contains('gasto') ? idx : (idx + 1);
      cur.atual = Math.max(0, Math.min(max, cur.atual));
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarRecursosSeguro();
      popularFeaturesPersonalizadas();
    });
  });

  // Nome / desc / max — salva no estado
  wrap.querySelectorAll('[data-cfeat-field]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = +el.dataset.cfeatIdx;
      const field = el.dataset.cfeatField;
      if (!charAtivo.features_personalizadas[idx]) return;
      charAtivo.features_personalizadas[idx][field] = el.value;
      salvarFeaturesPersonalizadas();
    });
  });

  wrap.querySelectorAll('.hab-tracker-max[data-cfeat-max]').forEach(inp => {
    inp.addEventListener('change', () => {
      const idx = +inp.dataset.cfeatMax;
      const val = Math.max(0, Math.min(20, parseInt(inp.value, 10) || 0));
      if (!charAtivo.features_personalizadas[idx]) return;
      charAtivo.features_personalizadas[idx].max = val;
      // Ajusta recursos_usados também
      const f = charAtivo.features_personalizadas[idx];
      const slug = 'custom_' + (f.id || idx);
      const rec = charAtivo.recursos_usados || {};
      const cur = rec[slug] || { atual: 0, max: 0 };
      cur.max = val;
      cur.atual = Math.min(cur.atual, val);
      rec[slug] = cur;
      charAtivo.recursos_usados = rec;
      salvarFeaturesPersonalizadas();
      salvarRecursosSeguro();
      popularFeaturesPersonalizadas();
    });
  });

  // Remover
  wrap.querySelectorAll('[data-cfeat-rm]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.cfeatRm;
      if (!confirm('Remover esta característica?')) return;
      const f = charAtivo.features_personalizadas[idx];
      if (f) {
        const slug = 'custom_' + (f.id || idx);
        const rec = charAtivo.recursos_usados || {};
        delete rec[slug];
        charAtivo.recursos_usados = rec;
      }
      charAtivo.features_personalizadas.splice(idx, 1);
      salvarFeaturesPersonalizadas();
      salvarRecursosSeguro();
      popularFeaturesPersonalizadas();
    });
  });
}

function adicionarFeaturePersonalizada() {

// ─── Modal de Conjurar (escolha de slot) ─────────────────────────
function abrirModalConjurar(nomeMagia, nivelMin) {
  const c = charAtivo;
  const slotsClasse = (window.SlotsPHB && c.classe) ? window.SlotsPHB.porClasse(c.classe, c.nivel || 1, c.subclasse) : null;
  if (!slotsClasse) {
    alert('Sua classe/subclasse não tem espaços de magia.');
    return;
  }
  const slotsAtuais = c.slots_magia || {};
  // Lista níveis ≥ nivelMin com slots disponíveis
  const opcoes = [];
  for (let n = nivelMin; n <= 9; n++) {
    const max = slotsClasse[n] || 0;
    const usados = (slotsAtuais[n]?.atual) || 0;
    const disp = Math.max(0, max - usados);
    if (max > 0) opcoes.push({ nv: n, disp, max });
  }
  if (!opcoes.length) {
    alert(`Sem espaços de nível ${nivelMin} ou superior nesta classe.`);
    return;
  }

  // Cria overlay
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h3 id="modal-titulo">✨ Conjurar <em>${escape(nomeMagia)}</em></h3>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:14px">
        Magia de <strong>${nivelMin}° nível</strong>. Escolha em qual espaço gastar:
      </p>
      <div class="modal-slots">
        ${opcoes.map(o => `
          <button type="button" class="modal-slot-btn" ${o.disp <= 0 ? 'disabled' : ''} data-nv="${o.nv}">
            <div class="modal-slot-nv">Nível ${o.nv}</div>
            <div class="modal-slot-disp">${o.disp} / ${o.max}</div>
            <div class="modal-slot-lbl">${o.disp <= 0 ? 'esgotado' : (o.nv > nivelMin ? 'upcast' : 'disponível')}</div>
          </button>
        `).join('')}
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn" id="modal-cancelar">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const fechar = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });
  overlay.querySelector('#modal-cancelar').addEventListener('click', fechar);

  overlay.querySelectorAll('.modal-slot-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', async () => {
      const nv = +btn.dataset.nv;
      const slots = c.slots_magia || {};
      const max = slotsClasse[nv] || 0;
      const atual = (slots[nv]?.atual) || 0;
      slots[nv] = { atual: Math.min(max, atual + 1), max };
      c.slots_magia = slots;
      fechar();
      // Salva direto (não passa pelo form, evita conflito de tabs)
      try {
        _ultimoSaveLocal = Date.now();
        await window.sb.from('characters').update({ slots_magia: slots }).eq('id', c.id);
        mostrarToastConjurar(nomeMagia, nv);
      } catch (e) {
        alert('Erro ao gastar slot: ' + e.message);
      }
    });
  });

  // ESC fecha
  const onKey = (e) => { if (e.key === 'Escape') { fechar(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
}

function mostrarToastConjurar(nome, nv) {
  const t = document.createElement('div');
  t.className = 'toast-conjurar';
  t.innerHTML = `✨ <strong>${escape(nome)}</strong> conjurada · slot de nível ${nv} gasto`;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2500);
}

// Gera <optgroup> agrupando pela propriedade `categoria` (alfabético dentro do grupo).
function optgroupsPorCategoria(lista, formatarRotulo) {
  const grupos = {};
  for (const it of lista) {
    const cat = it.categoria || 'Outros';
    (grupos[cat] = grupos[cat] || []).push(it);
  }
  // Lista já vem ordenada alfabeticamente; só agrupa
  return Object.keys(grupos).sort((a,b) => a.localeCompare(b, 'pt'))
    .map(cat => `<optgroup label="${escape(cat)}">
      ${grupos[cat].map(it => `<option value='${escape(JSON.stringify(it))}'>${formatarRotulo(it)}</option>`).join('')}
    </optgroup>`).join('');
}

// Para armaduras: agrupa pelo campo `tipo` (Leve / Média / Pesada / Escudo)
function optgroupsPorTipo(lista, formatarRotulo) {
  const grupos = {};
  for (const it of lista) {
    const cat = it.tipo || 'Outros';
    (grupos[cat] = grupos[cat] || []).push(it);
  }
  const ordem = ['Leve', 'Média', 'Pesada', 'Escudo'];
  return Object.keys(grupos).sort((a,b) => {
    const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  }).map(cat => `<optgroup label="${escape(cat)}">
    ${grupos[cat].map(it => `<option value='${escape(JSON.stringify(it))}'>${formatarRotulo(it)}</option>`).join('')}
  </optgroup>`).join('');
}

function renderTabelaItens(tipo, itens, colunas, campos) {
  if (!itens.length) return `<div class="item-vazio">Nenhum ${tipo === 'armas' ? 'arma' : (tipo === 'armaduras' ? 'armadura' : 'item')}. Adicione abaixo.</div>`;
  return `<table class="item-tabela">
    <thead><tr>${colunas.map(c => `<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody>${itens.map((it, idx) => `
      <tr>${campos.map((f, ci) => `<td data-label="${escape(colunas[ci])}">${escape(it[f] ?? '—')}</td>`).join('')}
      <td style="text-align:right"><button type="button" class="lixo" data-rm="${tipo}" data-idx="${idx}" aria-label="Remover">✕</button></td></tr>
    `).join('')}</tbody>
  </table>`;
}

          <div class="cr-atr">

/* ===== BUSCADOR DO BESTIÁRIO (Manual dos Monstros) ===== */
let _bestiario = null;          // cache do monstros_data.json
let _bestiarioErro = false;

/* Favoritos do bestiário POR PERSONAGEM — em characters.bestiario_favoritos (banco).
   Guardados pelo NOME canônico (maiúsculas, como no monstros_data.json). */
function favLista() {
  if (!charAtivo) return [];
  if (!Array.isArray(charAtivo.bestiario_favoritos)) charAtivo.bestiario_favoritos = [];
  return charAtivo.bestiario_favoritos;
}
function favTem(nome) { return favLista().includes(nome); }
function favToggle(nome) {
  const lista = favLista();
  const i = lista.indexOf(nome);
  if (i >= 0) lista.splice(i, 1); else lista.push(nome);
  salvarFavoritosBestiario();
  return lista.includes(nome);
}
async function salvarFavoritosBestiario() {
  if (!charAtivo?.id) return;
  _ultimoSaveLocal = Date.now();
  const { error } = await window.sb.from('characters')
    .update({ bestiario_favoritos: charAtivo.bestiario_favoritos || [] })
    .eq('id', charAtivo.id);
  if (error) console.warn('[favoritos] erro ao salvar:', error);
}

function semAcento(s) {
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function tituloBonito(s) {
  // "GOLEM DE CARNE" → "Golem de Carne"
  const minusc = new Set(['de','da','do','dos','das','e','a','o','com','na','no','à']);
  return (s || '').toLowerCase().split(/\s+/).map((w, i) =>
    (i > 0 && minusc.has(w)) ? w : (w.charAt(0).toUpperCase() + w.slice(1))
  ).join(' ');
}

async function carregarBestiario() {
  if (_bestiario) return _bestiario;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch('../data/monstros_data.json', { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _bestiario = await r.json();
    return _bestiario;
  } catch (e) {
    _bestiarioErro = true;
    console.warn('[bestiário] falha:', e);
    return null;
  } finally { clearTimeout(t); }
}

function abrirBuscadorMonstros() {
  let ov = document.getElementById('bm-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'bm-overlay';
    ov.className = 'bm-overlay';
    ov.innerHTML = `
      <div class="bm-modal" role="dialog" aria-modal="true" aria-labelledby="bm-titulo">
        <div class="bm-header">
          <div class="bm-titulo" id="bm-titulo">🔍 Bestiário — Manual dos Monstros</div>
          <button type="button" class="bm-close" id="bm-close">Fechar ✕</button>
        </div>
        <div class="bm-search">
          <input type="search" id="bm-input" placeholder="Buscar criatura pelo nome… (ex.: dragão, golem, lobo)" autocomplete="off">
        </div>
        <div class="bm-result" id="bm-result"></div>
      </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) fecharBuscadorMonstros(); });
    document.getElementById('bm-close').addEventListener('click', fecharBuscadorMonstros);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('bm-overlay')?.classList.contains('open')) fecharBuscadorMonstros();
    });
    const inp = document.getElementById('bm-input');
    inp.addEventListener('input', () => renderResultadosMonstros(inp.value));
    // delegação: adicionar + favoritar
    document.getElementById('bm-result').addEventListener('click', e => {
      const add = e.target.closest('[data-add-monstro]');
      if (add) { adicionarMonstroBusca(+add.dataset.addMonstro, add); return; }
      const fav = e.target.closest('[data-fav-monstro]');
      if (fav) {
        const m = _bestiario[+fav.dataset.favMonstro];
        if (!m) return;
        const agora = favToggle(m.nome);
        fav.textContent = agora ? '★' : '☆';
        fav.classList.toggle('on', agora);
        fav.setAttribute('aria-pressed', String(agora));
        fav.title = agora ? 'Remover dos favoritos' : 'Favoritar';
        if (window.FX) FX.favorito(fav, agora);
      }
    });
  }
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  const result = document.getElementById('bm-result');
  result.innerHTML = Array.from({length:6}, () => `
    <div class="bm-item bm-skel">
      <div class="bm-thumb shimmer"></div>
      <div class="bm-item-info" style="flex:1">
        <div class="shimmer" style="height:14px;width:55%;border-radius:4px;margin-bottom:7px"></div>
        <div class="shimmer" style="height:11px;width:38%;border-radius:4px;margin-bottom:7px"></div>
        <div class="shimmer" style="height:11px;width:70%;border-radius:4px"></div>
      </div>
    </div>`).join('');
  carregarBestiario().then(b => {
    if (!b) { result.innerHTML = '<div class="bm-vazio">⚠ Não foi possível carregar o bestiário.</div>'; return; }
    renderResultadosMonstros(document.getElementById('bm-input').value);
    setTimeout(() => document.getElementById('bm-input')?.focus(), 60);
  });
}

let _bmAdicionou = false;
function fecharBuscadorMonstros() {
  const ov = document.getElementById('bm-overlay');
  if (ov) ov.classList.remove('open');
  document.body.style.overflow = '';
  _bmAdicionou = false;
  // Re-renderiza a aba (atualiza lista de aliados E o dropdown de favoritos)
  if (tabAtiva === 'aliados') render();
}

function itemMonstroHTML(m) {
  const idx = _bestiario.indexOf(m);
  const fav = favTem(m.nome);
  const thumb = m.imagem
    ? `<div class="bm-thumb"><img src="${escape(m.imagem)}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`
    : `<div class="bm-thumb bm-thumb-vazio">🐲</div>`;
  return `
    <div class="bm-item">
      <button type="button" class="bm-fav ${fav ? 'on' : ''}" data-fav-monstro="${idx}" aria-pressed="${fav}" title="${fav ? 'Remover dos favoritos' : 'Favoritar'}">${fav ? '★' : '☆'}</button>
      ${thumb}
      <div class="bm-item-info">
        <div class="bm-item-nome">${escape(tituloBonito(m.nome))}</div>
        <div class="bm-item-meta">${escape(m.tipo || '')}</div>
        <div class="bm-item-stats">🛡️ CA ${m.ca} · ❤️ ${m.hp_max} PV · ⚔ ${escape(m.nd || 'ND —')}</div>
      </div>
      <button type="button" class="bm-add no-lock" data-add-monstro="${idx}" title="Adicionar à ficha">+ Adicionar</button>
    </div>`;
}

function renderResultadosMonstros(termo) {
  const result = document.getElementById('bm-result');
  if (!_bestiario) return;
  const q = semAcento(termo).trim();

  if (!q) {
    // Sem busca: mostra Favoritos no topo + dica
    const favs = _bestiario.filter(m => favTem(m.nome));
    let html = '';
    if (favs.length) {
      html += `<div class="bm-secao">⭐ Favoritos</div>` + favs.map(itemMonstroHTML).join('');
      html += `<div class="bm-secao">Todas as criaturas</div>`;
    }
    html += `<div class="bm-dica">${_bestiario.length} criaturas. Digite para filtrar pelo nome.</div>`;
    html += _bestiario.slice(0, 60).map(itemMonstroHTML).join('');
    if (_bestiario.length > 60) html += `<div class="bm-dica">Mostrando 60 de ${_bestiario.length}. Use a busca.</div>`;
    result.innerHTML = html;
    return;
  }

  const lista = _bestiario.filter(m => semAcento(m.nome).includes(q));
  const total = lista.length;
  if (!total) {
    result.innerHTML = `<div class="bm-vazio">Nenhuma criatura encontrada para “${escape(termo)}”.</div>`;
    return;
  }
  result.innerHTML =
    lista.slice(0, 80).map(itemMonstroHTML).join('') +
    (total > 80 ? `<div class="bm-dica">Mostrando 80 de ${total}. Refine a busca.</div>` : '');
}

// Converte um monstro do bestiário em companion e adiciona à ficha.
function adicionarMonstroObj(m) {
  if (!m) return null;
  const sentidos = [m.sentidos, m.pericias && ('Perícias: ' + m.pericias)].filter(Boolean).join(' · ');
  const resist = [m.resistencias, m.vulnerabilidades && ('Vulnerável: ' + m.vulnerabilidades)].filter(Boolean).join(' · ');
  const nova = {
    id: 'cr_' + Date.now().toString(36) + Math.floor(Math.random()*1000),
    nome: tituloBonito(m.nome),
    tipo: m.tipo || '',
    ca: m.ca || 10, hp_max: m.hp_max || 1, hp_atual: m.hp_max || 1,
    pv_dados: m.pv_dados || '',
    imagem: m.imagem || '',
    deslocamento: m.deslocamento || '',
    atributos: { ...m.atributos },
    resistencias: resist,
    imunidades: m.imunidades || '',
    sentidos,
    idiomas: m.idiomas || '',
    nd: m.nd || '',
    tracos: (m.tracos || []).map(t => ({ ...t })),
    acoes: (m.acoes || []).map(t => ({ ...t })),
    notas: 'Fonte: Manual dos Monstros.',
  };
  _companionsAtuais().push(nova);
  salvarCompanionsSeguro();
  toast(`✓ ${nova.nome} adicionado aos Aliados`);
  return nova;
}

function adicionarMonstroBusca(idx, btn) {
  const m = _bestiario && _bestiario[idx];
  if (!m) return;
  adicionarMonstroObj(m);
  _bmAdicionou = true;
  // feedback sem fechar (permite adicionar vários)
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Adicionado';
    btn.classList.add('add-ok');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('add-ok'); }, 1400);
  }
}

function conectarListenersAliados() {
  const wrap = document.getElementById('aliados-wrap');

  // Adicionar criatura (template rápido)
  const btnAdd = document.getElementById('btn-add-aliado');
  if (btnAdd) btnAdd.addEventListener('click', async () => {
    const sel = document.getElementById('aliado-template');
    const valor = sel ? sel.value : 'novo';
    if (valor.startsWith('fav:')) {
      // Favorito → busca a criatura no bestiário pelo nome canônico
      const nome = valor.slice(4);
      btnAdd.disabled = true;
      const bestiario = await carregarBestiario();
      btnAdd.disabled = false;
      const m = bestiario && bestiario.find(x => x.nome === nome);
      if (!m) { toast('⚠ Criatura não encontrada no bestiário'); return; }
      adicionarMonstroObj(m);
      render();
      destacarUltimaCriatura();
      return;
    }
    // Em branco
    const nova = JSON.parse(JSON.stringify(TEMPLATES_CRIATURA.novo));
    nova.id = 'cr_' + Date.now().toString(36);
    _companionsAtuais().push(nova);
    salvarCompanionsSeguro();
    render();
    destacarUltimaCriatura();
  });

  // Buscar no bestiário completo
  const btnBuscar = document.getElementById('btn-buscar-monstro');
  if (btnBuscar) btnBuscar.addEventListener('click', abrirBuscadorMonstros);

  if (!wrap) return;

  // Edição de campos de texto/número (delegação)
  wrap.addEventListener('input', e => {
    const el = e.target;
    const i = el.dataset.cr;
    if (i === undefined) return;
    const cr = _companionsAtuais()[+i];
    if (!cr) return;

    if (el.dataset.crCampo) {
      const campo = el.dataset.crCampo;
      if (['ca','hp_atual','hp_max'].includes(campo)) {
        cr[campo] = parseInt(el.value, 10) || 0;
        if (campo === 'hp_atual' || campo === 'hp_max') atualizarBarraHpCriatura(+i);
      } else {
        cr[campo] = el.value;
      }
    } else if (el.dataset.crAtr) {
      if (!cr.atributos) cr.atributos = {};
      cr.atributos[el.dataset.crAtr] = parseInt(el.value, 10) || 10;
      const modEl = document.querySelector(`[data-cr-mod="${i}-${el.dataset.crAtr}"]`);
      if (modEl) modEl.textContent = fmtMod(modCriatura(cr.atributos[el.dataset.crAtr]));
    }
    agendarSalvarCompanions();
  });

  // Botões de dano/cura rápida + deletar (click delegado)
  wrap.addEventListener('click', e => {
    const dmg = e.target.closest('[data-cr-dmg]');
    if (dmg) {
      const i = +dmg.dataset.crDmg;
      const v = +dmg.dataset.v;
      const cr = _companionsAtuais()[i];
      if (!cr) return;
      const max = cr.hp_max ?? 1;
      cr.hp_atual = Math.max(0, Math.min(max, (cr.hp_atual ?? max) + v));
      const inp = document.querySelector(`input[data-cr-campo="hp_atual"][data-cr="${i}"]`);
      if (inp) inp.value = cr.hp_atual;
      atualizarBarraHpCriatura(i);
      agendarSalvarCompanions();
      return;
    }
    const rolar = e.target.closest('[data-cr-rolar]');
    if (rolar) {
      const i = +rolar.dataset.crRolar;
      const cr = _companionsAtuais()[i];
      if (!cr || !cr.pv_dados) return;
      const novoHp = rolarDadosVida(cr.pv_dados);
      if (novoHp == null) { toast('⚠ Fórmula de dados inválida'); return; }
      cr.hp_max = novoHp;
      cr.hp_atual = novoHp;
      const inpMax = document.querySelector(`input[data-cr-campo="hp_max"][data-cr="${i}"]`);
      const inpAtu = document.querySelector(`input[data-cr-campo="hp_atual"][data-cr="${i}"]`);
      const aplicar = () => {
        if (inpAtu) inpAtu.value = novoHp;
        atualizarBarraHpCriatura(i);
        agendarSalvarCompanions();
        toast(`🎲 ${cr.nome}: ${cr.pv_dados} = ${novoHp} PV`);
      };
      // Animação de rolagem no campo de PV máx, depois assenta
      if (window.FX && inpMax && inpMax.tagName === 'INPUT') {
        // input não anima textContent; embaralha o value
        let n = 0; const passos = 12;
        const timer = setInterval(() => {
          n++; inpMax.value = 1 + Math.floor(Math.random() * Math.max(novoHp, 6));
          if (n >= passos) { clearInterval(timer); inpMax.value = novoHp; FX.pulso(inpMax); aplicar(); }
        }, 45);
      } else {
        if (inpMax) inpMax.value = novoHp;
        aplicar();
      }
      return;
    }
    const imgEdit = e.target.closest('[data-cr-img-edit]');
    if (imgEdit) {
      const i = +imgEdit.dataset.crImgEdit;
      const cr = _companionsAtuais()[i];
      if (!cr) return;
      const url = prompt('Cole a URL da imagem da criatura (deixe vazio para remover):', cr.imagem || '');
      if (url === null) return;  // cancelou
      cr.imagem = url.trim();
      salvarCompanionsSeguro();
      render();
      return;
    }
    const img = e.target.closest('[data-cr-img]');
    if (img) {
      const i = +img.dataset.crImg;
      const cr = _companionsAtuais()[i];
      if (!cr) return;
      if (cr.imagem) abrirLightboxCriatura(cr.imagem, cr.nome);   // tem imagem → amplia
      else {                                                       // sem imagem → adiciona
        const url = prompt('Cole a URL da imagem da criatura:', '');
        if (url === null) return;
        cr.imagem = url.trim();
        salvarCompanionsSeguro();
        render();
      }
      return;
    }
    const del = e.target.closest('[data-cr-del]');
    if (del) {
      const i = +del.dataset.crDel;
      const cr = _companionsAtuais()[i];
      window.Confirmar
        ? window.Confirmar.perguntar({ titulo: 'Remover criatura?', mensagem: `"${cr?.nome||'Criatura'}" será removida.`, confirmar: 'Remover', danger: true }).then(ok => {
            if (ok) { _companionsAtuais().splice(i, 1); salvarCompanionsSeguro(); render(); }
          })
        : (confirm('Remover criatura?') && (_companionsAtuais().splice(i,1), salvarCompanionsSeguro(), render()));
    }
  });
}

// Rola uma fórmula de dados de vida (ex.: "11d8 + 44", "2d8 - 1") e retorna o total (mín. 1)
function rolarDadosVida(formula) {
  const m = (formula || '').replace(/\s/g, '').replace('–', '-').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if (!m) return null;
  const qtd = +m[1], faces = +m[2], bonus = m[3] ? +m[3] : 0;
  if (qtd < 1 || qtd > 100 || faces < 2) return null;
  let total = 0;
  for (let r = 0; r < qtd; r++) total += 1 + Math.floor(Math.random() * faces);
  return Math.max(1, total + bonus);
}

function atualizarBarraHpCriatura(i) {
  const cr = _companionsAtuais()[i];
  if (!cr) return;
  const max = cr.hp_max ?? 1;
  const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((cr.hp_atual ?? max) / max * 100))) : 0;
  const fill = document.querySelector(`.criatura-card[data-cr="${i}"] .cc-hpfill`);
  if (fill) {
    fill.style.width = pct + '%';
    fill.className = 'cc-hpfill ' + (pct <= 15 ? 'critico' : pct <= 35 ? 'baixo' : pct <= 65 ? 'medio' : '');
  }
}

// Aplica/remove modo bloqueado nos campos do Roleplay (exceto Inspiração e Retrato)
function aplicarBloqueioRoleplay(bloqueado) {
  const blocos = document.querySelectorAll('[data-rp-lock]');
  blocos.forEach(b => {
    b.classList.toggle('rp-locked', bloqueado);
    b.querySelectorAll('input, textarea').forEach(el => {
      if (bloqueado) el.setAttribute('readonly', '');
      else el.removeAttribute('readonly');
    });
  });
  const btn = document.getElementById('btn-rp-toggle');
  const lbl = document.getElementById('btn-rp-label');
  const hint = document.getElementById('rp-lock-hint');
  if (btn) btn.setAttribute('aria-pressed', String(!bloqueado));
  if (lbl) lbl.textContent = bloqueado ? 'Editar' : 'Salvar e travar';
  if (btn) btn.classList.toggle('editando', !bloqueado);
  if (hint) hint.style.display = bloqueado ? '' : 'none';
}

// Lock genérico para qualquer bloco [data-X-lock]
