<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Regras da Casa da mesa — escolha entre as Regras (ajustes de descanso, morte, críticos e mais) e a Tabela de Críticos (d100).">
<meta name="theme-color" content="#0d0e0c">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<title>Regras da Casa — D&D 5e</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<script src="../assets/vendor/iconify-icon-2.1.0.min.js"></script>
<script src="../assets/js/icones.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--bg);
    background-image: radial-gradient(ellipse at top, color-mix(in srgb, var(--surface) 65%, var(--bg)) 0%, var(--bg-soft) 45%, var(--bg) 100%);
    font-family: var(--font-body); color: var(--text); }

  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 60px 16px; }

  .intro { font-style: italic; color: var(--text-muted); text-align: center; margin: 0 0 40px; font-size: 16px; }

  .opcoes { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }

  .opcao-card {
    display: flex; flex-direction: column; align-items: center; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 44px 36px 36px; width: clamp(260px, 38vw, 380px); position: relative; cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    box-shadow: 0 4px 16px var(--shadow); overflow: hidden;
  }
  .opcao-card:hover { transform: translateY(-4px); border-color: var(--border); box-shadow: 0 14px 32px var(--shadow); }
  .opcao-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right, transparent, var(--gold-light), transparent); opacity: 0; transition: opacity .3s; }
  .opcao-card:hover::after { opacity: 1; }

  .opcao-card .corner { position: absolute; color: var(--border); font-size: 12px; opacity: .5; transition: opacity .3s, color .3s; }
  .opcao-card:hover .corner { opacity: .9; color: var(--gold-light); }
  .corner.tl { top: 8px; left: 12px; } .corner.tr { top: 8px; right: 12px; }
  .corner.bl { bottom: 8px; left: 12px; } .corner.br { bottom: 8px; right: 12px; }

  .opcao-icon { font-size: 56px; color: var(--gold-light); margin-bottom: 20px; transition: transform .3s, color .3s;
    line-height: 1; display: flex; align-items: center; justify-content: center; }
  .opcao-card:hover .opcao-icon { transform: scale(1.06); }

  .opcao-nome { font-family: var(--font-heading); font-size: clamp(16px, 2vw, 20px); font-weight: 700;
    color: var(--text); letter-spacing: .5px; margin-bottom: 8px; }
  .opcao-desc { font-family: var(--font-body); font-style: italic; font-size: clamp(13px, 1.4vw, 15px);
    color: var(--text-muted); line-height: 1.5; margin-bottom: 22px; }

  .opcao-cta { padding: 9px 26px; background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    font-family: var(--font-heading); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    border-radius: var(--radius-sm); transition: all .2s; }
  .opcao-card:hover .opcao-cta { background: var(--gold); color: var(--bg); border-color: var(--gold-light); }

  @media (max-width: 700px) {
    main { padding: 30px 16px; }
    .opcoes { flex-direction: column; align-items: center; gap: 20px; }
    .opcao-card { width: 100%; padding: 36px 28px 30px; }
  }
</style>
</head>
<body data-ambiente="fagulhas">

<header class="site-header">
  <a href="../index.html" class="back-btn">← Início</a>
  <div class="header-title"><span data-ico="dado" aria-hidden="true"></span> Regras da Casa</div>
  <span style="width:70px"></span>
</header>

<main>
  <p class="intro">Regras específicas desta mesa, além do livro básico — vale pra todo mundo, jogadores e mestre. Escolha o que quer ver:</p>

  <div class="opcoes">
    <a href="regras_lista.html" class="opcao-card">
      <span class="corner tl" aria-hidden="true">✦</span>
      <span class="corner tr" aria-hidden="true">✦</span>
      <span class="corner bl" aria-hidden="true">✦</span>
      <span class="corner br" aria-hidden="true">✦</span>
      <div class="opcao-icon" aria-hidden="true" data-ico="pergaminho"></div>
      <div class="opcao-nome">Regras</div>
      <div class="opcao-desc">Descanso, morte, inspiração e mais</div>
      <div class="opcao-cta">Abrir Regras</div>
    </a>

    <a href="tabela_criticos.html" class="opcao-card">
      <span class="corner tl" aria-hidden="true">✦</span>
      <span class="corner tr" aria-hidden="true">✦</span>
      <span class="corner bl" aria-hidden="true">✦</span>
      <span class="corner br" aria-hidden="true">✦</span>
      <div class="opcao-icon" aria-hidden="true" data-ico="caveira"></div>
      <div class="opcao-nome">Tabela de Críticos</div>
      <div class="opcao-desc">Sucessos e falhas críticas (d100)</div>
      <div class="opcao-cta">Abrir Tabela</div>
    </a>
  </div>
</main>

<script src="../assets/js/ambiente.js"></script>
<script src="../assets/js/polish.js"></script>
</body>
</html>
