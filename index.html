<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Mestre — D&D 5e</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0608;
    --bg-mid: #150a0c;
    --gold: #8B6914;
    --gold-bright: #b88a2c;
    --gold-light: #d4a843;
    --blood: #6b1010;
    --blood-bright: #8b1d1d;
    --parchment: #d4c5a0;
    --parchment-dim: #a89878;
    --shadow: #050304;
  }

  html, body {
    min-height: 100vh;
    background-color: var(--bg-deep);
    background-image: radial-gradient(ellipse at top, #2a1518 0%, #150a0c 50%, #050304 100%);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    width: 100%;
    text-align: center;
  }

  /* ===== CABEÇALHO ===== */
  .crest {
    font-size: 48px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 12px rgba(139,105,20,0.5));
    animation: float 4s ease-in-out infinite;
    display: block;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--gold-bright);
    text-shadow:
      0 0 30px rgba(184,138,44,0.4),
      2px 2px 0 var(--shadow);
    font-variant: small-caps;
    line-height: 1.2;
  }

  .subtitle {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--parchment-dim);
    margin-top: 10px;
    letter-spacing: 2px;
  }
  .subtitle::before { content: '— '; color: var(--blood-bright); }
  .subtitle::after  { content: ' —'; color: var(--blood-bright); }

  .divider {
    width: 70%;
    max-width: 500px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-bright), transparent);
    margin: 24px auto;
    box-shadow: 0 0 6px rgba(184,138,44,0.3);
  }

  .prompt {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--parchment-dim);
    margin-bottom: 36px;
  }

  /* ===== CARDS DE CAMPANHA ===== */
  .campaigns {
    display: flex;
    gap: 28px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .campaign-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    background: linear-gradient(160deg, #1f1416 0%, #150c0e 60%, #0d0709 100%);
    border: 2px solid var(--gold);
    border-radius: 4px;
    padding: 36px 32px 30px;
    width: 280px;
    position: relative;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:
      0 6px 24px rgba(0,0,0,0.7),
      inset 0 0 30px rgba(0,0,0,0.5),
      0 0 0 1px var(--blood) inset;
    overflow: hidden;
  }

  .campaign-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(139,105,20,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .campaign-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(to right, transparent, var(--gold-bright), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .campaign-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--gold-bright);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.8),
      0 0 20px rgba(139,105,20,0.25),
      inset 0 0 30px rgba(0,0,0,0.4),
      0 0 0 1px var(--blood-bright) inset;
  }
  .campaign-card:hover::after { opacity: 1; }

  .campaign-card .corner {
    position: absolute;
    color: var(--blood);
    font-size: 14px;
    opacity: 0.6;
    transition: opacity 0.3s, color 0.3s;
  }
  .campaign-card:hover .corner { opacity: 1; color: var(--gold-bright); }
  .corner.tl { top: 6px; left: 10px; }
  .corner.tr { top: 6px; right: 10px; }
  .corner.bl { bottom: 6px; left: 10px; }
  .corner.br { bottom: 6px; right: 10px; }

  .campaign-icon {
    font-size: 52px;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 8px rgba(139,29,29,0.5));
    transition: transform 0.3s, filter 0.3s;
    line-height: 1;
  }
  .campaign-card:hover .campaign-icon {
    transform: scale(1.1);
    filter: drop-shadow(0 0 16px rgba(184,138,44,0.6));
  }

  .campaign-name {
    font-family: 'Cinzel Decorative', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: 1px;
    line-height: 1.25;
    margin-bottom: 8px;
    text-shadow: 1px 1px 3px var(--shadow);
  }

  .campaign-desc {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--parchment-dim);
    line-height: 1.5;
  }

  .campaign-cta {
    margin-top: 20px;
    padding: 7px 20px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--parchment-dim);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .campaign-card:hover .campaign-cta {
    background: var(--gold);
    color: var(--shadow);
    border-color: var(--gold-bright);
  }

  /* Tema Strahd */
  .campaign-card.strahd {
    background: linear-gradient(160deg, #200e10 0%, #160a0c 60%, #0d0608 100%);
    border-color: var(--blood-bright);
  }
  .campaign-card.strahd .campaign-cta { border-color: var(--blood-bright); }
  .campaign-card.strahd:hover {
    border-color: var(--blood-bright);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.8),
      0 0 20px rgba(139,29,29,0.3),
      inset 0 0 30px rgba(0,0,0,0.4),
      0 0 0 1px var(--blood-bright) inset;
  }
  .campaign-card.strahd:hover .campaign-cta {
    background: var(--blood-bright);
    color: var(--parchment);
    border-color: var(--blood-bright);
  }
  .campaign-card.strahd::after {
    background: linear-gradient(to right, transparent, var(--blood-bright), transparent);
  }

  /* ===== RODAPÉ ===== */
  .footer {
    margin-top: 52px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(168, 152, 120, 0.45);
    letter-spacing: 1px;
  }

  @media (max-width: 640px) {
    .title { font-size: 24px; letter-spacing: 2px; }
    .campaign-card { width: 100%; max-width: 320px; }
    .campaigns { gap: 20px; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <span class="crest">⚔️</span>

  <h1 class="title">Painel do Mestre</h1>
  <p class="subtitle">Escolha a Campanha</p>

  <div class="divider"></div>

  <p class="prompt">Qual aventura começa esta noite?</p>

  <div class="campaigns">

    <a href="painel_barovia_dnd5e.html" class="campaign-card strahd">
      <span class="corner tl">✠</span>
      <span class="corner tr">✠</span>
      <span class="corner bl">✠</span>
      <span class="corner br">✠</span>
      <div class="campaign-icon">🧛</div>
      <div class="campaign-name">Maldição de Strahd</div>
      <div class="campaign-desc">Crônicas de Barovia<br>O Castelo Ravenloft aguarda</div>
      <div class="campaign-cta">Entrar na Névoa</div>
    </a>

    <a href="painel_mestre_dnd5e.html" class="campaign-card">
      <span class="corner tl">✦</span>
      <span class="corner tr">✦</span>
      <span class="corner bl">✦</span>
      <span class="corner br">✦</span>
      <div class="campaign-icon">🗺️</div>
      <div class="campaign-name">Crônica dos Aventureiros</div>
      <div class="campaign-desc">Campanha Principal<br>A jornada continua</div>
      <div class="campaign-cta">Iniciar Sessão</div>
    </a>

  </div>

  <div class="footer">D&amp;D 5ª Edição · Painel do Mestre</div>

</div>

</body>
</html>
